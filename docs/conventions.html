<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 컨벤션 — 규칙 조회</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
h1, h2, p, ul, li, pre, button, input, select { margin: 0; padding: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

:root {
	--paper: #eef1f3; --card: #fff; --sunk: #e3e8eb;
	--ink: #141a1d; --ink-2: #47545a; --muted: #77868c;
	--rule: #d5dcdf; --rule-2: #b4bfc4;
	--accent: #0d5c7a; --accent-bg: #0d5c7a14; --on-accent: #fff;
	--bad: #b3312a; --bad-bg: #b3312a0f;
	--good: #1f6d4d; --good-bg: #1f6d4d0f;
	--ember: #a8501c; --ember-2: #a8501c1f; --on-ember: #fff;
	--mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
	--sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
}

@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--paper: #12171a; --card: #1a2024; --sunk: #0d1114;
		--ink: #e4eaec; --ink-2: #a9b6bb; --muted: #7b898f;
		--rule: #293237; --rule-2: #3d4950;
		--accent: #5eb3d6; --accent-bg: #5eb3d61f; --on-accent: #0d1114;
		--bad: #e0897f; --bad-bg: #e0897f14;
		--good: #5cb98d; --good-bg: #5cb98d14;
		--ember: #d18a4e; --ember-2: #d18a4e26; --on-ember: #14181a;
	}
}

:root[data-theme="dark"] {
	--paper: #12171a; --card: #1a2024; --sunk: #0d1114;
	--ink: #e4eaec; --ink-2: #a9b6bb; --muted: #7b898f;
	--rule: #293237; --rule-2: #3d4950;
	--accent: #5eb3d6; --accent-bg: #5eb3d61f; --on-accent: #0d1114;
	--bad: #e0897f; --bad-bg: #e0897f14;
	--good: #5cb98d; --good-bg: #5cb98d14;
	--ember: #d18a4e; --ember-2: #d18a4e26; --on-ember: #14181a;
}

body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar { position: sticky; top: 0; z-index: 40; background: var(--paper); border-bottom: 1px solid var(--rule); }
.topbar-in { max-width: 1440px; margin: 0 auto; padding: .7rem clamp(.75rem, 2vw, 1.5rem); display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
.brand { font-family: var(--mono); font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.skill-select { font-family: var(--mono); font-size: .78rem; font-weight: 600; color: var(--ink); background: var(--card); border: 1px solid var(--rule-2); border-radius: 2px; padding: .42rem .5rem; }
.skill-select:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-bg); }
.companion { flex-basis: 100%; display: flex; align-items: baseline; gap: .35rem; flex-wrap: wrap; font-family: var(--mono); font-size: .64rem; color: var(--muted); }
.companion:empty { display: none; }
.search-wrap { position: relative; flex: 1 1 280px; min-width: 180px; }
.search { width: 100%; font-family: var(--mono); font-size: .84rem; color: var(--ink); background: var(--card); border: 1px solid var(--rule-2); border-radius: 2px; padding: .5rem; }
.search:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-bg); }
.count { font-family: var(--mono); font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbtn { font-family: var(--mono); font-size: .68rem; color: var(--ink-2); border: 1px solid var(--rule-2); border-radius: 2px; padding: .25rem .5rem; }
.tbtn:hover { color: var(--ink); border-color: var(--ink-2); }

.shell { max-width: 1440px; margin: 0 auto; padding: 0 clamp(.75rem, 2vw, 1.5rem); }
.pane { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: clamp(1rem, 2.5vw, 2rem); padding: 1.25rem 0 4rem; }
/* 여기도 minmax(0,…) 이어야 한다. 1fr 이면 main 이 못 줄어 페이지가 가로로 늘어난다. */
@media (max-width: 900px) { .pane { grid-template-columns: minmax(0, 1fr); } }
.pane > main { min-width: 0; }

.rail { align-self: start; position: sticky; top: 5rem; display: flex; flex-direction: column; gap: 1.35rem; }
@media (max-width: 900px) { .rail { position: static; } }
.rail-hd { font-family: var(--mono); font-size: .64rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: .5rem; }
.chips { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .45rem; }
.chip { font-family: var(--mono); font-size: .68rem; color: var(--ink-2); background: var(--card); border: 1px solid var(--rule); border-radius: 2px; padding: .18rem .42rem; text-align: left; }
.chip:hover { border-color: var(--rule-2); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.n { font-variant-numeric: tabular-nums; opacity: .6; font-size: .92em; }

.imp { font-family: var(--mono); font-size: .62rem; font-weight: 600; letter-spacing: .06em; padding: .1rem .34rem; border-radius: 2px; border: 1px solid transparent; display: inline-flex; gap: .3rem; white-space: nowrap; }
.imp-CRITICAL { background: var(--ember); color: var(--on-ember); }
.imp-HIGH { background: var(--ember-2); color: var(--ember); }
.imp-MEDIUM-HIGH { border-color: var(--ember); color: var(--ember); }
.imp-MEDIUM { border-color: var(--rule-2); color: var(--muted); }

.list { display: flex; flex-direction: column; gap: .3rem; }
.row { background: var(--card); border: 1px solid var(--rule); border-left-width: 3px; border-left-color: var(--rule); border-radius: 2px; overflow: hidden; }
.row[data-imp="CRITICAL"] { border-left-color: var(--ember); }
.row[data-imp="HIGH"] { border-left-color: color-mix(in srgb, var(--ember) 55%, var(--rule)); }
.row[data-imp="MEDIUM-HIGH"] { border-left-color: color-mix(in srgb, var(--ember) 28%, var(--rule)); }
.row-hd { width: 100%; text-align: left; display: grid; grid-template-columns: 2.4rem minmax(0, 1fr) auto; align-items: baseline; gap: .1rem .7rem; padding: .6rem .75rem; }
.row-hd:hover { background: var(--sunk); }
@media (max-width: 640px) { .row-hd { grid-template-columns: 2rem minmax(0, 1fr); } .row-meta { grid-column: 2; margin-top: .3rem; } }
.row-main { display: flex; flex-direction: column; gap: .18rem; min-width: 0; }
.row-t1 { display: flex; gap: .5rem; flex-wrap: wrap; align-items: baseline; }
.row-title { font-size: .92rem; font-weight: 600; }
.row-id { font-family: var(--mono); font-size: .64rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-when { font-size: .8rem; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.row[data-open="1"] .row-when { display: block; }
.row-meta { display: flex; align-items: center; gap: .4rem; }
.row-ex { font-family: var(--mono); font-size: .64rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.row-body { display: none; border-top: 1px solid var(--rule); padding: .85rem .75rem 1rem; }
.row[data-open="1"] .row-body { display: block; }

.ex { display: flex; flex-direction: column; gap: .55rem; min-width: 0; }
.ex + .ex { margin-top: .9rem; }
.ex-hd { font-family: var(--mono); font-size: .66rem; font-weight: 600; display: flex; align-items: baseline; gap: .45rem; }
.ex-bad .ex-hd { color: var(--bad); }
.ex-good .ex-hd { color: var(--good); }
.ex-hd em { font-style: normal; font-weight: 400; color: var(--ink-2); font-family: var(--sans); font-size: .76rem; }

/* minmax(0,1fr): 1fr 이면 긴 코드 줄이 컬럼을 밀어내 박스가 행 밖으로 나간다. */
.diff { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: .7rem; align-items: start; }
@media (max-width: 860px) { .diff { grid-template-columns: minmax(0, 1fr); } }

.cbox { min-width: 0; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
.ex-bad .cbox { border-color: color-mix(in srgb, var(--bad) 30%, var(--rule)); background: var(--bad-bg); }
.ex-good .cbox { border-color: color-mix(in srgb, var(--good) 30%, var(--rule)); background: var(--good-bg); }
.cbox-hd { font-family: var(--mono); font-size: .62rem; color: var(--muted); padding: .28rem .5rem; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; }
pre.code { font-family: var(--mono); font-size: .715rem; line-height: 1.6; padding: .55rem .65rem; color: var(--ink); background: var(--card); tab-size: 2; overflow-x: auto; scrollbar-width: thin; }
pre.code::-webkit-scrollbar { height: 8px; }
pre.code::-webkit-scrollbar-track { background: var(--sunk); }
pre.code::-webkit-scrollbar-thumb { background: var(--rule-2); border-radius: 4px; }
.t-c { color: var(--muted); font-style: italic; }
.t-s { color: var(--good); }
.t-k { color: var(--accent); font-weight: 600; }
.t-g { color: var(--ember); }

.why { margin-top: .9rem; border-top: 1px dashed var(--rule); padding-top: .6rem; }
.why-btn { font-family: var(--mono); font-size: .66rem; color: var(--accent); display: flex; gap: .4rem; text-align: left; }
.why-body { display: none; max-width: 68ch; margin-top: .5rem; color: var(--ink-2); font-size: .84rem; }
.why[data-open="1"] .why-body { display: block; }
.why-body p { margin: 0 0 .5rem; }
.why-body code { font-family: var(--mono); font-size: .9em; background: var(--sunk); border: 1px solid var(--rule); border-radius: 2px; padding: 0 .22em; }
.why-body .tw { overflow-x: auto; margin: 0 0 .6rem; }
.why-body table { border-collapse: collapse; font-size: .8rem; min-width: 100%; }
.why-body th, .why-body td { border: 1px solid var(--rule); padding: .25rem .5rem; text-align: left; vertical-align: top; }
.why-body th { background: var(--sunk); font-family: var(--mono); font-size: .68rem; }
.why-body pre.code { border: 1px solid var(--rule); border-radius: 2px; margin: 0 0 .6rem; }

.xr { display: flex; flex-wrap: wrap; gap: .35rem; align-items: baseline; margin-top: .75rem; }
.xr-lb { font-family: var(--mono); font-size: .62rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.xr-a { font-family: var(--mono); font-size: .66rem; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius: 2px; padding: .1rem .35rem; background: var(--accent-bg); }
.xr-a:hover { border-color: var(--accent); }
.xr-a[data-ext="1"] { border-style: dashed; }
.xr-a[disabled] { color: var(--muted); cursor: default; }
.tagrow { display: flex; flex-wrap: wrap; gap: .25rem; margin-top: .6rem; }
.tag { font-family: var(--mono); font-size: .62rem; color: var(--muted); border: 1px solid var(--rule); border-radius: 2px; padding: .05rem .3rem; }
.tag:hover { color: var(--accent); border-color: var(--accent); }
.empty { font-family: var(--mono); font-size: .78rem; color: var(--muted); text-align: center; padding: 3rem 1rem; border: 1px dashed var(--rule); }
mark { background: color-mix(in srgb, var(--ember) 35%, transparent); color: inherit; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>

<header class="topbar">
	<div class="topbar-in">
		<div class="brand">팀 컨벤션</div>

			</div>
			<div>
				<div class="rail-hd"><span>태그</span><button class="tbtn" data-clear="tags">해제</button></div>
				<div class="chips" id="f-tags"></div>
			</div>
		</aside>
		<main><div class="list" id="list"></div></main>
	</div>
</div>

pescript","order":6,"prefix":"guardrails","title":"Guardrails and Review Checks","titleKo":"","impact":"MEDIUM"}],"rules":[{"skill":"astro","id":"component-compose-page-level-documents-through-_document-and-page-adjacent-shells","title":"Compose Page-level Documents Through `_document.astro` and `_head.astro`","titleKo":"","impact":"HIGH","impactDescription":"keeps repeated document, head, and body shell composition out of route files while preserving a single page-level entry point","appliesWhen":"","tags":["component","document","head","pages","seo"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"component","prose":[{"type":"line","text":"page-level entry point)**"},{"type":"line","text":""},{"type":"line","text":"반복되는 top-level document composition이 필요하면 routed page는 `src/pages/_document.astro` 하나만 import합니다."},{"type":"line","text":""},{"type":"line","text":"소유권:"},{"type":"line","text":""},{"type":"line","text":"- Routed page: route data, page meta handoff, body content flow"},{"type":"line","text":"- `_document.astro`: `\u003chtml>`, `\u003chead>` 연결, `\u003cbody>`, shared body shell, base CSS import, `\u003cslot />`"},{"type":"line","text":"- `_head.astro`: SEO/meta/canonical/link/JSON-LD 계산과 head 전용 `Props`"},{"type":"line","text":"- `_document.css`: document shell style"},{"type":"line","text":""},{"type":"line","text":"금지:"},{"type":"line","text":""},{"type":"line","text":"- 각 page가 `\u003chtml>`, `\u003chead>`, `\u003cbody>` 조립을 반복"},{"type":"line","text":"- `_document.ts` 같은 중간 type-only contract 파일 추가"},{"type":"line","text":"- `Props extends DocumentMetaProps`처럼 얇은 타입 확장으로 contract 숨기기"},{"type":"line","text":"- 실제 재사용 경계 없는 `_page-chrome.astro` helper 추가"},{"type":"line","text":""},{"type":"line","text":"SEO library는 `_head.astro` 내부 구현 선택지일 뿐 필수 contract가 아닙니다."},{"type":"line","text":"중요한 기준은 page, document, head의 책임이 한눈에 보이고, routed page가 body content를 slot으로 전달한다는 점입니다."}],"examples":[{"kind":"incorrect","label":"각 page가 문서 조립을 반복함","blocks":[{"lang":"astro","code":"---\nimport Head from \"./_head.astro\";\n---\n\n\u003chtml lang=\"ko\">\n\t\u003cHead pageTitle=\"archive\" pageDescription=\"Archived entries\" />\n\t\u003cbody>\n\t\t\u003cheader>...\u003c/header>\n\t\t\u003cmain>\n\t\t\t\u003csection class=\"rt_entriesIndex__root\">...\u003c/section>\n\t\t\u003c/main>\n\t\u003c/body>\n\u003c/html>"}]},{"kind":"correct","label":"page는 document helper에 route body를 slot으로 전달","blocks":[{"lang":"astro","code":"---\nimport Document from \"@/pages/_document.astro\";\nimport WgEntryFeed from \"@/components/widget/entry-feed/wg-entry-feed.astro\";\n\nconst entries = await listEntries();\n---\n\n\u003cDocument currentPathname={Astro.url.pathname} pageTitle=\"entries\" pageDescription=\"Archived entries\">\n\t\u003csection class=\"rt_entriesIndex__root\">\n\t\t\u003cWgEntryFeed entries={entries} />\n\t\u003c/section>\n\u003c/Document>"},{"lang":"astro","code":"---\nimport \"./_document.css\";\nimport \"@/styles/base.css\";\nimport Head from \"./_head.astro\";\nimport WgSiteFooter from \"@/components/widget/site-footer/wg-site-footer.astro\";\nimport WgSiteHeader from \"@/components/widget/site-header/wg-site-header.astro\";\n\ninterface Props {\n\tcurrentPathname: string;\n\tpageTitle?: string;\n\tpageDescription?: string;\n}\n\nconst {currentPathname, pageTitle, pageDescription} = Astro.props as Props;\n---\n\n\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\t\u003cHead pageTitle={pageTitle} pageDescription={pageDescription} />\n\t\u003cbody class=\"rt_document__body\">\n\t\t\u003cWgSiteHeader currentPathname={currentPathname} />\n\t\t\u003cmain class=\"rt_document__main\">\n\t\t\t\u003cslot />\n\t\t\u003c/main>\n\t\t\u003cWgSiteFooter />\n\t\u003c/body>\n\u003c/html>"},{"lang":"astro","code":"---\ninterface Props {\n\tpageTitle?: string;\n\tpageDescription?: string;\n}\n\nconst {pageTitle, pageDescription} = Astro.props as Props;\nconst title = pageTitle ? `${pageTitle} | Site` : \"Site\";\nconst description = o","id":"rendering-use-prerender-false-for-request-bound-or-personalized-routes","title":"Use `prerender = false` for Request-bound or Personalized Routes","titleKo":"","impact":"CRITICAL","impactDescription":"keeps request-time logic on routes that actually execute per request","appliesWhen":"","tags":["prerender","ssr","rendering"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"rendering","prose":[{"type":"line","text":"쿠키, 인증 세션, 요청 헤더,"},{"type":"line","text":"요청마다 바뀌는 개인화 데이터에 의존하는 page나 endpoint는 static mode에서 `export const prerender = false`로 on-demand"},{"type":"line","text":"rendering을 명시합니다."},{"type":"line","text":"build 시점에 고정된 HTML로 만들 수 없는 동작을 정적 page 안에 억지로 숨기지 않습니다."},{"type":"line","text":"`output: \"server\"`를 이미 쓰는 프로젝트라면 같은 intent를 page-level로 다시 선언할 필요는 없습니다."}],"examples":[{"kind":"incorrect","label":"request-time 데이터에 의존하지만 정적 page처럼 둠","blocks":[{"lang":"astro","code":"---\nconst session = await getSession(Astro.request.headers);\n---\n\n\u003cDashboardPage session={session} />"}]},{"kind":"correct","label":"request-bound page임을 route boundary에서 드러냄","blocks":[{"lang":"astro","code":"---\nexport const prerender = false;\n\nconst session = await getSession(Astro.request.headers);\n---\n\n\u003cDashboardPage session={session} />"}]}]},{"skill":"astro","id":"responsibility-compose-layouts-from-widget-and-ui-only","title":"Compose Layouts from Widget and UI Only","titleKo":"","impact":"HIGH","impactDescription":"keeps layout files as route shells instead of letting them become domain-specific shared blocks","appliesWhen":"","tags":["responsibility","layouts","ui","widget","composition"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"responsibility","prose":[{"type":"line","text":"`_document.astro`나 route-local shell이 shell composition을 맡는다면,"},{"type":"line","text":"그 안에서 조립하는 shared piece는 `src/components/widget/**`와 `src/components/ui/**`로 제한합니다."},{"type":"line","text":""},{"type":"line","text":"구분 기준:"},{"type":"line","text":""},{"type":"line","text":"- `ui`: button, input, card, table, box, stack, surface, text 같은 primitive"},{"type":"line","text":"- `widget`: search-table, site-header, entry-feed, entry-detail처럼 `ui`를 조립한 reusable block"},{"type":"line","text":"- Document shell: `_document.astro` and `_document.css`"},{"type":"line","text":"- Route shell: owning route의 `_local/`"},{"type":"line","text":""},{"type":"line","text":"Shell 자체를 `ui-*`나 `widget-*`로 이름 붙여 shared component처럼 승격하지 않습니다."},{"type":"line","text":"Shell class는 `rt_document__*`처럼 owner가 드러나게 유지합니다."}],"examples":[{"kind":"incorrect","label":"layout 역할을 ui/widget로 위장함","blocks":[{"lang":"text","code":"src/components/ui/page-shell/ui-page-shell.astro\nsrc/components/widget/app-shell/widget-app-shell.astro"},{"lang":"astro","code":"---\nimport UiPageShell from \"@/components/ui/page-shell/ui-page-shell.astro\";\n---\n\n\u003cUiPageShell>\n\t\u003cslot />\n\u003c/UiPageShell>"}]},{"kind":"correct","label":"document shell은 pages-local에 남기고 shared piece만 ui/widget에서 조립","blocks":[{"lang":"astro","code":"---\nimport UiBox from \"@/components/ui/box/ui-box.astro\";\nimport UiStack from \"@/components/ui/stack/ui-stack.astro\";\nimport UiSurface from \"@/components/ui/surface/ui-surface.astro\";\nimport WgSiteHeader from \"@/components/widget/site-header/wg-site-header.astro\";\n\nconst { currentPathname } = Astro.props;\n---\n\n\u003cUiSurface class=\"rt_document__surface\">\n\t\u003cUiStack class=\"rt_document__stack\">\n\t\t\u003cUiBox class=\"rt_document__header\">\n\t\t\t\u003cWgSiteHeader currentPathname={currentPathname} />\n\t\t\u003c/UiBox>\n\t\t\u003cmain class=\"rt_document__main\">\n\t\t\t\u003cUiBox class=\"rt_document__content\">\n\t\t\t\t\u003cslot />\n\t\t\t\u003c/UiBox>\n\t\t\u003c/main>\n\t\u003c/UiStack>\n\u003c/UiSurface>"}]}]},{"skill":"astro","id":"responsibility-extract-route-local-sections-only-for-rendering-or-interaction-boundaries","title":"Extract Route-local Sections Only for Rendering or Interaction Boundaries","titleKo":"","impact":"HIGH","impactDescription":"keeps routed pages readable while avoiding premature `_local/` section extraction","appliesWhen":"","tags":["responsibility","local","islands","boundaries"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"responsibility","prose":[{"type":"line","text":"Move a section into `src/pages/**/_local/` only when it owns a real rendering or interaction boundary."},{"type":"line","text":""},{"type":"line","text":"추출할 수 있는 경계:"},{"type":"line","text":""},{"type":"line","text":"- `client:*` or `client:only` hydration"},{"type":"line","text":"- `server:defer` with fallback"},{"type":"line","text":"- form/action ownership"},{"type":"line","text":"- provider setup"},{"type":"line","text":"- browser-only custom element or script behavior"},{"type":"line","text":"- third-party widget adapter"},{"type":"line","text":"- repeated slot contract"},{"type":"line","text":""},{"type":"line","text":"Do not extract a component just because a heading/body/footer group looks like a section."},{"type":"line","text":"If the subtree still describes the same route surface,"},{"type":"line","text":"keep the route `rt_*` owner instead of inventing a `loc_*` namespace."}],"examples":[{"kind":"incorrect","label":"simple page markup is split into `_local/` wrappers","blocks":[{"lang":"astro","code":"---\nimport EntryBodySection from \"./_local/entry-body-section.astro\";\nimport EntryHeaderSection from \"./_local/entry-header-section.astro\";\nimport EntryMetaSection from \"./_local/entry-meta-section.astro\";\n\nconst { entry } = Astro.props;\n---\n\n\u003carticle class=\"rt_entryDetail__root\">\n\t\u003cEntryHeaderSection entry={entry} />\n\t\u003cEntryMetaSection entry={entry} />\n\t\u003cEntryBodySection html={entry.html} />\n\u003c/article>"}]},{"kind":"correct","label":"boundary가 있는 subtree만 `_local/`로 분리","blocks":[{"lang":"astro","code":"---\nimport RelatedEntriesPanel from \"./_local/related-entries-panel.astro\";\nimport EntryReactionIsland from \"./_local/entry-reaction-island.tsx\";\n\nconst { entry, relatedEntries } = Astro.props;\n---\n\n\u003carticle class=\"rt_entryDetail__root\">\n\t\u003cheader class=\"rt_entryDetail__header\">\n\t\t\u003ch1>{entry.title}\u003c/h1>\n\t\t\u003cp>{entry.description}\u003c/p>\n\t\u003c/header>\n\n\t\u003cdiv class=\"rt_entryDetail__meta\">\n\t\t\u003cspan>{entry.author}\u003c/span>\n\t\t\u003cspan>{entry.publishedAtLabel}\u003c/span>\n\t\u003c/div>\n\n\t\u003cdiv class=\"rt_entryDetail__body\" set:html={entry.html} />\n\n\t\u003cRelatedEntriesPanel server:defer entries={relatedEntries}>\n\t\t\u003cp slot=\"fallback\">Loading related entries...\u003c/p>\n\t\u003c/RelatedEntriesPanel>\n\n\t\u003cEntryReactionIsland client:visible entryId={entry.id} />\n\u003c/article>"}]}]},{"skill":"astro","id":"responsibility-extract-route-support-code-only-when-the-boundary-is-real","title":"Extract Route Support Code Only When the Boundary Is Real","titleKo":"","impact":"HIGH","impactDescription":"prevents routed pages from scattering one-off frontmatter logic into generic helper files","appliesWhen":"","tags":["responsibility","support-code","frontmatter","naming"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"responsibility","prose":[{"type":"line","text":"Route page frontmatter support code should move into owner-named support modules only when the boundary is real."},{"type":"line","text":""},{"type":"line","text":"추출할 수 있는 것:"},{"type":"line","text":""},{"type":"line","text":"- clear input/output data boundary"},{"type":"line","text":"- validation, auth, serialization, model building"},{"type":"line","text":"- shared route-family data loader"},{"type":"line","text":""},{"type":"line","text":"Page file에 남길 것:"},{"type":"line","text":""},{"type":"line","text":"- small one-off booleans"},{"type":"line","text":"- `Astro.props` destructuring"},{"type":"line","text":"- page-local labels"},{"type":"line","text":"- `class:list` conditions"},{"type":"line","text":"- empty-state branch choices"},{"type":"line","text":""},{"type":"line","text":"Do not create `_form.ts`, `_api.ts`, `utils.ts`, `helpers.ts`,"},{"type":"line","text":"or `common.ts` unless the owner name makes the boundary explicit."}],"examples":[{"kind":"incorrect","label":"small route-local calculations are scattered into generic helpers","blocks":[{"lang":"ts","code":"// src/pages/admin/entries/_form.ts\nexport const getHasActiveFilter = (filter?: string) => Boolean(filter);\n\nexport const getEmptyMessage = (filter?: string) => {\n\treturn filter ? \"No entries match this filter.\" : \"No entries yet.\";\n};"}]},{"kind":"correct","label":"owner-named support module에는 실제 route data boundary만 둠","blocks":[{"lang":"ts","code":"// src/pages/admin/entries/_entry-admin.ts\nimport type { EntryAdminInitialState } from \"./_local/entry-admin-runtime\";\n\n/**\n * @summary admin entries 화면의 초기 server state를 만든다.\n */\nexport const getEntryAdminInitialState = async (): Promise\u003cEntryAdminInitialState> => {\n\tconst entries = await entryAdminApi.listEntries();\n\n\treturn {\n\t\tentries: entries.map(toEntryAdminRow),\n\t};\n};"},{"lang":"astro","code":"---\nimport { getEntryAdminInitialState } from \"./_entry-admin\";\n\nconst initialState = await getEntryAdminInitialState();\nconst hasEntries = initialState.entries.length > 0;\nconst emptyMessage = hasEntries ? undefined : \"No entries yet.\";\n---"}]}]},{"skill":"astro","id":"responsibility-keep-page-adjacent-shells-imported-only-by-pages","title":"Keep Pages-local Document Helpers Imported Only by Pages","titleKo":"","impact":"HIGH","impactDescription":"preserves one-way dependency flow from routed pages to pages-local document helpers instead of letting shared code depend on routing helpers","appliesWhen":"","tags":["responsibility","pages","imports","dependency-direction","document-helpers"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"responsibility","prose":[{"type":"line","text":"shared code depend on routing helpers)**"},{"type":"line","text":""},{"type":"line","text":"`src/pages/_document.astro`, `_head.astro`,"},{"type":"line","text":"`_document.css` 같은 pages-local document helper는 routed page만 import합니다."},{"type":"line","text":""},{"type":"line","text":"의존 방향:"},{"type":"line","text":""},{"type":"line","text":"- Page entry imports `_document.astro`"},{"type":"line","text":"- `_document.astro` imports `_head.astro`, `_document.css`, `widget`, `ui`"},{"type":"line","text":"- `_document.astro`와 `_head.astro`는 각자 자기 로컬 `Props`를 직접 소유"},{"type":"line","text":"- `src/components/**`, shared utility, route-local `_local/` leaf는 document helper를 직접 import하지 않음"},{"type":"line","text":""},{"type":"line","text":"이 흐름을 지켜야 top-level document composition은 route boundary에 남고 shared component tier가 routing helper에 묶이지"},{"type":"line","text":"않습니다."}],"examples":[{"kind":"incorrect","label":"route-local leaf가 pages-local document helper를 직접 import함","blocks":[{"lang":"astro","code":"---\nimport DocumentShell from \"@/pages/_document.astro\";\n---\n\n\u003cDocumentShell currentPathname=\"/\" pageTitle=\"entries\" pageDescription=\"Archived entries\">\n\t\u003csection>\n\t\t\u003c!-- route-local body -->\n\t\u003c/section>\n\u003c/DocumentShell>"}]},{"kind":"correct","label":"page만 document helper를 알고, `_local/` leaf는 body만 렌더링","blocks":[{"lang":"astro","code":"---\nimport Document from \"@/pages/_document.astro\";\nimport EntryList from \"./_local/entry-list.astro\";\nimport { getEntries, getEntryListPageProps } from \"./_index\";\n\nconst entries = await getEntries();\nconst pageProps = getEntryListPageProps({\n\tentries,\n\tcurrentPage: 1,\n});\n---\n\n\u003cDocument currentPathname={Astro.url.pathname} pageTitle=\"entries\" pageDescription=\"Archived entries\">\n\t\u003cEntryList entries={pageProps.entries} />\n\u003c/Document>"},{"lang":"astro","code":"---\nimport type { EntryListItem } from \"../_index\";\n\nconst { entries } = Astro.props as { entries: EntryListItem[] };\n---\n\n\u003csection>\n\t\u003c!-- route-local body -->\n\u003c/section>"}]}]},{"skill":"astro","id":"responsibility-keep-page-files-focused-on-route-contract-and-data-handoff","title":"Keep Page Files Focused on Route Contract and Data Handoff","titleKo":"","impact":"HIGH","impactDescription":"keeps `src/pages` readable as route owners without reducing page files to import-only adapters","appliesWhen":"","tags":["pages","routing","responsibility"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"responsibility","prose":[{"type":"line","text":"Page file은 route owner 책임을 한눈에 보이게 유지합니다."},{"type":"line","text":""},{"type":"line","text":"Page file이 소유:"},{"type":"line","text":""},{"type":"line","text":"- URL contract"},{"type":"line","text":"- `getStaticPaths()` and `prerender`"},{"type":"line","text":"- search param 해석"},{"type":"line","text":"- page-level data selection"},{"type":"line","text":"- `currentPathname` and document meta handoff"},{"type":"line","text":"- high-level screen flow"},{"type":"line","text":""},{"type":"line","text":"분리 기준:"},{"type":"line","text":""},{"type":"line","text":"- Reusable render detail: `ui` or `widget`"},{"type":"line","text":"- Route-only browser interaction/provider: `_local/`"},{"type":"line","text":"- Request-time HTML/data selection: page boundary에서 `prerender = false` 여부도 함께 표시"},{"type":"line","text":"- Client island에 query state만 넘기는 경우: static 기본값 유지 가능"}],"examples":[{"kind":"incorrect","label":"page 파일이 route contract와 browser runtime detail을 한꺼번에 가짐","blocks":[{"lang":"astro","code":"---\nconst tab = Astro.url.searchParams.get(\"tab\") ?? \"all\";\nconst posts = await getPosts({ tab });\n---\n\n\u003csection>\n\t{posts.map((post) => (\n\t\t\u003carticle class=\"card\">\n\t\t\t\u003ch2>{post.title}\u003c/h2>\n\t\t\t\u003cPostRemoveModal postId={post.id} />\n\t\t\u003c/article>\n\t))}\n\u003c/section>"}]},{"kind":"correct","label":"page는 route/data/meta handoff와 screen flow를 소유하고 runtime boundary "reviewWith":[],"sectionPrefix":"verification","prose":[{"type":"line","text":"완료 보고에는 사용한 Figma 링크/node, 수정 scope, 구현한 visual parity 항목, 동적 데이터라서 하드코딩하지 않은 항목,"},{"type":"line","text":"정적 UI copy로 맞춘 항목, 브라우저 screenshot 검증 여부, 남은 mismatch, 실행한 검증 명령을 포함합니다."}],"examples":[{"kind":"incorrect","label":"검증 근거와 남은 차이를 생략","blocks":[{"lang":"md","code":"Figma에 맞춰 스타일 수정했습니다. 테스트도 통과했습니다."}]},{"kind":"correct","label":"완료 기준을 추적 가능하게 보고","blocks":[{"lang":"md","code":"- 사용한 Figma 링크/node: node-id=12:34\n- 수정 scope: src/pages/detail/**\n- 구현한 visual parity 항목: layout, spacing, typography, static copy\n- 동적 데이터라서 하드코딩하지 않은 항목: metric value, row count\n- 정적 UI copy로 맞춘 항목: tab label, empty state\n- 브라우저 screenshot 검증 여부: 완료\n- 남은 mismatch: chart axis는 canvas renderer 제한으로 남음\n- 실행한 검증 명령: npm run build, npm run test"}]}]},{"skill":"nestjs","id":"docs-keep-inline-comments-for-domain-rules-and-library-caveats","title":"Keep Inline Comments for Domain Rules and Library Caveats","titleKo":"","impact":"MEDIUM","impactDescription":"keeps inline comments reserved for backend constraints that would otherwise be easy to misread or accidentally remove","appliesWhen":"","tags":["comments","inline","domain-rules"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"docs","prose":[{"type":"line","text":"accidentally remove)**"},{"type":"line","text":""},{"type":"line","text":"함수 본문 내부에서는 JSDoc 블록 주석을 사용하지 않고, `//` 주석은 도메인 규칙, 정합성 제약, Prisma 동작 제약,"},{"type":"line","text":"트랜잭션 순서처럼 없으면 오해될 수 있는 내용에만 사용합니다."},{"type":"line","text":"변수명 그대로 반복하는 설명은 남기지 않습니다."}],"examples":[{"kind":"incorrect","label":"변수명 반복이나 자명한 설명","blocks":[{"lang":"ts","code":"const userId = params.id; // id 저장"}]},{"kind":"correct","label":"도메인 규칙이나 라이브러리 제약을 드러냄","blocks":[{"lang":"ts","code":"// 소프트 삭제된 사용자는 목록 조회에서 제외하되 단건 조회는 허용한다.\nconst where = includeDeleted ? {id} : {id, deletedAt: null};"}]}]},{"skill":"nestjs","id":"docs-require-jsdoc-on-service-hooks-and-boundary-methods","title":"Require JSDoc on Service Hooks and Boundary Methods","titleKo":"","impact":"MEDIUM-HIGH","impactDescription":"makes important backend execution boundaries searchable before readers inspect implementation details","appliesWhen":"","tags":["jsdoc","services","lifecycle"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"docs","prose":[{"type":"line","text":"details)**"},{"type":"line","text":""},{"type":"line","text":"Service public 메서드, Prisma 접근이나 외부 API 호출 블록, NestJS 생명주기 훅, 커스텀 `type`/`interface`,"},{"type":"line","text":"Guard/Interceptor/Pipe 핵심 메서드에는 예외 없이 JSDoc을 작성합니다."},{"type":"line","text":"Controller는 Swagger 데코레이터가 충분하면 JSDoc을 생략할 수 있습니다."},{"type":"line","text":"annotation 태그 선택은 companion skill인 `convention-typescript`의 표준인 `@api`, `@event`, `@watch`, `@helper`,"},{"type":"line","text":"`@summary`, `@field`를 따르되, 일반적인 NestJS 코드에서는 주로 `@api`, `@helper`, `@summary`, `@field`를 사용합니다."}],"examples":[{"kind":"incorrect","label":"핵심 서비스 메서드에 헤더 설명이 없음","blocks":[{"lang":"ts","code":"@Injectable()\nexport class UsersService {\n\tasync findOneOrThrow(id: number): Promise\u003cSafeUser> {\n\t\t// ...\n\t}\n}"}]},{"kind":"correct","label":"핵심 경계 선언에 JSDoc을 작성","blocks":[{"lang":"ts","code":"@Injectable()\nexport class UsersService {\n\t/**\n\t * @api 사용자 단건 조회 - 미존재 시 NotFoundException 발생\n\t */\n\tasync findOneOrThrow(id: number): Promise\u003cSafeUser> {\n\t\t// ...\n\t}\n}"}]}]},{"skill":"nestjs","id":"dto-document-custom-backend-types-and-parameter-objects","title":"Document Custom Backend Types and Parameter Objects","titleKo":"","impact":"MEDIUM-HIGH","impactDescription":"keeps backend-only contracts and parameter objects understandable without scanning method bodies","appliesWhen":"","tags":["types","jsdoc","params"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"dto","prose":[{"type":"line","text":"bodies)**"},{"type":"line","text":""},{"type":"line","text":"Prisma 생성 타입이 아닌 커스텀 `type`, `interface`, 파라미터 객체에는 JSDoc을 작성합니다."},{"type":"line","text":"객체형 계약은 헤더에 `@summary`, 각 필드 바로 위 `@field`를 사용하고, 관련 파일 최상단에 모아 배치합니다."}],"examples":[{"kind":"incorrect","label":"커스텀 계약 설명이 없거나 헤더에 `@property`를 몰아씀","blocks":[{"lang":"ts","code":"/**\n * @summary 페이지네이션 조회 공통 파라미터\n * @property page 페이지 번호\n */\ninterface PaginationParams {\n\tpage: number;\n\tlimit: number;\n}"}]},{"kind":"correct","label":"헤더 `@summary` + 필드별 `@field`를 사용","blocks":[{"lang":"ts","code":"/**\n * @summary 페이지네이션 조회 공통 파라미터\n */\ninterface PaginationParams {\n\t/**\n\t * @field 1부터 시작하는 페이지 번호\n\t */\n\tpage: number;\n\t/**\n\t * @field 페이지당 항목 수\n\t */\n\tlimit: number;\n}"}]}]},{"skill":"nestjs","id":"dto-expose-response-fields-explicitly","title":"Expose Response DTO Fields Explicitly","titleKo":"","impact":"HIGH","impactDescription":"prevents backend responses from leaking full Prisma models or sensitive fields by default","appliesWhen":"","tags":["dto","response","security"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"dto","prose":[{"type":"line","text":"응답 DTO는 클라이언트에 노출할 필드를 명시적으로 선언하고, Prisma 모델 전체를 그대로 반환하지 않습니다."},{"type":"line","text":"`@Exclude()`와 `@Expose()`를 사용해 민감 필드를 응답에서 제거합니다."}],"examples":[{"kind":"incorrect","label":"응답에 모델 전체를 그대로 노출","blocks":[{"lang":"ts","code":"return this.prisma.user.findUnique({where: {id}});"}]},{"kind":"correct","label":"응답 DTO가 노출 필드를 명시적으로 소유","blocks":[{"lang":"ts","code":"@Exclude()\nexport class UserResponseDto {\n\t@Expose()\n\tid: number;\n\n\t@Expose()\n\temail: string;\n\n\t@Expose()\n\tname: string;\n\n\t@Expose()\n\tcreatedAt: Date;\n\n\tpassword: string;\n}"}]}]},{"skill":"nestjs","id":"dto-replace-enum-with-as-const-except-prisma-enums","title":"Replace Local `enum` With `as const` Except Prisma Enums","titleKo":"","impact":"MEDIUM-HIGH","impactDescription":"keeps local runtime values lightweight while still allowing generated Prisma enums to remain the source of truth","appliesWhen":"","tags":["enum","as-const","prisma"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"dto","prose": tName}`};\n\t}\n}"}]},{"kind":"correct","label":"Controller는 경계만 담당하고 Service로 위임","blocks":[{"lang":"ts","code":"@Controller(\"users\")\nexport class UsersController {\n\tconstructor(private readonly usersService: UsersService) {}\n\n\t@Get(\":id\")\n\tasync findOne(@Param(\"id\", ParseIntPipe) id: number) {\n\t\treturn this.usersService.findOneOrThrow(id);\n\t}\n}"}]}]},{"skill":"nestjs","id":"layers-keep-services-responsible-for-domain-rules-and-prisma","title":"Keep Services Responsible for Domain Rules and Prisma","titleKo":"","impact":"CRITICAL","impactDescription":"keeps business rules, transaction orchestration, and persistence access in the backend layer designed to own them","appliesWhen":"","tags":["services","prisma","domain-logic"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"layers","prose":[{"type":"line","text":"designed to own them)**"},{"type":"line","text":""},{"type":"line","text":"Service는 비즈니스 로직, 도메인 규칙, 트랜잭션 조율을 담당하고 `PrismaService`를 직접 주입받아 데이터에 접근합니다."},{"type":"line","text":"다른 도메인 데이터가 필요하면 해당 도메인의 Service를 주입해 사용하고,"},{"type":"line","text":"리소스 부재나 도메인 위반 예외도 Service에서 결정합니다."}],"examples":[{"kind":"incorrect","label":"도메인 규칙이 Controller나 외부 레이어에 흩어짐","blocks":[{"lang":"ts","code":"@Controller(\"users\")\nexport class UsersController {\n\tconstructor(private readonly prisma: PrismaService) {}\n\n\t@Post()\n\tasync create(@Body() dto: CreateUserDto) {\n\t\tif (await this.prisma.user.findUnique({where: {email: dto.email}})) {\n\t\t\tthrow new ConflictException();\n\t\t}\n\n\t\treturn this.prisma.user.create({data: dto});\n\t}\n}"}]},{"kind":"correct","label":"Service가 규칙과 Prisma 접근을 함께 소유","blocks":[{"lang":"ts","code":"@Injectable()\nexport class UsersService {\n\tconstructor(private readonly prisma: PrismaService) {}\n\n\t/**\n\t * @api 사용자 단건 조회 - 미존재 시 NotFoundException 발생\n\t */\n\tasync findOneOrThrow(id: number): Promise\u003cSafeUser> {\n\t\tconst user = await this.prisma.user.findUnique({where: {id}});\n\n\t\tif (!user) {\n\t\t\tthrow new NotFoundException(`User ${id} not found`);\n\t\t}\n\n\t\treturn user;\n\t}\n}"}]}]},{"skill":"nestjs","id":"layers-preserve-one-way-dependencies-through-services","title":"Preserve One-way Dependencies Through Services","titleKo":"","impact":"HIGH","impactDescription":"prevents cross-layer shortcuts that bypass the service boundary and make backend change impact harder to reason about","appliesWhen":"","tags":["dependencies","layering","services"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"layers","prose":[{"type":"line","text":"reason about)**"},{"type":"line","text":""},{"type":"line","text":"의존 방향은 `Controller -> Service -> Prisma` 단방향만 허용합니다."},{"type":"line","text":"Service가 Controller를 참조하는 것을 금지하고, 다른 도메인의 데이터가 필요하면"},{"type":"line","text":"Prisma를 우회해 직접 접근하지 말고 해당 도메인 Service를 통해 연결합니다."}],"examples":[{"kind":"incorrect","label":"Controller가 Prisma에 직접 접근해 서비스 경계를 우회","blocks":[{"lang":"ts","code":"@Controller(\"users\")\nexport class UsersController {\n\tconstructor(private readonly prisma: PrismaService) {}\n\n\t@Post()\n\tasync create(@Body() dto: CreateUserDto) {\n\t\treturn this.prisma.user.create({data: dto});\n\t}\n}"}]},{"kind":"correct","label":"Controller에서 Service를 통해 한 방향으로 흐름 유지","blocks":[{"lang":"ts","code":"@Controller(\"users\")\nexport class UsersController {\n\tconstructor(private readonly usersService: UsersService) {}\n\n\t@Post()\n\tasync create(@Body() dto: CreateUserDto) {\n\t\treturn this.usersService.create(dto);\n\t}\n}"}]}]},{"skill":"nestjs","id":"methods-throw-context-rich-nestjs-exceptions","title":"Throw Context-rich NestJS Exceptions","titleKo":"","impact":"HIGH","impactDescription":"makes backend failures diagnosable by using the right NestJS exception type with real domain context","appliesWhen":"","tags":["exceptions","errors","diagnostics"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"methods","prose":[{"type":"line","text":"NestJS 내장 예외 클래스(`NotFoundException`, `BadRequestException`, `ForbiddenException` 등)를 사용하고,"},{"type":"line","text":"메시지에는 도메인 이름이나 식별자 같은 맥락 정보를 포함합니다."},{"type":"line","text":"예외를 무음 처리하거나 `'Not found'` 같은 빈약한 메시지를 남기지 않습니다."}],"examples":[{"kind":"incorrect","label":"맥락 없는 메시지와 무음 처리","blocks":[{"lang":"ts","code":"throw new NotFoundException(\"Not found\");\n\ntry {\n\tawait this.prisma.user.delete({where: {id}});\n} catch (error) {}"}]},{"kind":"correct","label":"맥락과 도메인 규칙을 드러내는 예외 사용","blocks":[{"lang":"ts","code":"throw new NotFoundException(`User ${id} not found`);\n\nif (user.role !== USER_ROLE.ADMIN) {\n\tthrow new ForbiddenException(\"관리자 권한이 필요합니다.\");\n}"}]}]},{"skill":"nestjs","id":"methods-use-async-await-and-mark-intentional-fire-and-forget","title":"Use Async/Await and Mark Intentional Fire-and-forget Calls","titleKo":"","impact":"HIGH","impactDescription":"keeps asynchronous backend flow readable and makes intentionally unawaited side effects explicit","appliesWhen":"","tags":["async","await","side-effects"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"methods","prose":[{"type":"line","text":"비동기 처리는 `async/await`를 기본으로 사용하고 `.then()` 체이닝은 피합니다."},{"type":"line","text":"`void` 반환 비동기 호출은 반드시 `await`하거나 `void` 키워드로 fire-and-forget 의도를 명시합니다."},{"type":"line","text":""},{"type":"line","text":"**Incorrect (`.then()` 체이닝과 숨은 비동기 호출):**"},{"type":"line","text":""},{"type":"code","lang":"ts","code":"this.prisma.user.findUnique({where: {id}}).then((user) => {\n\treturn user;\n});\n\nthis.eventsService.emit(\"user.created\", user);"}],"examples":[{"kind":"correct","label":"`await` 또는 `void`로 의도를 드러냄","blocks":[{"lang":"ts","code":"await this.eventsService.emit(\"user.created\", user);\n\nvoid this.eventsService.emit(\"user.created\", user);"}]}]},{"skill":"nestjs","id":"methods-use-nestjs-class-methods-and-explicit-async-returns","title":"Use NestJS Class Methods and Explicit Async Return Types","titleKo":"","impact":"MEDIUM-HIGH","impactDescription":"keeps backend class APIs conventional while makin e","text":"변수, 함수, 메서드는 `camelCase`, 클래스와 타입, 인터페이스는 `PascalCase`,"},{"type":"line","text":"상수는 `SCREAMING_SNAKE_CASE`를 유지해 파일명과 심볼 역할이 함께 읽히도록 합니다."}],"examples":[{"kind":"incorrect","label":"파일 목적이나 심볼 규칙이 불분명함","blocks":[{"lang":"txt","code":"UsersService.ts\nusers.ts\nCreateUser.ts"}]},{"kind":"correct","label":"역할 suffix와 일관된 심볼 규칙을 유지","blocks":[{"lang":"txt","code":"users.module.ts\nusers.controller.ts\nusers.service.ts\ncreate-user.dto.ts\nuser-response.dto.ts"}]}]},{"skill":"nestjs","id":"testing-add-tests-when-branches-endpoints-or-schema-change","title":"Add Tests When Branches, Endpoints, or Schema Behavior Change","titleKo":"","impact":"HIGH","impactDescription":"keeps backend regressions from slipping through when logic branches or API/database behavior changes","appliesWhen":"","tags":["tests","coverage","regression"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"testing","prose":[{"type":"line","text":"Service에 의미 있는 비즈니스 분기나 예외 처리가 추가되면 unit test를, 공개 API 엔드포인트가 추가되거나 변경되면"},{"type":"line","text":"e2e test를 추가합니다."},{"type":"line","text":"Prisma schema 변경이 API 동작에 영향을 주면 최소 한 개 이상의 e2e test로 회귀를 막습니다."}],"examples":[{"kind":"incorrect","label":"분기나 엔드포인트가 늘어도 기존 테스트만 믿고 넘어감","blocks":[{"lang":"txt","code":"- 새 권한 분기 추가\n- 새 POST /users 엔드포인트 추가\n- 응답 shape 변경\n- 테스트 추가 없음"}]},{"kind":"correct","label":"변경된 경계에 맞는 테스트를 함께 추가","blocks":[{"lang":"txt","code":"- Service 분기/예외 추가 -> unit test 추가\n- 공개 HTTP 엔드포인트 추가/변경 -> e2e test 추가\n- Prisma schema가 API 결과에 영향 -> e2e 회귀 테스트 추가"}]}]},{"skill":"nestjs","id":"testing-mock-unit-boundaries-and-verify-e2e-wiring","title":"Mock Unit Boundaries and Verify E2E Wiring","titleKo":"","impact":"CRITICAL","impactDescription":"keeps service unit tests fast and focused while making e2e tests prove real Nest wiring end to end","appliesWhen":"","tags":["unit-tests","e2e","mocks"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"testing","prose":[{"type":"line","text":"end)**"},{"type":"line","text":""},{"t nit-tests-from-http-e2e-tests","title":"Separate Service Unit Tests From HTTP E2E Tests","titleKo":"","impact":"CRITICAL","impactDescription":"keeps backend failures diagnosable by assigning business logic and full-stack wiring to different test levels","appliesWhen":"","tags":["unit-tests","e2e","levels"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"testing","prose":[{"type":"line","text":"test levels)**"},{"type":"line","text":""},{"type":"line","text":"테스트는 `unit test`와 `e2e test`를 기본 축으로 구분합니다."},{"type":"line","text":"unit test는 Service 단위의 비즈니스 로직 검증을 담당하고, e2e test는 HTTP 요청부터 ValidationPipe, Filter, Service,"},{"type":"line","text":"Prisma, DB까지의 연결을 검증합니다."},{"type":"line","text":"특별한 이유가 없으면 controller 전용 spec보다 service unit test와 HTTP e2e test를 우선합니다."}],"examples":[{"kind":"incorrect","label":"controller spec과 service logic test가 뒤섞임","blocks":[{"lang":"txt","code":"- Controller 전용 spec을 기본값으로 만들고\n- Service 분기 테스트는 생략\n- HTTP e2e는 없음"}]},{"kind":"correct","label":"레벨별 목적을 분명히 분리","blocks":[{"lang":"txt","code":"- Service 비즈니스 분기/예외 -> unit test\n- HTTP 엔드포인트와 wiring -> e2e test\n- 단순 DTO/상수 파일 -> 테스트 강제 없음"}]}]},{"skill":"playwright-test","id":"authoring-follow-the-integration-or-e2e-first-writing-sequence","title":"Follow the Declared Integration or E2E Writing Sequence","titleKo":"","impact":"MEDIUM","impactDescription":"reduces confused setup by forcing the author to classify the test level and dependency boundary before writing actions","appliesWhen":"","tags":["workflow","writing-order","setup"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"authoring","prose":[{"type":"line","text":"writing actions)**"},{"type":"line","text":""},{"type":"line","text":"신규 테스트를 쓸 때는 먼저 Integration인지 E2E인지 결정하고, 그 레벨에 맞는 setup만 선언한 뒤,"},{"type":"line","text":"사용자 locator로 action을 작성하고, web-first assertion으로 결과를 검증합니다."},{"type":"line","text":"마지막으로 정말 필요한 비동기 경계만 명시적으로 기다립니다."}],"examples":[{"kind":"incorrect","label":"레벨 구분 없이 test body부터 쓰기 시작","blocks":[{"lang":"txt","code":"1. 일단 page.goto()부터 작성\n2. 중간에 route mocking과 실제 로그인 helper를 같이 추가\n3. 나중에 파일명을 *.spec.ts 또는 *.e2e.spec.ts로 고민"}]},{"kind":"correct","label":"레벨을 먼저 고정하고 그 경계에 맞게 작성","blocks":[{"lang":"txt","code":"1. 먼저 Integration인지 E2E인지 결정\n2. 의존 경계에 맞는 setup만 선언\n3. 사용자 locator로 action 작성\n4. web-first assertion으로 결과 검증\n5. 필요한 비동기 경계만 상태 기반으로 대기"}]}]},{"skill":"playwright-test","id":"authoring-isolate-and-clean-up-test-data","title":"Isolate and Clean Up Test Data","titleKo":"","impact":"HIGH","impactDescription":"prevents remote or shared-state browser tests from colliding through reused accounts, ids, or seed records","appliesWhen":"","tags":["data-isolation","cleanup","seeds"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"authoring","prose":[{"type":"line","text":"records)**"},{"type":"line","text":""},{"type":"line","text":"원격 백엔드를 건드리는 테스트는 고유 데이터로 실행하고 `try/finally`로 cleanup합니다."},{"type":"line","text":"`Date.now()`, worker suffix, 고유 login ID 같은 전략으로 충돌을 피하고,"},{"type":"line","text":"공용 관리자 계정이나 고정 ID를 파괴적으로 수정하는 테스트는 만들지 않습니다."}],"examples":[{"kind":"incorrect","label":"공유 데이터에 파괴적으로 의존","blocks":[{"lang":"txt","code":"- 공용 관리자 계정의 이름을 수정\n- 고정 멤버 ID를 테스트마다 덮어씀\n- cleanup 없이 seed 데이터만 생성"}]},{"kind":"correct","label":"고립된 데이터 생성과 명시적 정리","blocks":[{"lang":"ts","code":"const loginId = `pw.${Date.now()}@example.com`;\n\ntry {\n\tawait support.members.createMemberViaApi({loginId});\n\t// test body\n} finally {\n\tawait support.members.deleteMemberViaApi({loginId});\n}"}]}]},{"skill":"playwright-test","id":"authoring-keep-beforeeach-limited-and-visible","title":"Keep `beforeEach` Limited and Visible","titleKo":"","impact":"HIGH","impactDescription":"prevents shared setup from hiding the test's real dependency boundary or main assertions","appliesWhen":"","tags":["beforeEach","setup","visibility"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"authoring","prose":[{"type":"line","text":"`beforeEach`에는 반복되는 인증 stub, 공용 이동 경로, 공용 로여도 이 형태를 다시 확인합니다."},{"type":"line","text":"- props가 없는 컴포넌트 이동만으로는 이 규칙이 걸리지 않습니다."}],"examples":[{"kind":"incorrect","label":"시그니처에서 바로 구조분해","blocks":[{"lang":"tsx","code":"const UserCard = ({ id, onSave }: UserCardProps) => {\n  return \u003cbutton onClick={onSave}>{id}\u003c/button>;\n};"}]},{"kind":"correct","label":"계약과 사용 위치를 분리","blocks":[{"lang":"tsx","code":"const UserCard = (props: UserCardProps) => {\n  const { id, onSave } = props;\n  return \u003cbutton onClick={onSave}>{id}\u003c/button>;\n};"}]}]},{"skill":"react","id":"composition-do-not-define-components-inside-components","title":"Do Not Define Components Inside Components","titleKo":"","impact":"HIGH","impactDescription":"prevents remount bugs and hidden state resets caused by recreating component types every render","appliesWhen":"컴포넌트 본문 안에 JSX를 반환하는 로컬 함수·컴포넌트를 추가·이동하거나 재렌더 시 remount·focus reset 징후를 다룬다.","tags":["composition","components","remount","performance"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"composition","prose":[{"type":"line","text":"컴포넌트 본문 안에서 다른 컴포넌트를 새로 정의하지 않습니다."},{"type":"line","text":"parent가 다시 렌더될 때마다 child component type도 새로 만들어져"},{"type":"line","text":"remount, focus reset, animation restart, effect 재실행이 생깁니다."},{"type":"line","text":""},{"type":"line","text":"로컬에서 JSX 조각을 재사용하려면 helper 함수 호출로 남기거나,"},{"type":"line","text":"독립 component로 빼고 props를 전달합니다."}],"examples":[{"kind":"incorrect","label":"렌더마다 새 component type을 생성","blocks":[{"lang":"tsx","code":"export const UserProfileCard = (props: UserProfileCardProps) => {\n\tconst { theme, user } = props;\n\n\tconst Avatar = () => {\n\t\treturn \u003cimg className={theme === \"dark\" ? \"avatar-dark\" : \"avatar-light\"} src={user.avatarUrl} />;\n\t};\n\n\treturn (\n\t\t\u003csection>\n\t\t\t\u003cAvatar />\n\t\t\u003c/section>\n\t);\n};"}]},{"kind":"correct","label":"component를 바깥으로 분리하고 props로 전달","blocks":[{"lang":"tsx","code":"export interface UserProfileAvatarProps {\n\ttheme: \"dark\" | \"light\";\n\tsrc: string;\n}\n\nexport const UserProfileAvatar = (props: UserProfileAvatarProps) => {\n\tconst { theme, src } = props;\n\treturn \u003cimg className={theme === \"dark\" ? \"avatar-dark\" : \"avatar-light\"} src={src} />;\n};\n\nexport const UserProfileCard = (props: UserProfileCardProps) => {\n\tconst { theme, user } = props;\n\n\treturn (\n\t\t\u003csection>\n\t\t\t\u003cUserProfileAvatar src={user.avatarUrl} theme={theme} />\n\t\t\u003c/section>\n\t);\n};"}]}]},{"skill":"react","id":"composition-named-handlers-over-inline","title":"Use Named Handlers Instead of Hiding Logic in JSX","titleKo":"","impact":"HIGH","impactDescription":"부수효과, 분기, 비동기 흐름을 일반 코드 흐름에서 읽을 수 있게 함","appliesWhen":"TSX event prop의 인라인 callback에 분기, 비동기 호출, 여러 동작·부수효과 또는 비자명한 state transition을 추가·수정한다. 단순 setter·인자 전달 한 줄 위임은 제외한다.","tags":["composition","jsx","handlers"],"requiresSelected":["docs-require-jsdoc-on-key-declarations","events-name-and-curry-handlers"],"reviewWith":["events-keep-handler-flow-inline","events-run-user-actions-in-handlers-not-effects"],"sectionPrefix":"composition","prose":[{"type":"line","text":"JSX에서는 명명된 핸들러 참조를 기본으로 하고, 아주 짧은 단순 위임만 인라인 함수로 허용합니다."},{"type":"line","text":"분기, 비동기 호출, 여러 부수효과가 들어가면 반드시 핸들러로 분리합니다."}],"examples":[{"kind":"incorrect","label":"분기와 비동기를 JSX 안에 숨김","blocks":[{"lang":"tsx","code":"\u003cUiButton\n  onClick={async () => {\n    if (!selectedEntry) {\n      return;\n    }\n\n    await mutationEntryRemove.mutateAsync({ params: { entryId: selectedEntry.id } });\n    void navigate({ to: \"/next\" });\n  }}\n/>"}]},{"kind":"correct","label":"로직을 명명된 핸들러로 노출","blocks":[{"lang":"tsx","code":"/**\n * @event 선택된 entry 삭제와 다음 화면 이동 처리\n */\nconst handleRemoveEntryButtonClick: MouseEventHandler\u003cHTMLButtonElement> = async (_event) => {\n  // ...\n};\n\n\u003cUiButton onClick={handleRemoveEntryButtonClick} />;"}]}]},{"skill":"react","id":"composition-prefer-arrow-functions-and-object-params","title":"Prefer Arrow Functions and Object Parameters for Complex Signatures","titleKo":"","impact":"MEDIUM-HIGH","impactDescription":"함수 선언과 다중 인자 계약을 더 쉽게 확장하고 수정할 수 있게 함","appliesWhen":"React 인접 코드에 function 선언이 생기거나 함수가 3개 이상 매개변수 또는 함께 이동하는 같은 계열 값을 받는다.","tags":["composition","functions","params"],"requiresSelected":[],"reviewWith":["typescript/functions-use-named-object-params-for-complex-signatures"],"sectionPrefix":"composition","prose":[{"type":"line","text":"함수는 기본적으로 화살표 함수로 선언하고, 매개변수가 3개 이상이거나 같은 계열 값이 함께 이동하면"},{"type":"line","text":"단일 객체 매개변수로 묶습니다."},{"type":"line","text":"객체 매개변수 타입은 파일 상단에 선언해 계약을 먼저 드러냅니다."}],"examples":[{"kind":"incorrect","label":"길고 취약한 positional parameter 나열","blocks":[{"lang":"ts","code":"export function updateEntryMediaUploadFileByUid(\n  uploadFileListByColumn: Record\u003cstring, UploadFile[]>,\n  columnName: string,\n  fileUid: string,\n  updater: (uploadFile: UploadFile) => UploadFile,\n) {\n  // ...\n}"}]},{"kind":"correct","label":"화살표 함수와 객체 매개변수 사용","blocks":[{"lang":"ts","code":"export interface UpdateEntryMediaUploadFileByUidParams {\n  uploadFileListByColumn: Record\u003cstring, UploadFile[]>;\n  columnName: string;\n  fileUid: string;\n  updater: (uploadFile: UploadFile) => UploadFile;\n}\n\n/**\n * @helper column별 업로드 파일 목록에서 특정 uid 항목 갱신\n */\nexport const updateEntryMediaUploadFileByUid = (params: UpdateEntryMediaUploadFileByUidParams) => {\n  const { uploadFileListByColumn, columnName, fileUid, updater } = params;\n  // ...\n};"}]}]},{"skill":"react","id":"composition-use-activity-for-render-branches","title":"Use Visibility Primitives Deliberately for Show and Hide Branches","titleKo":"","impact":"MEDIUM","impactDescription":"표시 여부 결정을 route 화면 전반에서 명시적이고 일관되게 유지함","appliesWhen":"이미 마운트된 subtree의 표시 상태를 보존하려고 조건부 렌더링과 Activity 또는 동등한 visibility primitive 사이를 바꾼다.","tags":["composition","jsx","activity"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"composition","prose":[{"type":"line","text":"React 19의 `\u003cActivity />` 또는 프로젝트가 이미 채택한 동등한 visibility primitive는"},{"type":"line","text":"이미 마운트된 subtree를 보여주거나 숨기는 의도일 때만 씁니다."},{"type":"line","text":""},{"type":"line","text":"삼항 렌더링과 visibility primitive는 같은 의미가 아닙니다."},{"type":"line","text":"삼항은 branch를 아예 unmount하지만, visibility primitive는 숨겨진 subtree의 state와 effect를 유지합니다."},{"type":"line","text":""},{"type":"line","text":"- mount/unmount 의미가 중요하면 기존 조건부 렌더링을 유지합니다."},{"type":"line","text":"- 코드베이스에 `Activity`가 아직 없으면 이 규칙 때문에 새 추상화를 들이지 말고 기존 패턴을 따릅니다."}],"examples":[{"kind":"incorrect","label":"lifecycle 의미가 다른 분기를 무비판적으로 visibility primitive로 치환","blocks":[{"lang":"tsx","code":"return (\n  \u003c>\n    \u003cActivity mode={isEditing ? \"visible\" : \"hidden\"}>\n      \u003cEditorForm />\n    \u003c/Activity>\n    \u003cActivity mode={isEditing ? \"hidden\" : \"visible\"}>\n      \u003cPreviewPane />\n    \u003c/Activity>\n  \u003c/>\n);"}]},{"kind":"correct","label":"show/hide가 목적일 때만 visibility primitive를 사용하고, mount 의미가 중요하면 조건부 렌더링을 유지","blocks":[{"lang":"tsx","code":"return \u003cActivity mode={isSidebarOpen ? \"visible\" : \"hidden\"}>\u003cEntrySidebar />\u003c/Activity>;"},{"lang":"tsx","code":"return hasItems ? \u003cItemList /> : \u003cEmptyState />;"}]}]},{"skill":"react","id":"composition-use-ref-prop-instead-of-forwardref-in-react-19","title":"Use ref Props Instead of New forwardRef Wrappers in React 19","titleKo":"","impact":"MEDIUM-HIGH","impactDescription":"keeps component definitions simpler in React 19 codebases and avoids adding legacy wrappers by default","appliesWhen":"React 19 컴포넌트에 focus·scroll·measure용 ref 공개 API를 추가·변경하거나 새 `forwardRef` wrapper를 도입한다.","tags":["composition","react19","ref","forwardref"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"composition","prose":[{"type":"line","text":"default)**"},{"type":"line","text":""},{"type":"line","text":"React 19 codebase에서 `ref`는 외부에서 실제로 제어해야 하는 public imperative contract입니다."},{"type":"line","text":""},{"type":"line","text":"- focus, scroll, measure 같은 contract가 있을  Loading Branches","titleKo":"","impact":"HIGH","impactDescription":"결측 데이터를 숨기지 않고 로딩 UX를 Suspense 또는 명시적 예외 처리 쪽으로 유도함","appliesWhen":"optional 응답에 `??`·`||` 기본값을 넣거나 Suspense 화면 본문에 초기 loading return을 추가·변경하고 결측·로딩 UX를 다룬다.","tags":["state","fallback","loading","suspense"],"requiresSelected":[],"reviewWith":["data-preserve-origin-chaining","screen-keep-derived-values-close","typescript/absence-expose-optional-values-instead-of-silent-fallbacks"],"sectionPrefix":"data","prose":[{"type":"line","text":"옵셔널 값에 `??`, `||`로 습관적인 기본값을 넣지 않습니다."},{"type":"line","text":"Suspense query의 초기 blocking 로딩도 화면 본문에서 즉석 분기하지 않습니다."},{"type":"line","text":"결측값은 드러내고, 초기 로딩은 Suspense 경계나 상위 레이아웃에서 처리합니다."},{"type":"line","text":""},{"type":"line","text":"- `isPending`, `isFetching` 같은 상태는 기존 UI를 보조하는 좁은 용도로만 씁니다."},{"type":"line","text":"  버튼 비활성화, background refetch indicator, 저장 중 배지가 그런 경우입니다."},{"type":"line","text":"- 화면 전체를 가리는 로컬 loading 분기가 꼭 필요하면 가까운 한글 주석으로 이유를 남깁니다."}],"examples":[{"kind":"incorrect","label":"결측과 로딩을 즉석에서 숨김","blocks":[{"lang":"tsx","code":"const name = responseUserGetItemSuspense.data?.name ?? \"\";\n\nif (responseUserGetItemSuspense.isPending) {\n  return \u003cSpinner />;\n}"}]},{"kind":"correct","label":"결측은 명시적으로 드러내고, pending/fetching은 보조 UI에만 사용","blocks":[{"lang":"tsx","code":"if (!responseUserGetItemSuspense.data?.name) {\n  return (\n    \u003c>\n      \u003cUserNameEmptyState />\n      \u003cUiButton disabled={mutationUserSave.isPending}>저장\u003c/UiButton>\n      {responseUserGetItemSuspense.isFetching ? \u003cRefreshIndicator /> : null}\n    \u003c/>\n  );\n}\n\nreturn (\n  \u003c>\n    \u003cUserName value={responseUserGetItemSuspense.data.name} />\n    \u003cUiButton disabled={mutationUserSave.isPending}>저장\u003c/UiButton>\n    {responseUserGetItemSuspense.isFetching ? \u003cRefreshIndicator /> : null}\n  \u003c/>\n);"}]}]},{"skill":"react","id":"data-name-query-and-mutation-bindings-consistently","title":"Name Query and Mutation Bindings C ate = () => {/* ... */};\nconst buildRequest = () => {/* ... */};\nconst runMutation = async () => {/* ... */};\nconst postProcess = () => {/* ... */};"}]},{"kind":"correct","label":"핸들러에서 흐름을 직접 읽을 수 있게 유지","blocks":[{"lang":"ts","code":"/**\n * @event 선택된 entry 저장과 화면 이동 처리\n */\nconst handleSubmitButtonClick: MouseEventHandler\u003cHTMLButtonElement> = async (_event) => {\n  if (!responseEntryListSuspense.data.selectedEntry) {\n    return;\n  }\n\n  if (mutationEntrySave.isPending) {\n    return;\n  }\n\n  await mutationEntrySave.mutateAsync({ data: request });\n  void navigate({ to: \"/entries\" });\n};"}]}]},{"skill":"react","id":"events-name-and-curry-handlers","title":"Name Handlers Predictably and Curry Extra Arguments","titleKo":"","impact":"MEDIUM-HIGH","impactDescription":"이벤트 흐름을 검색 가능하게 유지하고 즉흥적인 handler 시그니처를 피함","appliesWhen":"이벤트 핸들러를 새로 만들거나 이름, target/event 표현, 추가 인자 전달 방식 또는 최종 React handler 시그니처를 바꾼다.","tags":["events","handlers","naming"],"requiresSelected":[],"reviewWith":["typing-function-type-first","typescript/naming-use-consistent-file-and-symbol-naming"],"sectionPrefix":"events","prose":[{"type":"line","text":"이벤트 핸들러는 `handle` 접두사와 역할명을 씁니다."},{"type":"line","text":""},{"type":"line","text":"| 상황 | 이름 |"},{"type":"line","text":"| --- | --- |"},{"type":"line","text":"| DOM event | `handle + Target + Event` |"},{"type":"line","text":"| action 문맥이 분명할 때 | `handle + DomainAction` |"},{"type":"line","text":""},{"type":"line","text":"인라인 callback을 `handle*`로 추출할 때 event 외 추가 인자가 필요하면 factory가 event boundary를 소유합니다."},{"type":"line","text":"`(id): MouseEventHandler\u003cElement> => (_event) => ...` 반환값을 JSX에 직접 전달합니다."},{"type":"line","text":"`onClick={() => handleSelectionToggle(id)}` 같은 wrapper는 완료가 아닙니다."},{"type":"line","text":""},{"type":"line","text":"- 최종 반환 React handler는 `typing-function-type-first`를 다시 판단합니다."},{"type":"line","text":"  alias나 prop callback 계약을 쓸 수 있으면 그 규칙도 함께 적용하고 contextual typing으로 숨기지 않습니다."},{"type":"line","text": :"line","text":"`useDeferredValue`로 한 박자 늦춘 값을 만들고, 필요하면 그 값을 기준으로 필터링이나 정렬을 계산합니다."},{"type":"line","text":""},{"type":"line","text":"- 작은 배열이나 단순 문자열 가공까지 습관적으로 defer하지 않습니다."},{"type":"line","text":"- 이 경우의 `useMemo`는 `perf-compiler-first-memoization`의 예외적 허용 사례입니다."},{"type":"line","text":"  deferred value 기준 재계산 비용이 실제로 크고,"},{"type":"line","text":"  render마다 같은 작업을 반복하지 않으려는 목적이 분명할 때만 함께 씁니다."}],"examples":[{"kind":"incorrect","label":"입력과 무거운 파생 렌더를 같은 값에 묶음","blocks":[{"lang":"tsx","code":"const [keyword, setKeyword] = useState(\"\");\nconst filteredRows = rows.filter((row) => fuzzyMatchRow(row, keyword));"}]},{"kind":"correct","label":"입력은 urgent, 무거운 파생 렌더는 deferred 값과 제한적인 memoization으로 계산","blocks":[{"lang":"tsx","code":"const [keyword, setKeyword] = useState(\"\");\nconst deferredKeyword = useDeferredValue(keyword);\n\nconst filteredRows = useMemo(() => {\n\treturn rows.filter((row) => fuzzyMatchRow(row, deferredKeyword));\n}, [deferredKeyword, rows]);"}]}]},{"skill":"react","id":"screen-avoid-premature-abstraction","title":"Avoid Premature Abstraction in Screen Code","titleKo":"","impact":"HIGH","impactDescription":"추측성 추출 대신 실제 재사용 경계에 맞춰 route 코드를 유지함","appliesWhen":"screen 코드를 helper·hook·component·module로 추출하거나 한 곳에서만 쓰는 기존 추상화를 접어 넣는다.","tags":["screen","abstraction","reuse"],"requiresSelected":[],"reviewWith":["screen-extract-local-section-components-for-runtime-boundaries","screen-extract-utilities-selectively","typescript/functions-extract-helpers-only-when-the-boundary-is-real"],"sectionPrefix":"screen","prose":[{"type":"line","text":"반복이 보인다는 이유만으로 공용 hook, component, helper를 만들지 않습니다."},{"type":"line","text":""},{"type":"line","text":"먼저 시도할 것:"},{"type":"line","text":""},{"type":"line","text":"- 한 함수 안에서 단계 변수, section comment, 내부 블록으로 정리"},{"type":"line","text":"- route-local JSX에 남기고 흐름을 보이게 유지"},{"type":"line","text":"- 작은 mapper, href 조립, fallback 처리는 호출 위치에 유지"},{"type":"line","text":""},{"type":"line","text":"추출할 수 있는 때:"},{"type":"l age, submitErrorMessage };\n};"}]},{"kind":"correct","label":"같은 화면 안 반복은 먼저 한 함수 안에서 local 정리로 해결","blocks":[{"lang":"ts","code":"/**\n * @helper entry form values를 API payload로 조립\n */\nexport const buildEntryPayload = (formValues: EntryFormValues) => {\n\t// 1. 공통 문자열 값 정규화\n\t// 2. API payload 형태로 조립\n\t// 3. 결과 반환\n};"}]},{"kind":"correct","label":"작은 query shaping과 href 조립은 사용 지점에 둠","blocks":[{"lang":"tsx","code":"export const EntryTable = (props: EntryTableProps) => {\n\tconst responseEntriesQuery = useListEntriesSuspense\u003cEntryRow[]>(\n\t\t{},\n\t\t{\n\t\t\tquery: {\n\t\t\t\tselect: (response) =>\n\t\t\t\t\tresponse.data.map((entry) => ({ id: entry.id, title: entry.title })),\n\t\t\t},\n\t\t},\n\t);\n\n\treturn responseEntriesQuery.data.map((row) => (\n\t\t\u003ca href={`${props.editHrefBase}${row.id}/`} key={row.id}>\n\t\t\t{row.title}\n\t\t\u003c/a>\n\t));\n};"}]}]},{"skill":"react","id":"screen-extract-local-section-components-for-runtime-boundaries","title":"Extract Route-local Section Components Only for Runtime Boundaries","titleKo":"","impact":"HIGH","impactDescription":"route entry의 흐름은 보이게 두면서 async, state, interaction처럼 실제 경계가 있는 subtree만 안전하게 분리할 수 있게 함","appliesWhen":"route-local section component를 새로 추출하거나 기존 section이 async·state·provider·interaction·library·performance 경계를 소유하는지 바꾼다.","tags":["screen","routes","local-components","boundaries"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"screen","prose":[{"type":"line","text":"분리할 수 있게 함)**"},{"type":"line","text":""},{"type":"line","text":"route entry의 local component는 `runtime boundary`가 있을 때만 추출합니다."},{"type":"line","text":"단순 layout wrapper, className grouping, 들여쓰기 감소만으로는 추출하지 않습니다."},{"type":"line","text":""},{"type":"line","text":"추출 가능한 boundary:"},{"type":"line","text":""},{"type":"line","text":"- async: `Suspense`, skeleton, loading, error, empty state"},{"type":"line","text":"- state/provider: local state, effect sync, form provider, context, scoped store"},{"type":"line","text":"- interaction: popover, modal, selection, inline edit, drag, expandable tree"},{"type":"line","text":"- library/performance: dense widget adapter, virtualization, transition, deferred value"},{"type":"line","text":""},{"type":"line","text":"search param, navigation, page-level query/mutation, cross-section effect, invalidate, redirect,"},{"type":"line","text":"여러 section에 걸친 파생값은 route entry에 둡니다."}],"examples":[{"kind":"incorrect","label":"layout wrapper만 분리해 route flow를 숨김","blocks":[{"lang":"tsx","code":"const EntrySidebarPanel = () => {\n\treturn (\n\t\t\u003csection className=\"entry-layout__sidebar\">\n\t\t\t\u003cSidebarStats />\n\t\t\t\u003cSearchField />\n\t\t\t\u003cEntryTree />\n\t\t\u003c/section>\n\t);\n};\n\nconst EntryDetailPanel = () => {\n\treturn (\n\t\t\u003csection className=\"entry-layout__detail\">\n\t\t\t\u003cDetailHeader />\n\t\t\t\u003cEntryTable />\n\t\t\u003c/section>\n\t);\n};\n\nexport const RouteComponent = () => {\n\tconst responseEntryTreeSuspense = useEntryTreeSuspense();\n\tconst responseEntryListSuspense = useEntryListSuspense();\n\n\treturn (\n\t\t\u003cdiv className=\"entry-layout\">\n\t\t\t\u003cEntrySidebarPanel />\n\t\t\t\u003cEntryDetailPanel />\n\t\t\u003c/div>\n\t);\n};"}]},{"kind":"correct","label":"runtime boundary를 소유하는 section만 route-local component로 추출","blocks":[{"lang":"tsx","code":"interface EntryTreeSectionProps {\n\tcategoryNodes: EntryCategoryNode[];\n\tselectedCategoryId?: string;\n\tonCategorySelect: (categoryId: string) => void;\n}\n\nconst EntryTreeSection = (props: EntryTreeSectionProps) => {\n\tconst { categoryNodes, selectedCategoryId, onCategorySelect } = props;\n\tconst [expandedKeys, setExpandedKeys] = useState\u003cstring[]>([]);\n\tconst [treeSearchKeyword, setTreeSearchKeyword] = useState(\"\");\n\n\tconst filteredCategoryNodes = getFilteredCategoryNodes(\n\t\tcategoryNodes,\n\t\ttreeSearchKeyword,\n\t);\n\n\t/**\n\t * @event tree에서 선택한 category key를 route search용 categoryId로 변환\n\t */\n\tconst handleTreeSelect: UiTreeProps[\"onSelect\"] = (keys, _info) => {\n\t\tconst selectedKey = keys[0];\n\t\tif (typeof selectedKey !== \"string\" || !selectedKey.startsWith(\"category:\")) {\n\t\t\treturn;\n\t\t}\n\n\t\tonCategorySelect(selectedKey.replace(\"category:\", \"\"));\n\t};\n\n\treturn (\n\t\t\u003csection className=\"entry-layout__sidebar\">\n\t\t\t\u003cUiInput\n\t\t\t\tvalue={treeSearchKeyword}\n\t\t\t\tonChange={(event) => setTreeSearchKeyword(event.target.value)}\n\t\t\t/>\n\n\t\t\t\u003cActivity mode={filteredCategoryNodes.length > 0 ? \"visible\" : \"hidden\"}>\n\t\t\t\t\u003cUiTree\n\t\t\t\t\ttreeData={filteredCategoryNodes.map(mapEntryNodeToTreeData)}\n\t\t\t\t\texpandedKeys={expandedKeys}\n\t\t\t\t\tselectedKeys={selectedCategoryId ? [`category:${selectedCategoryId}`] : []}\n\t\t\t\t\tonExpand={(keys) => setExpandedKeys(keys.map(String))}\n\t\t\t\t\tonSelect={handleTreeSelect}\n\t\t\t\t/>\n\t\t\t\u003c/Activity>\n\n\t\t\t\u003cActivity mode={filteredCategoryNodes.length > 0 ? \"hidden\" : \"visible\"}>\n\t\t\t\t\u003cUiEmpty description=\"No matching results\" />\n\t\t\t\u003c/Activity>\n\t\t\u003c/section>\n\t);\n};"}]},{"kind":"correct","label":"route entry가 흐름 제어를 계속 소유","blocks":[{"lang":"tsx","code":"export const RouteComponent = () => {\n\tconst navigate = useNavigate();\n\tconst search = Route.useSearch();\n\n\t/**\n\t * @api tree sidebar 조회 API\n\t */\n\tconst responseEntryTreeSuspense = useEntryTreeSuspense\u003cEntryTreeSelectData>();\n\n\t/**\n\t * @api entry 목록 조회 API\n\t */\n\tconst responseEntryListSuspense = useEntryListSuspense\u003cEntryListSelectData>();\n\n\t/**\n\t * @event tree에서 선택한 category로 route search를 갱신\n\t */\n\tconst handleCategorySelect: EntryTreeSectionProps[\"onCategorySelect\"] = (categoryId) => {\n\t\tvoid navigate({\n\t\t\tto: \"/entries\",\n\t\t\tsearch: { page: search.page, size: search.size, categoryId },\n\t\t});\n\t};\n\n\treturn (\n\t\t\u003cdiv className=\"entry-layout\">\n\t\t\t\u003cEntryTreeSection\n\t\t\t\tcategoryNodes={responseEntryTreeSuspense.data.categoryNodes}\n\t\t\t\tselectedCategoryId={search.categoryId}\n\t\t\t\tonCategorySelect={handleCategorySelect}\n\t\t\t/>\n\t\t\t\u003cEntryTableSection\n\t\t\t\tentries={responseEntryListSuspense.data?.entries}\n\t\t\t/>\n\t\t\u003c/div>\n\t);\n};"}]}]},{"skill":"react","id":"screen-extract-utilities-selectively","title":"Extract Screen Support Code Only When the Boundary Is Real","titleKo":"","impact":"HIGH","impactDescription":"route entry가 자기 계약이 없는 helper 조각으로 분해되는 것을 막음","appliesWhen":"화면 계산·변환·preset·option·column meta를 별도 함수/support module로 추출·이동하거나 support 경계를 바꾼다. query `select` 내부 shaping만이면 제외한다.","tags":["screen","utils","extraction"],"requiresSelected":[],"reviewWith":["screen-move-pure-support-code-out-of-entry-files","typescript/functions-extract-helpers-only-when-the-boundary-is-real"],"sectionPrefix":"screen","prose":[{"type":"line","text":"화면 support code는 \"이름 붙일 수 있다\"가 아니라 \"경계가 있다\"일 때만 추출합니다."},{"type":"line","text":""},{"type":"line","text":"추출 후보:"},{"type":"line","text":""},{"type":"line","text":"- React state/hook과 직접 결합되지 않은 pure function"},{"type":"line","text":"- 입력/출력 계약이 명확한 화면 전용 변환, preset, option, column meta"},{"type":"line","text":"- 밖으로 빼면 route entry의 response, state, handler, render flow가 더 잘 보이는 코드"},{"type":"line","text":"- 여러 exported 함수에서 같은 단계가 반복되는 이름 있는 도메인 규칙"},{"type":"line","text":""},{"type":"line","text":"남길 것:"},{"type":"line","text":""},{"type":"line","text":"- 작은 1회성 guard, URL 조립, 빈 검색어 생략 같은 호출 지점 계산"},{"type":"line","text":"- handler/effect 안에 있어야 문맥이 보이는 query invalidation, navigation, fallback 처리"},{"type":"line","text":"- query `select` 내부 mapper."},{"type":"line","text":"  `data-shape-query-data-with-select` 가 담당하므로 별도 함수나 support module 경계가 없으면 이 규칙은 적용하지 않는다"},{"type":"line","text":""},{"type":"line","text":"배치:"},{"type":"line","text":""},{"type":"line","text":"- route sibling `page.ts`에 named export로 둡니다."},{"type":"line","text":"- `helper.ts`, `helpers.ts`, `utils.ts`, `common.ts` 같은 generic 파일명은 만들지 않습니다."},{"type":"line","text":"- support module 안에서도 작은 private helper를 쌓지 말고, 기본은 한 exported 함수 안에서 단계별로 정리합니다."}],"examples":[{"kind":"incorrect","label":"`page.ts`를 export helper 창고처럼 사용","blocks":[{"lang":"ts","code":"export const normalizeEntryValues = (formValues: EntryFormValues) => {\n\t// ...\n};\n\nexport const buildEntryUploadRequests = (files: UploadFile[]) => {\n\t// ...\n};\n\nexport const mergeEntryPayload = (\n\tvalues: EntryFormValues,\n\tuploadRequests: SaveUploadRequest[],\n) => {\n\t// ...\n};\n\nexport const buildEntryPayload = (formValues: EntryFormValues, files: UploadFile[]) => {\n\treturn mergeEntryPayload(\n\t\tnormalizeEntryValues(formValues),\n\t\tbuildEntryUploadRequests(files),\n\t);\n};"}]},{"kind":"correct","label":"화면 전용 support code는 먼저 `page.ts`의 named export로 모으고, 흐름에 묶인 로직은 handler에 남김","blocks":[{"lang":"ts","code":"// page.ts\n/**\n * @helper tree 응답을 화면용 node shape로 정규화\n */\nexport const normalizeTreeNodes = (nodes: TreeNodeResponse[]) => {\n  return nodes.map((node) => ({\n    id: node.id,\n    name: node.name,\n  }));\n};"},{"lang":"ts","code":"// page.tsx\n/**\n * @event 저장 요청 후 목록 query를 무효화\n */\nconst handleSave = async () => {\n  await mutationEntrySave.mutateAsync({ data: request });\n  await queryClient.invalidateQueries({ queryKey: [\"entry-list\"] });\n};"}]},{"kind":"correct","label":"`page.ts` 안의 작은 단계는 한 exported 함수 안에서 정리","blocks":[{"lang":"ts","code":"/**\n * @helper entry form values와 파일 목록을 저장 payload로 조립\n */\nexport const buildEntryPayload = (\n\tformValues: EntryFormValues,\n\tfiles: UploadFile[],\n) => {\n\t// 1. formValues 정규화\n\t// 2. upload request 조립\n\t// 3. payload 병합\n\treturn {\n\t\t// ...\n\t};\n};"}]},{"kind":"correct","label":"component 전용 작은 단계는 호출 위치에 유지","blocks":[{"lang":"tsx","code":"export const EntryTable = (props: EntryTableProps) => {\n\tconst { editHrefBase, filters } = props;\n\tconst trimmedQuery = filters.q.trim();\n\tcon ct.entries(searchParams)) {\n\t\trequestUrl.searchParams.set(key, value);\n\t}\n\n\treturn requestUrl;\n};"}]},{"kind":"correct","label":"객체 전체를 받고 본문에서 구조분해","blocks":[{"lang":"ts","code":"/**\n * @summary grouped args로 API request URL 생성\n */\nconst buildRequestUrl = (args: BuildRequestUrlArgs): URL => {\n\tconst {baseUrl, resourcePath, searchParams} = args;\n\tconst requestUrl = new URL(resourcePath, baseUrl);\n\n\tfor (const [key, value] of Object.entries(searchParams)) {\n\t\trequestUrl.searchParams.set(key, value);\n\t}\n\n\treturn requestUrl;\n};"}]}]},{"skill":"typescript","id":"functions-use-set-and-map-for-repeated-lookups","title":"Use Set and Map for Repeated Lookups","titleKo":"","impact":"MEDIUM","impactDescription":"keeps repeated membership and keyed access code explicit once lookup count grows","appliesWhen":"같은 컬렉션에 `includes`, `find` 또는 keyed lookup을 여러 번 수행하는 코드를 추가·변경한다.","tags":["functions","set","map","lookups","performance"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"functions","prose":[{"type":"line","text":"같은 컬렉션에 대해 membership check나 keyed access를 여러 번 반복한다면 배열 `includes`,"},{"type":"line","text":"`find`를 매번 다시 돌리지 말고 `Set`이나 `Map`으로 한 번 정리합니다."},{"type":"line","text":"단발성 한두 번 조회면 그대로 두고, 반복 lookup이 실제로 있는 경우에만 승격합니다."}],"examples":[{"kind":"incorrect","label":"같은 배열을 반복 순회하며 membership를 확인","blocks":[{"lang":"ts","code":"const visibleEntries = entries.filter((entry) => allowedEntryIds.includes(entry.id));\nconst disabledEntries = archivedEntries.filter((entry) => allowedEntryIds.includes(entry.id));"}]},{"kind":"correct","label":"반복 lookup은 `Set`으로 승격","blocks":[{"lang":"ts","code":"const allowedEntryIdSet = new Set(allowedEntryIds);\n\nconst visibleEntries = entries.filter((entry) => allowedEntryIdSet.has(entry.id));\nconst disabledEntries = archivedEntries.filter((entry) => allowedEntryIdSet.has(entry.id));"}]},{"kind":"correct","label":"반복 keyed access는 `Map`으로 승격","blocks":[{"lang":"ts","code":"const userById = new Map(u
