<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 컨벤션 — 규칙 조회</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
h1, p, pre, button, input, table { margin: 0; padding: 0; }
/* 한국어는 어절 안에서 끊지 않는다. 기본값이면 글자 단위로 잘려 읽기 어렵다. */
body { word-break: keep-all; overflow-wrap: break-word; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

:root {
	--page: #eef1f3; --card: #fff;
	--ink: #14191c; --ink2: #47535a; --muted: #5f6b71; --faint: #6b767c;
	--hair: #d8dee2; --soft: #e4e9ec; --edge: #c3ccd1; --hover: #e7ecef;
	--coral: #cc785c; --coral-dk: #a9583e;
	--bad: #a8392b; --good: #3f6f52; --tag-fg: #7d6a55;
	--code-bg: #fff; --code-fg: #14191c;
	--sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
	--mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* 디자인은 라이트를 기준으로 만들어졌다. 다크는 같은 토큰만 다시 정의해 얹는다. */
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--page: #101416; --card: #171c1f;
		--ink: #e6ebed; --ink2: #b3bec3; --muted: #8b979d; --faint: #87939a;
		--hair: #262d31; --soft: #222a2e; --edge: #3a444a; --hover: #1e2528;
		--coral: #d98a6c; --coral-dk: #e0a184;
		--bad: #dd8a7d; --good: #6bb890; --tag-fg: #b39a7c;
		--code-bg: #12171a; --code-fg: #e4eaec;
	}
}

:root[data-theme="dark"] {
	--page: #101416; --card: #171c1f;
	--ink: #e6ebed; --ink2: #b3bec3; --muted: #8b979d; --faint: #87939a;
	--hair: #262d31; --soft: #222a2e; --edge: #3a444a; --hover: #1e2528;
	--coral: #d98a6c; --coral-dk: #e0a184;
	--bad: #dd8a7d; --good: #6bb890; --tag-fg: #b39a7c;
	--code-bg: #12171a; --code-fg: #e4eaec;
}

body {
	min-height: 100vh; background: var(--page); color: var(--ink);
	font-family: var(--sans); font-size: 14px; line-height: 1.6;
	-webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; border-radius: 2px; }

/* ---------- header ---------- */
.hd { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--page) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--hair); }
.hd-in { max-width: 1320px; margin: 0 auto; padding: 0 28px; min-height: 64px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.rail-t { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; margin-right: 2px; border-radius: 2px; font-size: 12px; color: var(--ink2); border: 1px solid var(--hair); }
.rail-t:hover { border-color: var(--coral); color: var(--coral); }
.brand { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }
.brand-nm { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.brand-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .04em; padding-left: 4px; }

.sr { flex: 1 1 320px; display: flex; justify-content: center; min-width: 0; }
.sr-box { position: relative; width: 100%; max-width: 460px; }
.sr-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; pointer-events: none; }
.sr-in {
	width: 100%; height: 40px; padding: 0 12px 0 32px;
	font-family: inherit; font-size: 13.5px; color: var(--ink);
	background: var(--card); border: 1px solid var(--hair); border-radius: 2px;
}
.sr-in::placeholder { color: var(--faint); }
.sr-in:focus { border-color: var(--coral); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--coral) 18%, transparent); }

.hd-r { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; }
.cnt { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn { height: 32px; padding: 0 12px; font-size: 12.5px; color: var(--ink2); background: var(--card); border: 1px solid var(--hair); border-radius: 2px; white-space: nowrap; }
.btn:hover { border-color: var(--edge); color: var(--ink); }

/* ---------- shell ---------- */
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 28px; }
.pane { display: grid; grid-template-columns: 244px minmax(0, 1fr); gap: 40px; padding: 28px 0 96px; align-items: start; }
/* 좁은 노트북에서 본문이 계속 눌리므로 레일을 접을 수 있게 둔다. */
.pane[data-rail="0"] { grid-template-columns: minmax(0, 1fr); }
.pane[data-rail="0"] .rail { display: none; }
/* minmax(0,…): 1fr 이면 main 이 콘텐츠 min-width 아래로 줄지 못해 페이지가 가로로 늘어난다. */
@media (max-width: 940px) { .pane { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
.pane > main { min-width: 0; }

.rail { position: sticky; top: 88px; display: flex; flex-direction: column; gap: 26px; max-height: calc(100vh - 116px); overflow-y: auto; padding-right: 4px; }
@media (max-width: 940px) { .rail { position: static; max-height: none; overflow: visible; } }
.rail::-webkit-scrollbar { width: 6px; }
.rail::-webkit-scrollbar-thumb { background: var(--hair); border-radius: 3px; }

.grp-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 20px; padding-bottom: 8px; border-bottom: 1px solid var(--hair); margin-bottom: 10px; }
.grp-lb { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
.grp-note { font-family: var(--mono); font-size: 10px; color: var(--faint); white-space: nowrap; }
.grp-clear { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.grp-clear:hover { color: var(--coral-dk); }

.col { display: flex; flex-direction: column; gap: 1px; }

.ch {
	display: grid; align-items: center; gap: 8px; width: 100%; text-align: left;
	min-height: 28px; padding: 0 8px; border-radius: 2px;
	font-size: 12.5px; color: var(--ink2);
}
.ch:hover { background: var(--hover); }
.ch[aria-pressed="true"] { background: var(--coral); color: #fff; }
.ch[aria-pressed="true"]:hover { background: var(--coral-dk); }
.ch-skill { grid-template-columns: minmax(0, 1fr) auto; font-family: var(--mono); font-size: 12px; }
.ch-imp { grid-template-columns: 10px minmax(0, 1fr) auto; font-family: var(--mono); font-size: 11px; letter-spacing: .02em; }
.ch-sec { grid-template-columns: 2.6em minmax(0, 1fr) auto; align-items: baseline; gap: 6px; padding: 5px 8px; }
.ch-lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-sec .ch-lb { white-space: normal; line-height: 1.4; }
.ch-n { font-family: var(--mono); font-size: 10.5px; font-variant-numeric: tabular-nums; opacity: .65; min-width: 2.2em; text-align: right; }
.ch-no { font-family: var(--mono); font-size: 10.5px; font-variant-numeric: tabular-nums; opacity: .6; }
.ch-dot { width: 8px; height: 8px; border-radius: 2px; }

.comp { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--hair); }
.comp:empty { display: none; }
.comp-lb { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); width: 100%; }
.comp-ch { font-family: var(--mono); font-size: 10.5px; min-height: 22px; padding: 0 7px; color: var(--coral-dk); background: color-mix(in srgb, var(--coral) 7%, transparent); border: 1px solid color-mix(in srgb, var(--coral) 28%, transparent); border-radius: 2px; }
.comp-ch:hover { background: color-mix(in srgb, var(--coral) 14%, transparent); }

.tagwrap { display: flex; flex-wrap: wrap; gap: 4px; }
.tg { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 0 8px; border-radius: 999px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); border: 1px solid var(--hair); }
.tg:hover { color: var(--coral-dk); border-color: color-mix(in srgb, var(--coral) 45%, transparent); }
.tg[aria-pressed="true"] { background: var(--coral); border-color: var(--coral); color: #fff; }
.tg-n { font-variant-numeric: tabular-nums; opacity: .6; }

/* ---------- rule cards ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
/* 반경은 레포 기존 html(overview.html, progressive-loading.html) 의 1~3px 취향에 맞춘다.
   칩 계열만 알약(999px)으로 남긴다. */
.row { position: relative; background: var(--card); border: 1px solid var(--hair); border-radius: 3px; overflow: hidden; }
.row[data-open="1"] { border-color: var(--edge); }
.row-stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.row[data-imp="CRITICAL"] .row-stripe { background: var(--coral); }
.row[data-imp="HIGH"] .row-stripe { background: color-mix(in srgb, var(--coral) 55%, transparent); }
.row[data-imp="MEDIUM-HIGH"] .row-stripe { background: color-mix(in srgb, var(--coral) 25%, transparent); }

.row-hd { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; align-items: center; gap: 16px; width: 100%; text-align: left; padding: 14px 18px 14px 20px; }
.row-hd:hover { background: color-mix(in srgb, var(--ink) 6%, var(--card)); }
@media (max-width: 560px) { .row-hd { grid-template-columns: 44px minmax(0, 1fr); row-gap: 8px; } .row-meta { grid-column: 2; } }
.row-no { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--coral-dk); font-variant-numeric: tabular-nums; }
.row-ti { min-width: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 제목 안 식별자도 본문 코드와 같은 배경을 줘서 영어 낱말이 아니라 코드로 읽히게 한다. */
.row-ti code, .ref-ti code { font-family: var(--mono); font-size: .86em; font-weight: 500; background: var(--hover); border: 1px solid var(--soft); border-radius: 3px; padding: 0 .28em; }
.row[data-open="1"] .row-ti { white-space: normal; }
.row-meta { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.car { color: var(--muted); font-size: 11px; width: 12px; text-align: center; }

.imp { display: inline-flex; align-items: center; gap: 5px; min-height: 22px; padding: 0 8px; border-radius: 999px; font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: .06em; white-space: nowrap; border: 1px solid transparent; }
.imp-CRITICAL { background: var(--coral); color: #fff; border-color: var(--coral); }
.imp-HIGH { background: color-mix(in srgb, var(--coral) 14%, transparent); color: var(--coral-dk); }
.imp-MEDIUM-HIGH { color: var(--coral-dk); border-color: color-mix(in srgb, var(--coral) 50%, transparent); }
.imp-MEDIUM { color: var(--muted); border-color: var(--hair); }
.imp-LOW { color: var(--faint); border-color: var(--soft); }

.body { border-top: 1px solid var(--soft); padding: 18px 20px 22px; }
.meta { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.meta-s { color: var(--faint); }

/* 아코디언 두 개는 같은 형태다. 판단에 쓰는 글은 읽기 편한 폭으로 제한한다. */
.accs { display: flex; flex-direction: column; margin-top: 16px; border-top: 1px dashed var(--hair); }
.accs:empty { display: none; }
.acc { border-bottom: 1px dashed var(--hair); }
.acc-btn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 11px 2px; font-size: 13px; font-weight: 500; color: var(--coral-dk); }
.acc-btn:hover { color: var(--coral); }
.acc-car { font-size: 9px; width: 8px; flex: 0 0 auto; }
.acc-body { display: none; padding: 0 2px 18px 22px; color: var(--ink2); font-size: 13.5px; line-height: 1.8; }
.acc[data-open="1"] .acc-body { display: block; }
.acc-body p { margin: 0 0 .75em; }
.acc-body p:last-child { margin-bottom: 0; }
.acc-body .lead { margin: 0 0 .9em; padding-left: 11px; border-left: 2px solid color-mix(in srgb, var(--coral) 55%, transparent); color: var(--ink); font-weight: 500; line-height: 1.7; }
.acc-body ul { margin: 0 0 .95em; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .45em; }
.acc-body ul:last-child { margin-bottom: 0; }
/* 표식과 본문을 격자로 맞춰야 두 줄 넘는 항목의 둘째 줄이 표식 아래로 들어가지 않는다. */
.acc-body li { display: grid; grid-template-columns: .9em minmax(0, 1fr); align-items: baseline; gap: .35em; }
.acc-body li::before { content: "—"; color: var(--coral); font-size: .8em; }
.acc-body code { font-family: var(--mono); font-size: .88em; background: var(--hover); border: 1px solid var(--soft); border-radius: 3px; padding: 0 .25em; }
.acc-body strong { color: var(--ink); font-weight: 600; }
.acc-body .tw { overflow-x: auto; margin: 0 0 .8em; }
.acc-body table { border-collapse: collapse; font-size: 12.5px; width: 100%; table-layout: auto; }
.acc-body th { padding: 0 16px 7px 0; text-align: left; vertical-align: bottom; font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--edge); }
.acc-body td { padding: 9px 16px 9px 0; text-align: left; vertical-align: top; line-height: 1.6; border-bottom: 1px solid var(--hover); }
.acc-body pre.code { border: 1px solid var(--soft); border-radius: 2px; margin: .2em 0 1em; }

/* ---------- examples ---------- */
/* Incorrect 바로 뒤에 Correct 가 오고 둘 다 코드 블록 하나면 좌우로 놓는다.
   auto-fit 이라 main 이 좁아지면 브레이크포인트 없이 스스로 위아래로 떨어진다. */
.exs { display: flex; flex-direction: column; gap: 18px; margin-top: 16px; }
.diff { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); gap: 14px; }

/* 테두리 전체에 의미색을 두르면 잉크가 많다. 좌측 2px 만 의미색으로 세운다. */
.box { min-width: 0; background: var(--card); border: 1px solid var(--hair); border-radius: 2px; overflow: hidden; }
.box-bad { border-left: 2px solid color-mix(in srgb, var(--bad) 55%, transparent); }
.box-good { border-left: 2px solid color-mix(in srgb, var(--good) 55%, transparent); }
.box-hd { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: baseline; gap: 9px; padding: 8px 12px; }
.box-bad > .box-hd { background: color-mix(in srgb, var(--bad) 5%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--bad) 16%, transparent); }
.box-good > .box-hd { background: color-mix(in srgb, var(--good) 5%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--good) 16%, transparent); }
.box-gl { font-family: var(--mono); font-size: 12px; font-weight: 700; }
.box-bad .box-gl, .box-bad .box-note { color: var(--bad); }
.box-good .box-gl, .box-good .box-note { color: var(--good); }
/* 라벨은 그 예시가 무엇인지 말해 주는 유일한 문장이다. 잘라내지 않고 줄바꿈한다. */
.box-note { min-width: 0; font-size: 13px; font-weight: 600; line-height: 1.5; word-break: keep-all; text-wrap: pretty; }
.box-langs { font-family: var(--mono); font-size: 10px; color: var(--faint); }

/* 같은 종류가 연속이면 한 상자로 묶고 기본으로 접는다. 예시 여섯 개가 코드 벽이 되지 않는다. */
.gx { display: flex; flex-direction: column; gap: 9px; }
.gx-hd { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.gx-tag { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .12em; white-space: nowrap; }
.gx-rule { height: 1px; }
.gx-all { min-height: 22px; padding: 0 8px; border-radius: 2px; font-size: 11px; white-space: nowrap; color: var(--muted); border: 1px solid var(--hair); }
.gx-bad .gx-tag { color: var(--bad); }
.gx-bad .gx-rule { background: color-mix(in srgb, var(--bad) 22%, transparent); }
.gx-bad .gx-all:hover { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 55%, transparent); }
.gx-good .gx-tag { color: var(--good); }
.gx-good .gx-rule { background: color-mix(in srgb, var(--good) 22%, transparent); }
.gx-good .gx-all:hover { color: var(--good); border-color: color-mix(in srgb, var(--good) 55%, transparent); }

.smp { min-width: 0; border-top: 1px solid var(--soft); }
.smp:first-child { border-top: none; }
.smp-b { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: baseline; gap: 9px; width: 100%; text-align: left; padding: 9px 12px; }
.smp-no { font-family: var(--mono); font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.smp-car { font-size: 9px; }
.box-bad .smp-b:hover, .box-bad .smp[data-open="1"] .smp-b { background: color-mix(in srgb, var(--bad) 5%, transparent); }
.box-bad .smp[data-open="1"] .smp-b { border-bottom: 1px solid color-mix(in srgb, var(--bad) 22%, transparent); }
.box-bad .smp-no, .box-bad .smp-car { color: color-mix(in srgb, var(--bad) 80%, transparent); }
.box-good .smp-b:hover, .box-good .smp[data-open="1"] .smp-b { background: color-mix(in srgb, var(--good) 5%, transparent); }
.box-good .smp[data-open="1"] .smp-b { border-bottom: 1px solid color-mix(in srgb, var(--good) 22%, transparent); }
.box-good .smp-no, .box-good .smp-car { color: color-mix(in srgb, var(--good) 80%, transparent); }
.smp-body { display: none; }
.smp[data-open="1"] .smp-body { display: block; }

/* ---------- code ---------- */
/* 줄번호·마커·코드 3열. 거터 폭을 3em 으로 고정해 예시끼리 코드 시작이 맞는다. */
.cd { display: grid; grid-template-columns: 3em 16px minmax(0, 1fr); padding: 9px 12px 9px 0; font-family: var(--mono); font-size: 12px; line-height: 1.65; background: var(--code-bg); color: var(--code-fg); tab-size: 2; }
.cd i { display: block; font-style: normal; min-height: 1.65em; }
.cd .n { padding: 0 10px 0 12px; text-align: right; color: var(--faint); font-variant-numeric: tabular-nums; user-select: none; }
.cd .m { text-align: center; font-weight: 700; color: transparent; user-select: none; border-right: 1px solid var(--soft); }
.cd .c { padding: 0 6px 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
/* 바뀐 줄만 옅게 칠하고 거터 숫자와 마커를 의미색으로 바꾼다. */
.box-bad .cd .on { background: color-mix(in srgb, var(--bad) 6%, transparent); }
.box-bad .cd .n.on, .box-bad .cd .m.on { color: var(--bad); }
.box-good .cd .on { background: color-mix(in srgb, var(--good) 6%, transparent); }
.box-good .cd .n.on, .box-good .cd .m.on { color: var(--good); }
/* 첫 줄이 경로 주석이면 코드에서 떼어 머리띠로 올린다. */
.cd-p { display: flex; align-items: center; gap: 7px; padding: 4px 12px; font-family: var(--mono); font-size: 10px; letter-spacing: .01em; color: var(--muted); background: color-mix(in srgb, var(--ink) 3%, var(--code-bg)); border-bottom: 1px solid var(--soft); }
.cd-p .ico { color: var(--faint); }
.cd-p .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cd + .cd, .cd + .cd-lb, .cd-p + .cd { border-top: 1px solid var(--soft); }
.cd-lb { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; color: var(--faint); padding: 6px 14px 0; background: var(--code-bg); }

pre.code { margin: 0; padding: 11px 13px; font-family: var(--mono); font-size: 12px; line-height: 1.75; background: color-mix(in srgb, var(--ink) 4%, var(--code-bg)); color: var(--code-fg); white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 2; }
.c { color: var(--faint); }
.s { color: var(--good); }
.k { color: var(--coral-dk); font-weight: 600; }
.g { color: var(--tag-fg); }


/* 참조는 칩이 아니라 목록으로 둔다. 문장 안 참조와 모양이 같으면 둘을 구분할 수 없다. */
.refs { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
.ref-hd { display: flex; align-items: baseline; gap: 8px; padding-bottom: 8px; }
.ref-lb { font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
.ref-n { font-family: var(--mono); font-size: 10px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ref-note { min-width: 0; font-size: 11.5px; color: var(--faint); }
.ref-list { border: 1px solid var(--hair); border-radius: 6px; overflow: hidden; }
.ref { display: grid; grid-template-columns: 6.4em 2.6em minmax(0, 1fr) 1.1em; align-items: center; gap: 14px; width: 100%; min-height: 42px; padding: 8px 14px; text-align: left; border-top: 1px solid var(--soft); }
.ref:first-child { border-top: none; }
.ref:hover { background: var(--hover); }
.ref-sk { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--coral-dk); }
.ref-no { font-family: var(--mono); font-size: 12px; color: var(--coral); font-variant-numeric: tabular-nums; }
.ref-ti { min-width: 0; font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref-go { font-size: 12px; color: var(--faint); text-align: right; }
.ref:hover .ref-go { color: var(--coral); }
.ref[disabled] { cursor: default; }
.ref[disabled]:hover { background: none; }
.ref[disabled] .ref-sk, .ref[disabled] .ref-ti { color: var(--faint); }
@media (max-width: 560px) { .ref { grid-template-columns: 4.6em 2.4em minmax(0, 1fr); gap: 10px; } .ref-go { display: none; } .ref-note { display: none; } }
/* 본문 문장 안에 섞이는 참조 칩. 코드 조각이 아니라 규칙이라는 것을 보이게 한다. */
.ref-in { display: inline; padding: 0 5px; border-radius: 2px; font-family: var(--sans); font-size: .95em; line-height: inherit; color: var(--coral-dk); background: color-mix(in srgb, var(--coral) 7%, transparent); border: 1px solid color-mix(in srgb, var(--coral) 28%, transparent); }
.ref-in:hover { background: color-mix(in srgb, var(--coral) 16%, transparent); }
.ref-in::after { content: " ↗"; font-size: .8em; color: var(--coral); }

.rtags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hover); }
.rtag { min-height: 22px; padding: 0 8px; border-radius: 999px; font-family: var(--mono); font-size: 10px; color: var(--muted); border: 1px solid var(--hair); }
.rtag:hover { color: var(--coral-dk); border-color: color-mix(in srgb, var(--coral) 45%, transparent); }

.empty { padding: 72px 24px; text-align: center; border: 1px dashed var(--hair); border-radius: 3px; color: var(--muted); font-size: 13.5px; }
mark { background: color-mix(in srgb, var(--coral) 30%, transparent); color: inherit; border-radius: 2px; }

/* 적용 조건 불렛. 제외 조건은 라벨 칩과 낮은 대비로 본 조건과 갈라 읽힌다. */
.acc-body li.li-x { color: var(--muted); grid-template-columns: auto minmax(0, 1fr); }
.acc-body li.li-x::before { content: none; }
.x-lb { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; color: var(--faint); border: 1px solid var(--hair); border-radius: 2px; padding: 1px 5px; white-space: nowrap; }

/* ---------- rule dialog ---------- */
/* 참조 칩은 목록을 이동하는 대신 이 다이얼로그로 미리 보여준다. 보던 섹션을 잃지 않는다. */
.dlg { width: min(880px, calc(100vw - 32px)); max-height: min(86vh, 920px); margin: auto; padding: 0; overflow: hidden; border: 1px solid var(--edge); border-radius: 3px; background: var(--card); color: var(--ink); box-shadow: 0 24px 64px color-mix(in srgb, #0b0f11 35%, transparent); }
/* display 를 기본 선택자에 주면 UA 의 dialog:not([open]) { display: none } 을 덮어써
   닫힌 빈 다이얼로그의 테두리가 화면 중앙에 선으로 남는다. 열렸을 때만 준다. */
.dlg[open] { display: flex; flex-direction: column; }
.dlg::backdrop { background: color-mix(in srgb, #0b0f11 52%, transparent); }
/* 다이얼로그가 열리면 뒤 목록은 스크롤되지 않아야 한다. */
body:has(.dlg[open]) { overflow: hidden; }
.dlg-x { position: absolute; top: 12px; right: 12px; z-index: 3; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 2px; font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--hair); }
.dlg-x:hover { color: var(--ink); border-color: var(--edge); }
.dlg-scroll { overflow: auto; min-height: 0; }
.dlg .row { border: 0; border-radius: 0; }
.dlg .row-hd-dlg:hover { background: none; }
.dlg .row-hd-dlg { cursor: default; padding-right: 52px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="hd">
	<div class="hd-in">
		<div class="brand">
			<button class="rail-t" id="rail" aria-label="필터 패널 접기">◧</button>
			<span class="brand-nm">팀 컨벤션</span>
			<span class="brand-sub">HANDBOOK</span>
		</div>
		<div class="sr">
			<div class="sr-box">
				<span class="sr-ico" aria-hidden="true">◇</span>
				<input id="q" class="sr-in" type="search" autocomplete="off" spellcheck="false"
					placeholder="규칙·상황·코드 검색   /" aria-label="규칙 검색">
			</div>
		</div>
		<div class="hd-r">
			<span class="cnt" id="count"></span>
			<button class="btn" id="expand">전체 펼침</button>
			<button class="btn" id="theme" aria-label="라이트·다크 전환">테마</button>
		</div>
	</div>
</header>
<div class="wrap">
	<div class="pane" id="pane" data-rail="1">
		<aside class="rail">
			<div>
				<div class="grp-hd"><span class="grp-lb">Skill</span><span class="grp-note">단일 선택</span></div>
				<div class="col" id="f-skill"></div>
			</div>
			<div>
				<div class="grp-hd"><span class="grp-lb">영향도</span><button class="grp-clear" data-clear="impact">해제</button></div>
				<div class="col" id="f-impact"></div>
			</div>
			<div>
				<div class="grp-hd"><span class="grp-lb">섹션</span><button class="grp-clear" data-clear="section">해제</button></div>
				<div class="col" id="f-section"></div>
			</div>
			<div>
				<div class="grp-hd"><span class="grp-lb">태그</span><button class="grp-clear" data-clear="tags">해제</button></div>
				<div class="tagwrap" id="f-tags"></div>
			</div>
		</aside>
		<main><div class="list" id="list"></div></main>
	</div>
</div>
<dialog class="dlg" id="dlg" aria-label="규칙 미리 보기"></dialog>
<script src="conventions-data.js"></script>
<script>
(() => {
	"use strict";

	// 데이터는 같은 폴더의 conventions-data.js 가 전역으로 싣는다. file:// 에서는 fetch 가 막혀 script src 를 쓴다.
	const DATA = window.CONVENTION_DATA;

	if (!DATA) {
		document.body.innerHTML =
			'<p style="padding:64px 24px;text-align:center;color:#77848a">conventions-data.js 를 찾을 수 없습니다. conventions.html 과 같은 폴더에 함께 두세요.</p>';
		return;
	}

	const RULES = DATA.rules;
	const IMPACTS = ["CRITICAL", "HIGH", "MEDIUM-HIGH", "MEDIUM", "LOW"];
	const DOT = {
		CRITICAL: "var(--coral)",
		HIGH: "color-mix(in srgb, var(--coral) 75%, transparent)",
		"MEDIUM-HIGH": "color-mix(in srgb, var(--coral) 40%, transparent)",
		MEDIUM: "var(--edge)",
		LOW: "var(--soft)",
	};

	const keyOf = (r) => r.skill + "/" + r.id;
	const domIdOf = (r) => "r-" + r.skill + "--" + r.id;
	const byKey = new Map(RULES.map((r) => [keyOf(r), r]));
	const titleOf = (r) => r.titleKo || r.title;
	// 화면 표기는 대문자 축약으로 통일한다. typescript 만 길어서 TS 로 줄인다.
	const skillTag = (name) => (name === "typescript" ? "TS" : String(name).toUpperCase());
	const secOf = (r) => DATA.sections.find((s) => s.skill === r.skill && s.prefix === r.sectionPrefix);
	const secLabel = (s) => s.titleKo || s.title;

	// skill 은 단일 선택. section 은 skill 마다 같은 prefix 를 쓸 수 있어 "skill/prefix" 로 잡는다.
	const state = {q: "", skill: "", impact: new Set(), section: "", tags: new Set(), open: new Set(), when: new Set(), why: new Set(), sample: new Map()};

	const remember = () => { try { localStorage.setItem("viewer-skill", state.skill); } catch (e) {} };

	// 레일 접힘. 좁은 화면에서 본문 폭을 되찾는 유일한 수단이라 새로고침해도 남는다.
	const pane = document.getElementById("pane");
	const railBtn = document.getElementById("rail");
	const paintRail = (open) => {
		pane.dataset.rail = open ? "1" : "0";
		railBtn.textContent = open ? "\u25e7" : "\u25e8";
		railBtn.setAttribute("aria-label", open ? "필터 패널 접기" : "필터 패널 펼치기");
	};
	let railOpen = true;

	try { railOpen = localStorage.getItem("viewer-rail") !== "0"; } catch (e) {}

	paintRail(railOpen);
	railBtn.addEventListener("click", () => {
		railOpen = !railOpen;
		paintRail(railOpen);
		try { localStorage.setItem("viewer-rail", railOpen ? "1" : "0"); } catch (e) {}
	});
	try { state.skill = localStorage.getItem("viewer-skill") || ""; } catch (e) {}
	if (!DATA.skills.some((s) => s.name === state.skill)) {
		state.skill = DATA.skills.some((s) => s.name === "react") ? "react" : (DATA.skills[0] ? DATA.skills[0].name : "");
	}

	const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
	const KW = /\b(const|let|var|function|return|if|else|for|while|export|import|from|type|interface|as|await|async|new|void|null|undefined|true|false|extends|default|typeof|in|of)\b/g;

	function hl(code, lang) {
		let s = esc(code);
		const hold = [];
		// 자리표시자는 코드에 절대 없는 NUL 이어야 한다.
		// 공백+숫자를 쓰면 `arr.length > 0 ?` 의 " 0 " 과 충돌해 코드가 깨진다.
		const park = (t) => "\u0000" + (hold.push(t) - 1) + "\u0000";
		const wrap = (cls, m) => park('<span class="' + cls + '">' + m + "</span>");
		s = s.replace(/\/\/[^\n]*/g, (m) => wrap("c", m));
		s = s.replace(/\/\*[\s\S]*?\*\//g, (m) => wrap("c", m));
		s = s.replace(/(&#39;|'|"|`)(?:\\.|(?!\1)[\s\S])*?\1/g, (m) => wrap("s", m));
		if (lang === "tsx") {
			s = s.replace(/&lt;\/?([A-Za-z][\w.-]*)/g, (m, n) => m.replace(n, '<span class="g">' + n + "</span>"));
		}
		s = s.replace(KW, '<span class="k">$&</span>');
		return s.replace(/\u0000(\d+)\u0000/g, (_, i) => hold[+i]);
	}

	// 백틱 안이 규칙 ID 면 코드가 아니라 열 수 있는 참조 칩으로 그린다.
	const codeOrRef = (raw, ownerSkill) => {
		const key = raw.includes("/") ? raw : ownerSkill + "/" + raw;
		const rule = ownerSkill ? byKey.get(key) : undefined;
		if (!rule) return "<code>" + esc(raw) + "</code>";
		const label = skillTag(rule.skill) + " " + rule.number + "  " + titleText(rule);
		return '<button class="ref-in" data-goto="' + esc(key) + '" title="' + esc(key) + '">' + esc(label) + "</button>";
	};
	/**
	 * 원문을 backtick 으로 잘라 조각마다 한 번만 escape 한다.
	 * escape 한 다음 backtick 을 찾으면 `<Activity>` 가 `&lt;Activity&gt;` 로 바뀐 뒤 다시 escape 돼
	 * 화면에 &amp;lt; 가 그대로 보인다. 코드 조각은 자리표시자로 빼 두고 굵게 처리 뒤 되돌린다.
	 */
	const inline = (t, ownerSkill) => {
		const hold = [];
		const parked = String(t == null ? "" : t)
			.split("`")
			.map((seg, i) => (i % 2 ? "\u0000" + (hold.push(codeOrRef(seg, ownerSkill)) - 1) + "\u0000" : esc(seg)))
			.join("");
		return parked
			.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
			.replace(/\u0000(\d+)\u0000/g, (_, i) => hold[+i]);
	};

	function renderProse(prose, ownerSkill) {
		let out = "", para = [], tbl = null, list = null;
		// 원문은 한 줄에 한 문장이다. 문장이 끝난 자리만 줄바꿈하고, 이어지는 줄은 공백으로 붙인다.
		const joinSentences = (lines) =>
			lines.reduce((acc, line, i) => (i === 0 ? line : acc + (/[.:?!]$/.test(lines[i - 1]) ? "<br>" : " ") + line), "");
		const flushP = () => { if (para.length) { out += "<p>" + joinSentences(para.map((line) => inline(line, ownerSkill))) + "</p>"; para = []; } };
		const flushL = () => {
			if (!list) return;
			out += "<ul>" + list.map((item) => "<li>" + inline(item, ownerSkill) + "</li>").join("") + "</ul>";
			list = null;
		};
		const flushT = () => {
			if (!tbl) return;
			const head = tbl[0], body = tbl.slice(1);
			out += '<div class="tw"><table><thead><tr>' + head.map((c) => "<th>" + inline(c, ownerSkill) + "</th>").join("") + "</tr></thead><tbody>";
			out += body.map((r) => "<tr>" + r.map((c) => "<td>" + inline(c, ownerSkill) + "</td>").join("") + "</tr>").join("");
			out += "</tbody></table></div>";
			tbl = null;
		};
		const flushAll = () => { flushP(); flushL(); flushT(); };

		for (const p of prose) {
			// 문자열은 일반 줄, 객체는 코드 블록이다.
			if (typeof p !== "string") { flushAll(); out += '<pre class="code">' + hl(p.code, p.lang) + "</pre>"; continue; }
			const t = p.trim();

			// 표
			if (t.startsWith("|")) {
				flushP(); flushL();
				const cells = t.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
				if (cells.every((c) => /^:?-{2,}:?$/.test(c))) continue;
				tbl = tbl || []; tbl.push(cells);
				continue;
			}
			flushT();

			// 목록. 이걸 문단으로 뭉치면 "- 항목 - 항목" 으로 이어져 읽을 수 없다.
			const bullet = /^[-*+]\s+(.*)$/.exec(t);
			if (bullet) {
				flushP();
				list = list || []; list.push(bullet[1]);
				continue;
			}
			// 목록 항목의 이어지는 줄은 마지막 항목에 붙인다.
			if (list && t) { list[list.length - 1] += " " + t; continue; }

			if (!t) { flushAll(); continue; }
			para.push(t);
		}
		flushAll();
		return out;
	}

	function haystack(r) {
		if (r._h) return r._h;
		const code = r.examples.flatMap((e) => e.blocks.map((b) => b.code)).join("\n");
		// 한국어·영어 제목을 모두 색인해 어느 언어로 검색해도 걸린다.
		return (r._h = [r.titleKo, r.title, r.id, r.skill, r.appliesWhen, r.appliesWhenBullets.join(" "), r.impactDescription, r.tags.join(" "), code].join("\n").toLowerCase());
	}

	function matches(r) {
		if (state.skill && r.skill !== state.skill) return false;
		if (state.section && r.skill + "/" + r.sectionPrefix !== state.section) return false;
		if (state.impact.size && !state.impact.has(r.impact)) return false;
		if (state.tags.size && !r.tags.some((t) => state.tags.has(t))) return false;
		if (state.q) {
			const h = haystack(r);
			return state.q.toLowerCase().split(/\s+/).filter(Boolean).every((t) => h.includes(t));
		}
		return true;
	}

	function hi(text) {
		const t = esc(text);
		if (!state.q) return t;
		const terms = state.q.split(/\s+/).filter(Boolean).map((x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
		return terms.length ? t.replace(new RegExp("(" + terms.join("|") + ")", "gi"), "<mark>$1</mark>") : t;
	}

	// 검색 하이라이트를 유지한 채 backtick 구간만 <code> 로 감싼다.
	const inlineHi = (t) => String(t == null ? "" : t).split("`").map((seg, i) => (i % 2 ? "<code>" + esc(seg) + "</code>" : hi(seg))).join("");
	// 제목에도 백틱이 온다. 코드 식별자를 영어 낱말처럼 보이지 않게 <code> 로 감싼다.
	const titleHtml = (r) => inlineHi(titleOf(r));
	const titleText = (r) => titleOf(r).replace(/`/g, "");

	// 적용 조건은 불렛이 있으면 불렛으로, 없으면 appliesWhen 원문 문단으로 보여준다.
	// "제외:" 로 시작하는 항목은 걸리지 않는 조건이라 라벨 칩으로 갈라 보여준다.
	const whenHtml = (r) => {
		if (!r.appliesWhenBullets.length) return "<p>" + inlineHi(r.appliesWhen) + "</p>";
		return "<ul>" + r.appliesWhenBullets.map((b) => {
			const m = /^제외\s*[:—-]\s*/.exec(b);
			return m
				? '<li class="li-x"><span class="x-lb">제외</span>' + inlineHi(b.slice(m[0].length)) + "</li>"
				: "<li>" + inlineHi(b) + "</li>";
		}).join("") + "</ul>";
	};

	// 참조 한 줄은 skill · 번호 · 한국어 제목 · 이동 방향으로 읽는다.
	// ID 는 title 속성에 남겨 grep 이 되게 한다. 같은 skill 안의 참조는 ID 만 오므로 소유 skill 을 붙여 해석한다.
	const refHtml = (target, ownerSkill) => {
		const ext = target.includes("/");
		const key = ext ? target : ownerSkill + "/" + target;
		const rule = byKey.get(key);
		if (!rule) {
			return '<button class="ref" title="' + esc(key) + '" disabled><span class="ref-sk">' + esc(skillTag(ext ? target.split("/")[0] : ownerSkill)) +
				'</span><span class="ref-no"></span><span class="ref-ti">' + esc(target.split("/").pop()) + "</span></button>";
		}
		return '<button class="ref" data-goto="' + esc(key) + '" title="' + esc(key) + '">' +
			'<span class="ref-sk">' + esc(skillTag(rule.skill)) + "</span>" +
			'<span class="ref-no">' + esc(rule.number) + "</span>" +
			'<span class="ref-ti">' + titleHtml(rule) + "</span>" +
			'<span class="ref-go" aria-hidden="true">' + (ext ? "\u2197" : "\u2192") + "</span></button>";
	};

	// 블록이 여러 개면 박스 하나 안에서 "1 / 2 · lang" 구분선으로 잇는다.
	// 첫 줄이 경로 주석이면 코드에서 떼어 머리띠로 올린다. 주석색에 묻히지 않는다.
	const PATH_RE = /^\s*(?:\/\/|#)\s*(\S+\.(?:tsx?|jsx?|css|scss|json|html?|md|ya?ml))\s*$/;
	const splitPath = (code) => {
		const lines = code.split("\n");
		const hit = PATH_RE.exec(lines[0] || "");

		if (!hit) return {path: "", code: code};

		let rest = lines.slice(1);

		while (rest.length && !rest[0].trim()) rest = rest.slice(1);

		return {path: hit[1], code: rest.join("\n")};
	};

	// 두 예시가 얼마나 닮았는지 LCS 로 재고, 짝이 안 맞은 줄만 바뀐 줄로 표시한다.
	// 0.45 아래면 서로 다른 코드라 나란히 놓아도 비교가 안 되므로 diff 를 포기한다.
	const diffMarks = (a, b) => {
		const n = a.length;
		const m = b.length;

		if (!n || !m) return null;

		const dp = Array.from({length: n + 1}, () => new Array(m + 1).fill(0));

		for (let i = n - 1; i >= 0; i--) {
			for (let j = m - 1; j >= 0; j--) {
				dp[i][j] = a[i].trim() === b[j].trim() ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
			}
		}

		if (dp[0][0] / Math.max(n, m) < 0.45) return null;

		const am = new Array(n).fill(true);
		const bm = new Array(m).fill(true);
		let i = 0;
		let j = 0;

		while (i < n && j < m) {
			if (a[i].trim() === b[j].trim()) { am[i] = false; bm[j] = false; i++; j++; }
			else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
			else j++;
		}

		return {am: am, bm: bm};
	};

	const codeHtml = (blocks, marks) => blocks.map((b, i) => {
		const split = splitPath(b.code);
		const rows = split.code.split("\n");
		const painted = hl(split.code, b.lang).split("\n");
		const mask = blocks.length === 1 && marks ? marks : null;
		const glyph = mask ? (marks.bad ? "\u2212" : "+") : "";
		const cells = rows.map((_, n) => {
			const on = mask && mask.mask[n] ? " on" : "";

			return '<i class="n' + on + '">' + (n + 1) + '</i><i class="m' + on + '">' + (on ? glyph : "\u00a0") + '</i>' +
				'<i class="c' + on + '">' + (painted[n] || "\u200b") + "</i>";
		}).join("");

		return (blocks.length > 1 ? '<div class="cd-lb">' + (i + 1) + " / " + blocks.length + "  \u00b7  " + esc(b.lang) + "</div>" : "") +
			(split.path ? '<div class="cd-p"><span class="ico" aria-hidden="true">\u25c7</span><span class="p">' + esc(split.path) + "</span></div>" : "") +
			'<div class="cd">' + cells + "</div>";
	}).join("");

	const boxHtml = (e, marks) => {
		if (!e) return "";

		const bad = e.kind === "incorrect";
		const langs = [...new Set(e.blocks.map((b) => b.lang))].join(" \u00b7 ");

		return '<div class="box ' + (bad ? "box-bad" : "box-good") + '"><div class="box-hd">' +
			'<span class="box-gl" aria-hidden="true">' + (bad ? "\u2212" : "+") + "</span>" +
			'<span class="box-note">' + (e.label ? inlineHi(e.label) : (bad ? "INCORRECT" : "CORRECT")) + "</span>" +
			"</div>" + codeHtml(e.blocks, marks ? {mask: marks, bad: bad} : null) + "</div>";
	};

	// 같은 종류가 이어지면 한 상자에 넣고 기본으로 접는다. 제목은 늘 보이고 코드만 감춘다.
	const groupHtml = (kind, samples, key, index) => {
		const bad = kind === "incorrect";
		const n = samples.length;
		const skey = key + ":" + index;
		const stored = state.sample.get(skey);
		const openIdx = stored === undefined ? (n === 1 ? [0] : []) : stored;
		const allOpen = n > 0 && samples.every((_, i) => openIdx.indexOf(i) >= 0);
		const cls = bad ? "gx-bad" : "gx-good";
		const head = n > 1
			? '<div class="gx-hd"><span class="gx-tag"><span aria-hidden="true">' + (bad ? "\u2715" : "\u2713") + "</span>" +
				"<span>" + (bad ? "INCORRECT" : "CORRECT") + " \u00b7 " + n + '</span></span><span class="gx-rule"></span>' +
				'<button class="gx-all" data-all="' + esc(skey) + '" data-n="' + n + '">' + (allOpen ? "모두 접기" : "모두 펼치기") + "</button></div>"
			: "";
		const rows = samples.map((e, i) => {
			const isOpen = openIdx.indexOf(i) >= 0;

			return '<div class="smp" data-open="' + (isOpen ? 1 : 0) + '">' +
				'<button class="smp-b" data-smp="' + esc(skey) + '" data-i="' + i + '">' +
				'<span class="smp-no">' + (n > 1 ? i + 1 : (bad ? "\u2715" : "\u2713")) + "</span>" +
				'<span class="box-note">' + (e.label ? inlineHi(e.label) : "") + "</span>" +
				'<span class="smp-car" aria-hidden="true">' + (isOpen ? "\u25be" : "\u25b8") + "</span></button>" +
				'<div class="smp-body">' + (isOpen ? codeHtml(e.blocks, null) : "") + "</div></div>";
		}).join("");

		return '<div class="gx ' + cls + '">' + head +
			'<div class="box ' + (bad ? "box-bad" : "box-good") + '">' + rows + "</div></div>";
	};

	// dlg 모드는 참조 미리 보기 다이얼로그 전용이다. 항상 펼치고, 목록과 id 가 겹치지 않게 둔다.
	function ruleHtml(r, dlg) {
		const key = keyOf(r);
		const open = dlg ? true : state.open.has(key);
		const whenOpen = state.when.has(key);
		const whyOpen = state.why.has(key);
		const sec = secOf(r);
		const exCount = r.examples.reduce((t, e) => t + e.blocks.length, 0);

		let body = "";
		if (open) {
			// Incorrect 바로 뒤에 Correct 가 오고 둘 다 코드 블록 하나이며 서로 닮았으면 좌우 diff 로,
			// 아니면 같은 종류가 이어지는 만큼 묶어 접이식 그룹으로 그린다.
			const units = [];

			for (let i = 0; i < r.examples.length; i++) {
				const e = r.examples[i];
				const nx = r.examples[i + 1];
				let marks = null;

				const sideBySide = e.kind === "incorrect" && nx && nx.kind === "correct" && e.blocks.length === 1 && nx.blocks.length === 1;

				if (sideBySide) {
					// 줄 강조는 두 예시가 실제로 닮았을 때만 뜻이 있다.
					// 다시 쓴 예시에 강조를 칠하면 전부 바뀐 줄이 되어 아무것도 못 가린다.
					marks = diffMarks(splitPath(e.blocks[0].code).code.split("\n"), splitPath(nx.blocks[0].code).code.split("\n"));
					units.push({diff: true, bad: e, good: nx, marks: marks, at: i});
					i++;
					continue;
				}

				const run = [];
				const at = i;

				while (i < r.examples.length && r.examples[i].kind === e.kind) { run.push(r.examples[i]); i++; }

				i--;
				units.push({diff: false, kind: e.kind, samples: run, at: at});
			}

			const exsHtml = units.map((u) => u.diff
				? '<div class="diff">' + boxHtml(u.bad, u.marks ? u.marks.am : null) + boxHtml(u.good, u.marks ? u.marks.bm : null) + "</div>"
				: groupHtml(u.kind, u.samples, key, u.at)).join("");
			// 두 목록이 무엇이 다른지 라벨만으로는 알 수 없어서 한 줄 설명을 붙인다.
			const refs = [];
			if (r.requiresSelected.length) refs.push(["함께 적용", "이 규칙이 걸리면 반드시 같이 적용합니다", r.requiresSelected]);
			if (r.reviewWith.length) refs.push(["함께 검토", "같이 적용하진 않고 다시 판단해 봅니다", r.reviewWith]);

			// 아코디언 두 개는 같은 형태로 둔다. 둘 다 접힌 상태로 시작해 코드가 먼저 읽힌다.
			const acc = (attr, label, open, inner) =>
				'<div class="acc" data-open="' + (open ? 1 : 0) + '">' +
				'<button class="acc-btn" data-' + attr + '="' + esc(key) + '">' +
				'<span class="acc-car" aria-hidden="true">' + (open ? "\u25be" : "\u25b8") + "</span>" +
				"<span>" + label + "</span></button>" +
				'<div class="acc-body">' + (open ? inner() : "") + "</div></div>";

			// 순서: 코드 → 언제 → 왜 → 함께 → 태그.
			// 규칙을 펼치는 이유는 "어떻게 고치나" 이므로 코드가 먼저 온다.
			body = '<div class="body">' +
				'<div class="meta"><span>' + esc(r.id) + "</span>" +
				(sec ? '<span class="meta-s">·</span><span>' + esc(secLabel(sec)) + "</span>" : "") +
				'<span class="meta-s">·</span><span>예시 ' + exCount + "</span></div>" +
				'<div class="exs">' + exsHtml + "</div>" +
				'<div class="accs">' +
				(r.appliesWhen || r.appliesWhenBullets.length
					? acc("when", "언제 적용할까요?", whenOpen, () => whenHtml(r))
					: "") +
				(r.prose.length || r.impactDescription
					? acc("why", "이 규칙이 왜 필요할까요?", whyOpen, () =>
						(r.impactDescription ? '<p class="lead">' + esc(r.impactDescription) + "</p>" : "") + renderProse(r.prose, r.skill))
					: "") +
				"</div>" +
				(refs.length ? '<div class="refs">' + refs.map((g) => "<div>" +
					'<div class="ref-hd"><span class="ref-lb">' + g[0] + '</span><span class="ref-n">' + g[2].length + "</span>" +
					'<span class="ref-note">' + g[1] + "</span></div>" +
					'<div class="ref-list">' + g[2].map((t) => refHtml(t, r.skill)).join("") + "</div></div>").join("") + "</div>" : "") +
				'<div class="rtags">' + r.tags.map((t) => '<button class="rtag" data-tag="' + esc(t) + '">#' + esc(t) + "</button>").join("") + "</div>" +
				"</div>";
		}

		const head = dlg
			? '<div class="row-hd row-hd-dlg">' +
				'<span class="row-no" title="' + esc(skillTag(r.skill)) + " HANDBOOK " + r.number + '">' + r.number + "</span>" +
				'<span class="row-ti">' + titleHtml(r) + "</span>" +
				'<span class="row-meta"><span class="imp imp-' + r.impact + '">' + r.impact + "</span></span></div>"
			: '<button class="row-hd" data-rule="' + esc(key) + '" aria-expanded="' + open + '">' +
				'<span class="row-no" title="' + esc(skillTag(r.skill)) + " HANDBOOK " + r.number + '">' + r.number + "</span>" +
				'<span class="row-ti">' + titleHtml(r) + "</span>" +
				'<span class="row-meta"><span class="imp imp-' + r.impact + '">' + r.impact + "</span>" +
				'<span class="car" aria-hidden="true">' + (open ? "\u25be" : "\u25b8") + "</span></span></button>";

		return '<article class="row" data-imp="' + r.impact + '" data-open="' + (open ? 1 : 0) + '"' +
			(dlg ? "" : ' id="' + domIdOf(r) + '"') + ">" +
			'<span class="row-stripe" aria-hidden="true"></span>' +
			head + body + "</article>";
	}

	function renderRail() {
		const scoped = RULES.filter((r) => !state.skill || r.skill === state.skill);
		const count = (fn) => scoped.filter(fn).length;

		document.getElementById("f-skill").innerHTML = DATA.skills.map((s) =>
			'<button class="ch ch-skill" data-skill="' + s.name + '" aria-pressed="' + (state.skill === s.name) + '">' +
			'<span class="ch-lb">' + skillTag(s.name) + '</span><span class="ch-n">' + s.ruleCount + "</span></button>").join("");

		document.getElementById("f-impact").innerHTML = IMPACTS.map((k) => {
			const active = state.impact.has(k);
			return '<button class="ch ch-imp" data-impact="' + k + '" aria-pressed="' + active + '">' +
				'<span class="ch-dot" style="background:' + (active ? "#fff" : DOT[k]) + '"></span>' +
				'<span class="ch-lb">' + k + '</span><span class="ch-n">' + count((r) => r.impact === k) + "</span></button>";
		}).join("");

		const secs = DATA.sections.filter((s) => !state.skill || s.skill === state.skill)
			.slice()
			.sort((a, b) => a.skill.localeCompare(b.skill, "en-US") || a.order - b.order);
		document.getElementById("f-section").innerHTML = secs.map((s) => {
			const key = s.skill + "/" + s.prefix;
			return '<button class="ch ch-sec" data-section="' + esc(key) + '" aria-pressed="' + (state.section === key) + '">' +
				'<span class="ch-no">' + (state.skill ? s.order + "." : skillTag(s.skill) + " " + s.order) + "</span>" +
				'<span class="ch-lb">' + esc(secLabel(s)) + '</span><span class="ch-n">' +
				count((r) => r.skill === s.skill && r.sectionPrefix === s.prefix) + "</span></button>";
		}).join("");

		const tally = new Map();
		for (const r of scoped) for (const t of r.tags) tally.set(t, (tally.get(t) || 0) + 1);
		document.getElementById("f-tags").innerHTML = [...tally.entries()].filter((e) => e[1] > 1)
			.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
			.slice(0, 36)
			.map((e) => '<button class="tg" data-tag="' + esc(e[0]) + '" aria-pressed="' + state.tags.has(e[0]) + '">' +
				"<span>" + esc(e[0]) + '</span><span class="tg-n">' + e[1] + "</span></button>").join("");

	}

	function render() {
		const hits = RULES.filter(matches);
		const scopeTotal = RULES.filter((r) => !state.skill || r.skill === state.skill).length;
		document.getElementById("list").innerHTML = hits.length
			? hits.map((r) => ruleHtml(r)).join("")
			: '<div class="empty">일치하는 규칙이 없습니다. 검색어나 필터를 줄여보세요.</div>';
		const codeTotal = hits.reduce((n, r) => n + r.examples.reduce((m, e) => m + e.blocks.length, 0), 0);
		document.getElementById("count").textContent = hits.length + " / " + scopeTotal + " 규칙" + (hits.length ? "  ·  코드 " + codeTotal : "");
		const allOpen = hits.length > 0 && hits.every((r) => state.open.has(keyOf(r)));
		document.getElementById("expand").textContent = allOpen ? "전체 접기" : "전체 펼침";
		renderRail();
	}

	// 참조 미리 보기 다이얼로그. 목록 스크롤을 유지한 채 다른 규칙을 읽는다.
	const dlg = document.getElementById("dlg");
	let dlgKey = "";

	function renderDialog() {
		if (!dlgKey) return;
		const r = byKey.get(dlgKey);
		if (!r) return;
		dlg.setAttribute("aria-label", titleText(r));
		dlg.innerHTML = '<button class="dlg-x" data-close="1" aria-label="닫기">\u2715</button>' +
			'<div class="dlg-scroll">' + ruleHtml(r, true) + "</div>";
	}

	function openDialog(key) {
		if (!byKey.has(key)) return;
		dlgKey = key;
		renderDialog();
		if (!dlg.open) dlg.showModal();
		const scroller = dlg.querySelector(".dlg-scroll");
		if (scroller) scroller.scrollTop = 0;
	}

	// 내용이 다이얼로그를 가득 채우므로 dialog 자체가 target 이면 backdrop 클릭이다.
	dlg.addEventListener("click", (ev) => { if (ev.target === dlg) dlg.close(); });
	dlg.addEventListener("close", () => { dlgKey = ""; dlg.innerHTML = ""; });

	function selectSkill(name) {
		if (state.skill === name) return;
		state.skill = name;
		state.section = "";
		state.impact.clear();
		state.tags.clear();
		remember();
		render();
	}

	document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value.trim(); render(); });

	document.getElementById("expand").addEventListener("click", () => {
		const hits = RULES.filter(matches);
		const allOpen = hits.length && hits.every((r) => state.open.has(keyOf(r)));
		for (const r of hits) { const k = keyOf(r); allOpen ? state.open.delete(k) : state.open.add(k); }
		render();
	});

	document.getElementById("theme").addEventListener("click", () => {
		const cur = document.documentElement.dataset.theme;
		const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
		document.documentElement.dataset.theme = dark ? "light" : "dark";
	});

	document.addEventListener("click", (ev) => {
		const t = ev.target.closest("[data-rule],[data-skill],[data-impact],[data-section],[data-tag],[data-when],[data-why],[data-goto],[data-close],[data-clear],[data-smp],[data-all]");
		if (!t) return;
		// 다이얼로그가 열려 있으면 그 안의 아코디언도 같은 상태를 쓰므로 함께 다시 그린다.
		const toggle = (set, key) => { set.has(key) ? set.delete(key) : set.add(key); render(); renderDialog(); };

		if (t.dataset.rule) return toggle(state.open, t.dataset.rule);
		if (t.dataset.skill) return selectSkill(t.dataset.skill);
		if (t.dataset.impact) return toggle(state.impact, t.dataset.impact);
		if (t.dataset.tag) return toggle(state.tags, t.dataset.tag);
		if (t.dataset.section) { state.section = state.section === t.dataset.section ? "" : t.dataset.section; return render(); }
		if (t.dataset.when) return toggle(state.when, t.dataset.when);

		// 예시 하나를 여닫는다. 카드 자체가 접히지 않도록 규칙 토글보다 먼저 가로챈다.
		if (t.dataset.smp) {
			const skey = t.dataset.smp;
			const idx = Number(t.dataset.i);
			const cur = state.sample.get(skey) || [];

			state.sample.set(skey, cur.indexOf(idx) >= 0 ? cur.filter((x) => x !== idx) : cur.concat([idx]));
			render();
			return renderDialog();
		}

		if (t.dataset.all) {
			const skey = t.dataset.all;
			const total = Number(t.dataset.n);
			const cur = state.sample.get(skey) || [];

			state.sample.set(skey, cur.length === total ? [] : Array.from({length: total}, (_unused, i) => i));
			render();
			return renderDialog();
		}

		if (t.dataset.why) return toggle(state.why, t.dataset.why);
		if (t.dataset.close) return dlg.close();

		// 참조 칩은 보던 위치를 잃지 않게 목록 이동 대신 다이얼로그로 미리 보여준다.
		// 다른 skill 규칙도 목록 필터를 건드리지 않고 그대로 열린다.
		if (t.dataset.goto) return openDialog(t.dataset.goto);

		if (t.dataset.clear) {
			if (t.dataset.clear === "impact") state.impact.clear();
			if (t.dataset.clear === "tags") state.tags.clear();
			if (t.dataset.clear === "section") state.section = "";
			render();
		}
	});

	document.addEventListener("keydown", (e) => {
		if (e.key === "/" && e.target.tagName !== "INPUT") { e.preventDefault(); document.getElementById("q").focus(); }
		if (e.key === "Escape" && e.target.id === "q") { e.target.value = ""; state.q = ""; render(); e.target.blur(); }
	});

	render();
})();
</script>
</body>
</html>
