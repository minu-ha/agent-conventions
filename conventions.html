ture-use-parentheses-folders-for-pathless-route-groups","number":"1.5","title":"Use Parentheses Folders for Pathless Route Groups","titleKo":"경로 없는 route 그룹은 괄호 폴더로","impact":"HIGH","impactDescription":"URL 계층과 그룹 계층을 분리해 경로를 바꾸지 않고도 중첩 route 를 정돈함","appliesWhen":"","tags":["pathless-routes","grouping","folders"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"structure","prose":["paths)**","","일반 폴더는 실제 URL 세그먼트를 반영하는 상위 계층이고,","괄호 폴더 `()`는 하위 라우트를 그룹화하기 위한 pathless 계층입니다.","URL에 보여야 하는 상위 계층만 일반 폴더로 두고, 하위 라우트 묶음은 괄호 폴더로 분리합니다."],"examples":[{"kind":"incorrect","label":"URL 계층과 그룹 계층을 같은 폴더 규칙으로 섞음","blocks":[{"lang":"txt","code":"\u003croute-root>/app/settings.profile.index.tsx\n\u003croute-root>/app/settings.security.index.tsx"}]},{"kind":"correct","label":"URL 폴더와 pathless 그룹 폴더를 구분","blocks":[{"lang":"txt","code":"\u003croute-root>/app/\n  app.layout.tsx\n  app.index.tsx\n  (settings)/\n    settings.index.tsx\n    (security)/\n      security.index.tsx"}]}]},{"skill":"tanstack-route","id":"naming-name-top-level-groups-by-shell-meaning","number":"2.1","title":"Name Top-level Groups by Shell Meaning","titleKo":"최상위 그룹은 셸 의미로 이름 짓기","impact":"HIGH","impactDescription":"최상위 route 그룹이 우연히 담고 있는 기능이 아니라 소속 셸을 말하게 함","appliesWhen":"","tags":["naming","layout-shell","route-groups"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"naming","prose":["contain)**","","최상위 그룹 이름은 기능명이 아니라 레이아웃 셸 의미가 드러나야 합니다.","`public/app`, `auth/workspace`, `marketing/admin`처럼 셸 단위를 표현하고, 같은 셸이면 새 그룹 이름을 만들지 않습니다."],"examples":[{"kind":"incorrect","label":"기능명으로 최상위 그룹 의미를 대신함","blocks":[{"lang":"txt","code":"\u003croute-root>/(orders)/orders.index.tsx\n\u003croute-root>/(members)/members.index.tsx\n\u003croute-root>/(reports)/reports.index.tsx"}]},{"kind":"correct","label":"셸 의미가 드러나는 이름을 사용","blocks":[{"lang":"txt","code":"\u003croute-root>/(public)/home.index.tsx\n\u003croute-root>/(workspace)/workspace.index.tsx\n\u003croute-root>/(workspace)/workspace/(reports)/reports.index.tsx"}]}]},{"skill":"tanstack-route","id":"naming-prepare-the-basic-route-file-set","number":"2.2","title":"Prepare the Basic Route File Set","titleKo":"기본 route 파일 세트를 갖추기","impact":"MEDIUM-HIGH","impactDescription":"중첩 route 가 처음부터 스타일·셸 코드·순수 헬퍼를 둘 예측 가능한 자리를 갖게 함","appliesWhen":"","tags":["file-set","route-assets","naming"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"naming","prose":["start)**","","이 프로젝트의 route file set은 `feature.css`, `feature.ts`, `feature.layout.tsx`,","`feature.index.tsx` 4개를 기본 세트로 봅니다.","`*.layout.tsx`는 눈에 띄는 shell UI가 아직 없더라도 route tunnel과 향후 layout 책임을 받을 경계로 미리 두고,","`*.ts`는 route support code가 자라날 기본 자리로 둡니다.","이렇게 해야 라우트가 커져도 스타일, 셸, 화면, 순수 로직의 자리가 예측 가능하게 유지됩니다."],"examples":[{"kind":"incorrect","label":"4-file set 없이 화면 파일만 먼저 만들어 책임 경계가 사라짐","blocks":[{"lang":"txt","code":"(settings)/\n  settings.index.tsx"}]},{"kind":"correct","label":"기본 4-file route 세트를 먼저 마련","blocks":[{"lang":"txt","code":"(settings)/\n  settings.css\n  settings.ts\n  settings.layout.tsx\n  settings.index.tsx"}]}]},{"skill":"tanstack-route","id":"naming-start-child-route-sets-with-parentheses-folders","number":"2.3","title":"Start Child Route Sets With Parentheses Folders","titleKo":"자식 route 세트는 괄호 폴더로 시작","impact":"HIGH","impactDescription":"파일명이 길어지거나 형제 route 가 훑기 어려워지기 전에 자식 route 그룹을 드러냄","appliesWhen":"","tags":["child-routes","grouping","folders"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"naming","prose":["하위 라우트가 생기면 기본적으로 먼저 `(\u003cfeature>)` 그룹 폴더를 만들고, 그 안에 해당 feature의 4-file set(`feature.css`,","`feature.ts`, `feature.layout.tsx`, `feature.index.tsx`)과 `-local/`을 정리합니다.","이 규칙의 목적은 URL semantics를 바꾸는 것이 아니라 route asset 묶음을 한 feature 단위로 보이게 유지하는 것입니다.","이렇게 하면 sibling route가 늘어나도 같은 계층의 route asset이 서로 섞이지 않고, 파일명이 불필요하게 길어지지 않습니다."],"examples":[{"kind":"incorrect","label":"하위 라우트를 플랫 파일명으로 계속 누적","blocks":[{"lang":"txt","code":"\u003croute-root>/app/settings.index.tsx\n\u003croute-root>/app/settings.profile.index.tsx\n\u003croute-root>/app/settings.security.index.tsx"}]},{"kind":"correct","label":"하위 라우트 묶음을 그룹 폴더로 먼저 감쌈","blocks":[{"lang":"txt","code":"\u003croute-root>/app/(settings)/settings.css\n\u003croute-root>/app/(settings)/settings.ts\n\u003croute-root>/app/(settings)/settings.layout.tsx\n\u003croute-root>/app/(settings)/settings.index.tsx\n\u003croute-root>/app/(settings)/(profile)/profile.index.tsx\n\u003croute-root>/app/(settings)/(security)/security.index.tsx"}]}]},{"skill":"tanstack-route","id":"naming-use-domain-specific-dynamic-segment-names","number":"2.4","title":"Use Domain-specific Dynamic Segment Names","titleKo":"동적 세그먼트는 도메인 이름으로","impact":"MEDIUM-HIGH","impactDescription":"파일 수준과 router API 안에서 route 파라미터가 스스로 설명되게 함","appliesWhen":"","tags":["params","dynamic-segments","naming"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"naming","prose":["필수 path param은 `{$param}`, 선택 path param은 `{-$param}` 문법을 사용하고,","param 이름은 도메인 의미가 드러나는 명사를 씁니다.","generic `id`, `x` 같은 이름은 파일 구조만 봐서는 의미를 알 수 없으므로 피합니다."],"examples":[{"kind":"incorrect","label":"generic param 이름을 사용","blocks":[{"lang":"txt","code":"users.{$id}.index.tsx\nposts.{-$x}.tsx"}]},{"kind":"correct","label":"도메인 의미가 드러나는 이름을 사용","blocks":[{"lang":"txt","code":"users.{$userId}.index.tsx\nposts.{$postId}.edit.index.tsx\nfilters.{-$tab}.tsx"}]}]},{"skill":"tanstack-route","id":"naming-create-route-local-helper-files-early","number":"2.5","title":"Use Owner-named Route Support Modules Instead of Generic Helper Files","titleKo":"route support 모듈은 generic 대신 owner 이름으로","impact":"MEDIUM-HIGH","impactDescription":"경계가 흐려지기 전에 route 파일에 정규화·매핑 로직이 쌓이는 것을 막음","appliesWhen":"","tags":["helpers","route-local","typescript"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"naming","prose":["라우트 전용 순수 support code가 entry file을 흐리기 시작하면 첫 추출 대상은 같은 계층 owner-named module입니다.","예를 들어 `settings.index.tsx`라면 `settings.ts`로 옮기고 named export를 직접 import합니다.","","exported support helper는 `convention-typescript` 규칙에 맞춰 `@helper` JSDoc을 붙이고,","silent fallback으로 결측을 숨기지 않습니다.","`helper.ts`, `helpers.ts`, `utils.ts`, `common.ts` 같은 generic 파일명은 만들지 않고,","화면 하나에서만 쓰는 custom hook으로 우회해 숨기지도 않습니다."],"examples":[{"kind":"incorrect","label":"generic helper 파일명으로 support code를 분산","blocks":[{"lang":"txt","code":"(settings)/\n  helpers.ts\n  settings.index.tsx"},{"lang":"ts","code":"// helpers.ts\nexport const normalizeSettingsSearch = (value: string | undefined) => {\n\treturn value?.trim().toLowerCase() ?? \"\";\n};"}]},{"kind":"correct","label":"owner-named sibling module에 named export로 유지","blocks":[{"lang":"ts","code":"// settings.ts\n/**\n * @helper settings 검색어 trim/lower 정규화\n */\nexport const normalizeSettingsSearch = (value: string | undefined) => {\n\tconst normalizedValue = value?.trim().toLowerCase();\n\n\tif (!normalizedValue) {\n\t\treturn undefined;\n\t}\n\n\treturn normalizedValue;\n};\n\n/**\n * @helper settings 기본 redirect destination 조립\n */\nexport const buildSettingsRedirect = (tab: string) => {\n\treturn {to: \"/app/settings/general\", search: {tab}};\n};"}]}]},{"skill":"tanstack-route","id":"naming-use-searchable-feature-route-file-names","number":"2.6","title":"Use Searchable Feature Route File Names","titleKo":"route 파일 이름은 검색 가능하게","impact":"HIGH","impactDescription":"그룹 폴더가 이미 있어도 파일 검색으로 route 진입점을 찾기 쉽게 유지함","appliesWhen":"","tags":["filenames","searchability","route-files"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"naming","prose":["이 프로젝트는 mixed route tree와 `routeToken: \"layout\"` 전제를 사용하므로,","그룹 폴더를 쓰더라도 엔트리 파일명은 `feature.index.tsx`, `feature.layout.tsx`처럼 feature 이름을 유지합니다.","그룹 폴더 아래 파일명을 모두 `index.tsx`, `layout.tsx`로 두면 검색성과 탐색성이 크게 떨어집니다."],"examples":[{"kind":"incorrect","label":"그룹 폴더 안에서 익명 파일명을 사용","blocks":[{"lang":"txt","code":"(settings)/\n  index.tsx\n  layout.tsx"}]},{"kind":"correct","label":"feature 이름이 드러나는 엔트리 파일명을 사용","blocks":[{"lang":"txt","code":"(settings)/\n  settings.index.tsx\n  settings.layout.tsx"}]}]},{"skill":"tanstack-route","id":"declaration-export-route-at-file-top","number":"3.1","title":"Export `Route` at the Top of the File","titleKo":"Route는 파일 맨 위에서 export","impact":"HIGH","impactDescription":"화면 구현 세부가 시작되기 전에 router 계약이 먼저 드러나게 함","appliesWhen":"","tags":["createfileroute","exports","route-definition"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"declaration","prose":["각 라우트 파일은 `export const Route = createFileRoute(\"...\")({...})` 형태를 기본으로 하고,","export 이름은 항상 `Route`로 고정합니다.","route definition은 파일 상단에 두고, 화면 컴포넌트나 owner-named support module import는 그 아래에 배치합니다."],"examples":[{"kind":"incorrect","label":"컴포넌트와 보조 코드 뒤에 route definition을 숨김","blocks":[{"lang":"tsx","code":"function UsersIndex() {\n\treturn \u003cUsersScreen />;\n}\n\nconst usersRoutePath = \"/app/(users)/users/\";\n\nexport const UsersRoute = createFileRoute(usersRoutePath)({\n\tcomponent: UsersIndex,\n});"}]},{"kind":"correct","label":"파일 상단에서 `Route` 계약을 먼저 선언","blocks":[{"lang":"tsx","code":"export const Route = createFileRoute(\"/app/(users)/users/\")({\n\tcomponent: UsersIndex,\n});\n\nfunction UsersIndex() {\n\treturn \u003cUsersScreen />;\n}"}]}]},{"skill":"tanstack-route","id":"declaration-match-route-paths-to-file-structure","number":"3.2","title":"Match Route Paths to File Structure","titleKo":"route 경로를 파일 구조와 일치시키기","impact":"HIGH","impactDescription":"route 문자열이 그것을 소유한 파일 트리에서 벗어나는 것을 막음","appliesWhen":"","tags":["createfileroute","paths","file-structure"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"declaration","prose":["`createFileRoute()` 문자열은 실제 파일 구조와 대응되게 작성합니다.","일반 폴더, pathless group, 동적 세그먼트,","trailing slash 규칙을 문자열에 그대로 반영해야 route tree와 파일 위치를 함께 추적할 수 있습니다."],"examples":[{"kind":"incorrect","label":"경로 문자열이 파일 구조와 어긋남","blocks":[{"lang":"tsx","code":"// file: \u003croute-root>/app/(settings)/settings.index.tsx\nexport const Route = createFileRoute(\"/settings\")({\n\tcomponent: SettingsIndex,\n});"}]},{"kind":"correct","label":"경로 문자열이 실제 파일 구조를 반영","blocks":[{"lang":"tsx","code":"createFileRoute(\"/app\")({...});\ncreateFileRoute(\"/app/\")({...});\ncreateFileRoute(\"/app/(settings)/settings/\")({...});"}]}]},{"skill":"tanstack-route","id":"declaration-read-params-and-search-from-local-route","number":"3.3","title":"Read Params and Search From the Local `Route`","titleKo":"params와 search는 로컬 Route에서 읽기","impact":"MEDIUM-HIGH","impactDescription":"param·search 접근을 계약을 소유한 route 파일에 맞춤","appliesWhen":"","tags":["route-hooks","params","search"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"declaration","prose":["param과 search 접근은 해당 파일의 `Route`에서 꺼내 쓰는 것을 기본으로 합니다.","훅 사용 패턴을 route definition 근처에서 일관되게 유지하면,","이 파일이 어떤 params/search 계약을 갖는지 한 곳에서 읽을 수 있습니다."],"examples":[{"kind":"incorrect","label":"전역 hook 호출로 계약 출처를 흐림","blocks":[{"lang":"tsx","code":"const params = useParams({from: \"/app/(users)/users/{$userId}/\"});\nconst search = useSearch({from: \"/app/(users)/users/\"});"}]},{"kind":"correct","label":"해당 파일의 `Route`에서 직접 읽음","blocks":[{"lang":"tsx","code":"const {useParams, useSearch} = Route;\n\nconst params = useParams();\nconst search = useSearch();"}]}]},{"skill":"tanstack-route","id":"declaration-redirect-empty-entry-routes-in-beforeload","number":"3.4","title":"Redirect Empty Entry Routes in `beforeLoad`","titleKo":"빈 진입 route는 beforeLoad에서 리다이렉트","impact":"HIGH","impactDescription":"화면이 마운트되고 부수효과가 시작되기 전에 진입 리다이렉트를 router 경계로 옮김","appliesWhen":"","tags":["redirect","beforeload","navigation"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"declaration","prose":["실화면이 없는 중간 route의 기본 진입은 `index` route의 `beforeLoad`에서 redirect로 처리합니다.","path param이나 search를 유지해야 하면 `beforeLoad`에서 명시적으로 다시 넘겨 화면 마운트 이후 강제 이동을 피합니다."],"examples":[{"kind":"incorrect","label":"컴포넌트 렌더링 후 `useEffect`로 강제 이동","blocks":[{"lang":"tsx","code":"function SettingsIndex() {\n\tconst navigate = useNavigate();\n\n\tuseEffect(() => {\n\t\tvoid navigate({to: \"/app/settings/general\"});\n\t}, [navigate]);\n\n\treturn null;\n}"}]},{"kind":"correct","label":"route 진입 단계에서 redirect 처리","blocks":[{"lang":"tsx","code":"export const Route = createFileRoute(\"/app/(settings)/settings/\")({\n\tbeforeLoad: ({search}) => {\n\t\tthrow redirect({to: \"/app/settings/general\", search, replace: true});\n\t},\n});"}]}]},{"skill":"tanstack-route","id":"declaration-run-auth-and-permission-guards-in-beforeload","number":"3.5","title":"Run Auth and Permission Guards in `beforeLoad`","titleKo":"인증·권한 가드는 beforeLoad에서","impact":"CRITICAL","impactDescription":"화면에서 뒤늦게 이동시키지 않고 접근 제어를 router 경계에 둠","appliesWhen":"","tags":["auth","guards","beforeload"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"declaration","prose":["인증과 권한 보장은 라우트 컴포넌트 본문이 아니라 `beforeLoad`에서 처리합니다.","공통 가드 로직은 route 전용 support module이나 안정된 shared module로 분리해 재사용하고,","화면 컴포넌트가 렌더링된 뒤 조건부 네비게이션을 하는 패턴은 피합니다."],"examples":[{"kind":"incorrect","label":"컴포넌트 렌더링 이후 조건부 네비게이션","blocks":[{"lang":"tsx","code":"function ProtectedPage() {\n\tconst token = useTokenStore();\n\tconst navigate = useNavigate();\n\n\tif (!token) {\n\t\tvoid navigate({to: \"/login\"});\n\t}\n\n\treturn \u003cOutlet />;\n}"}]},{"kind":"correct","label":"진입 전 가드로 접근을 차단","blocks":[{"lang":"tsx","code":"export const Route = createFileRoute(\"/app\")({\n\tbeforeLoad: async ({context}) => {\n\t\tawait ensureAuthenticated(context);\n\t},\n\tcomponent: AppLayout,\n});"}]}]},{"skill":"tanstack-route","id":"declaration-validate-search-before-using-route-search","number":"3.6","title":"Validate Search Before Using Route Search","titleKo":"search는 쓰기 전에 검증","impact":"CRITICAL","impactDescription":"화면 곳곳에서 다시 파싱하지 않고 query string 을 route 경계에서 한 번 정규화함","appliesWhen":"","tags":["validateSearch","zod","search-params"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"declaration","prose":["screen)**","","쿼리스트링을 읽는 화면은 `Route.useSearch()` 사용 전에 `validateSearch`를 선언합니다.","search schema는 `z.object(...)`로 작성하고, 숫자형 페이지네이션이나 선택값은 `z.coerce.number()`로 보정하며,","초기값이나 방어값이 필요하면 `.default()`와 `.catch()`를 함께 사용합니다."],"examples":[{"kind":"incorrect","label":"사용처마다 문자열 파싱을 반복","blocks":[{"lang":"tsx","code":"const search = useSearch({from: \"/app/users\"});\nconst page = Number(search.page ?? 1);\nconst size = Number(search.size ?? 20);"}]},{"kind":"correct","label":"route에서 먼저 search를 정규화","blocks":[{"lang":"tsx","code":"export const Route = createFileRoute(\"/app/(users)/users/\")({\n\tvalidateSearch: z.object({\n\t\tpage: z.coerce.number().int().min(1).default(1).catch(1),\n\t\tsize: z.coerce.number().int().min(1).max(100).default(20).catch(20),\n\t}),\n\tcomponent: UsersIndex,\n});"}]}]},{"skill":"tanstack-route","id":"responsibility-keep-index-files-focused-on-screen-flow","number":"4.1","title":"Keep `*.index.tsx` Files Focused on Screen Flow","titleKo":"*.index.tsx는 화면 흐름에 집중","impact":"HIGH","impactDescription":"화면 조립·hook·handler 가 보이는 읽을 수 있는 route 진입점을 지킴","appliesWhen":"","tags":["index-files","screen-flow","ownership"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"responsibility","prose":["`*.index.tsx`는 실제 화면 렌더링, API hook, 이벤트 핸들러, search 기반 상태 동기화, 화면 조립을 담당합니다.","entry file이 순수 helper, 대형 상수, route 외부 재사용 로직까지 떠안기 시작하면","화면 흐름이 흐려지므로 route-local support module과 `-local/`로 책임을 분리합니다.","작은 1회성 guard나 사용 지점 바로 옆이 더 읽기 쉬운 계산은 entry file에 남길 수 있습니다."],"examples":[{"kind":"incorrect","label":"entry file에 화면 흐름과 무관한 support code를 누적","blocks":[{"lang":"tsx","code":"const DEFAULT_COLUMNS = [\"name\", \"role\", \"status\"] as const;\n\nconst normalizeMembersSearch = (value: string | undefined) => {\n\treturn value?.trim().toLowerCase() ?? \"\";\n};\n\nexport const Route = createFileRoute(\"/app/(members)/members/\")({\n\tcomponent: MembersIndex,\n});"}]},{"kind":"correct","label":"entry file은 화면 흐름을 보여주고 support code는 owner-named module로 분리","blocks":[{"lang":"tsx","code":"import {normalizeMembersSearch} from \"./members\";\nimport {MembersToolbar} from \"./-local/members-toolbar\";\n\nexport const Route = createFileRoute(\"/app/(members)/members/\")({\n\tcomponent: MembersIndex,\n});\n\nfunction MembersIndex() {\n\tconst search = Route.useSearch();\n\tconst normalizedKeyword = normalizeMembersSearch(search.keyword);\n\n\treturn \u003cMembersToolbar keyword={normalizedKeyword} />;\n}"}]}]},{"skill":"tanstack-route","id":"responsibility-limit-layout-files-to-shell-concerns","number":"4.2","title":"Limit `*.layout.tsx` Files to Shell Concerns","titleKo":"*.layout.tsx는 셸 관심사까지만","impact":"HIGH","impactDescription":"부모 route 셸이 말단 화면의 데이터·폼 로직을 흡수하는 것을 막음","appliesWhen":"","tags":["layout-files","shell","outlet"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"responsibility","prose":["`*.layout.tsx`는 부모 경로 등록, 접근 제어, 공통 래퍼, 메뉴 상태 동기화, `\u003cOutlet />`까지만 담당합니다.","이 프로젝트에서는 `*.layout.tsx`를 4-file set의 기본 tunnel route로 항상 두지만,","파일이 있다는 이유로 leaf 화면 전용 API 호출이나 상세 폼 로직을 흡수시키지는 않습니다.","하위 leaf 화면만 쓰는 로직은 layout에 넣지 않고 해당 `index`나 `-local`로 내립니다."],"examples":[{"kind":"incorrect","label":"layout 파일이 leaf 화면 전용 로직까지 가짐","blocks":[{"lang":"tsx","code":"function SettingsLayout() {\n\tconst query = useSettingsDetailQuery();\n\tconst form = useSettingsForm(query.data);\n\n\treturn (\n\t\t\u003cSettingsShell form={form}>\n\t\t\t\u003cOutlet />\n\t\t\u003c/SettingsShell>\n\t);\n}"}]},{"kind":"correct","label":"layout route는 최소 tunnel이어도 `Route` export와 outlet 책임만 유지","blocks":[{"lang":"tsx","code":"export const Route = createFileRoute(\"/app/(settings)/settings\")({\n\tcomponent: SettingsLayout,\n});\n\nfunction SettingsLayout() {\n\treturn \u003cOutlet />;\n}"}]}]},{"skill":"tanstack-route","id":"responsibility-place-route-only-modules-in-local","number":"4.3","title":"Place Route-only Modules in `-local/`","titleKo":"route 전용 모듈은 -local/ 에","impact":"HIGH","impactDescription":"계약이 안정되기 전까지 route 범위 UI 와 비공개 모듈을 route 가까이 둠","appliesWhen":"","tags":["route-local","local-folder","ownership"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"responsibility","prose":["해당 라우트에서만 쓰는 모달, 폼, 보조 컴포넌트, route-private module은 라우트 하위 `-local/`에 둡니다.","다른 라우트와 계약이 아직 안정되지 않았다면 shared UI나 공용 helper로 올리지 말고, 먼저 route-local 소유를 유지합니다.","다만 route entry가 직접 가져오는 순수 support function은 먼저 같은 계층 owner-named module(`settings.ts`,","`members.ts`)에 두고, `-local/`은 route-private UI와 module 묶음이 실제로 생길 때 사용합니다."],"examples":[{"kind":"incorrect","label":"route 전용 모듈을 성급하게 공용 레이어로 올림","blocks":[{"lang":"txt","code":"\u003ccomponent-root>/ui/modal/ui-setting-form-modal.tsx\n\u003ccomponent-root>/ui/modal/ui-setting-form-modal.css"}]},{"kind":"correct","label":"해당 route 아래 `-local/`에 둠","blocks":[{"lang":"txt","code":"(settings)/\n  settings.index.tsx\n  -local/\n    modal-setting-form.tsx\n    modal-setting-form.css"}]}]},{"skill":"tanstack-route","id":"styling-keep-route-css-at-route-scope","number":"5.1","title":"Keep Route CSS at Route Scope","titleKo":"route CSS는 route 스코프에 두기","impact":"MEDIUM-HIGH","impactDescription":"route 수준 스타일과 지역 컴포넌트 스타일이 거대한 stylesheet 하나로 뭉치는 것을 막음","appliesWhen":"","tags":["css","route-scope","styling"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"styling","prose":["stylesheet)**","","route 공용 스타일은 해당 route 폴더의 `*.css`에 두고, `-local` 컴포넌트 스타일은 `-local/*.css`에 둡니다.","같은 route의 `layout`과 `index`가 같은 시각 컨텍스트를 공유하더라도,","route 공용 CSS와 local 전용 CSS를 한 파일에 뭉개지 않습니다."],"examples":[{"kind":"incorrect","label":"route 공용 스타일과 local 전용 스타일을 한 파일에 누적","blocks":[{"lang":"txt","code":"(settings)/\n  settings.index.tsx\n  -local/\n    modal-setting-form.tsx\n\nsettings.css에 modal 전용 스타일까지 모두 선언"}]},{"kind":"correct","label":"route 범위와 local 범위 스타일을 분리","blocks":[{"lang":"txt","code":"(settings)/\n  settings.css\n  settings.index.tsx\n  -local/\n    modal-setting-form.tsx\n    modal-setting-form.css"}]}]},{"skill":"tanstack-route","id":"styling-never-edit-generated-route-tree-files","number":"5.2","title":"Never Edit Generated Route Tree Files","titleKo":"생성된 route tree 파일은 절대 손대지 않기","impact":"MEDIUM-HIGH","impactDescription":"생성된 router 출력을 route 소스에서 파생된 빌드 산출물로 지킴","appliesWhen":"","tags":["generated-files","route-tree","safety"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"styling","prose":["라우트 추가나 변경 결과로 생성되는 `\u003cgenerated-route-tree-path>`는 수동 수정하지 않습니다.","라우트 소스만 수정하고, 생성 파일은 결과물로만 다루어야 source of truth가 명확하게 유지됩니다."],"examples":[{"kind":"incorrect","label":"생성 파일을 직접 수정해 동작을 맞춤","blocks":[{"lang":"txt","code":"// Bad\n\u003cgenerated-route-tree-path>에 수동으로 route node를 추가\n\u003cgenerated-route-tree-path>에서 import 경로를 직접 수정"}]},{"kind":"correct","label":"라우트 소스를 고치고 생성물은 다시 생성","blocks":[{"lang":"txt","code":"// Good\nroute source file을 수정한다\nrouter generator를 다시 실행한다\n\u003cgenerated-route-tree-path>는 결과물로만 확인한다"}]}]},{"skill":"tanstack-route","id":"workflow-add-new-routes-in-layout-first-order","number":"6.1","title":"Add New Routes in Layout-first Order","titleKo":"새 route는 레이아웃 먼저 순서로 추가","impact":"MEDIUM","impactDescription":"route 파일이 번지기 전에 셸·그룹·search 경계를 먼저 정해 정리 작업을 줄임","appliesWhen":"","tags":["workflow","route-creation","checklist"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"workflow","prose":["sprawl)**","","신규 라우트를 추가할 때는 화면 파일부터 급하게 만들지 말고, 레이아웃 셸과 그룹 구조를 먼저 고정하는 순서를 따릅니다.","이 프로젝트에서는 `feature.css`, `feature.ts`, `feature.layout.tsx`,","`feature.index.tsx` 4-file set을 route 기본 단위로 보고, layout file은 최소 tunnel이어도 먼저 자리를 확보합니다.","이렇게 해야 route tree, support code 위치, search 검증 경계가 뒤늦게 흔들리지 않습니다."],"examples":[{"kind":"incorrect","label":"leaf 화면부터 만들고 나중에 구조를 끼워 맞춤","blocks":[{"lang":"txt","code":"1. 바로 feature.index.tsx부터 만든다\n2. 화면이 커진 뒤에 layout, support code, -local 위치를 고민한다\n3. search parsing과 redirect를 화면 본문에서 임시로 처리한다"}]},{"kind":"correct","label":"layout-first 순서로 route를 추가","blocks":[{"lang":"txt","code":"1. 모든 화면이 같은 레이아웃 셸인지 먼저 판단한다\n2. 셸이 다르면 최상위 그룹을 분리하고, 같으면 기존 부모 layout 아래에 둔다\n3. URL에 반영되는 상위 계층은 일반 폴더로 만든다\n4. 하위 라우트가 생기면 (\u003cfeature>) 그룹 폴더를 만든다\n5. 기본적으로 feature.css, feature.ts, feature.layout.tsx, feature.index.tsx 4-file set을 준비한다\n6. feature.layout.tsx는 shell UI가 아직 없더라도 route tunnel 경계로 두고, support code는 feature.ts에 named export로 모은다\n7. 동적 세그먼트가 필요하면 {$param}, {-$param} 규칙을 사용한다\n8. search를 읽는 화면이면 validateSearch를 먼저 선언한다\n9. route 전용 보조 모듈이 있으면 같은 계층 -local/에 둔다\n10. 생성된 \u003cgenerated-route-tree-path>는 수동 수정하지 않는다"}]}]},{"skill":"tanstack-route","id":"workflow-review-route-structure-before-finishing","number":"6.2","title":"Review Route Structure Before Finishing","titleKo":"마무리 전에 route 구조 점검","impact":"MEDIUM","impactDescription":"route 변경을 완료로 선언하기 전에 그룹·가드·소유 어긋남을 잡음","appliesWhen":"","tags":["review","workflow","checklist"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"workflow","prose":["라우트 작업을 끝냈다고 보기 전에 구조 체크리스트를 다시 확인합니다.","화면이 보인다는 이유만으로 마무리하지 말고, 그룹 구조, support code 배치, guard 위치,","generated artifact 처리까지 함께 점검해야 합니다."],"examples":[{"kind":"incorrect","label":"렌더링만 확인하고 구조 검토를 생략","blocks":[{"lang":"txt","code":"- 페이지가 뜨는지만 확인한다\n- redirect와 guard 위치는 나중에 정리한다\n- support code가 route 파일 안에 과하게 남아 있어도 그대로 둔다\n- generated route tree를 직접 고쳐서 통과시킨다"}]},{"kind":"correct","label":"마무리 전에 route 체크리스트를 순회","blocks":[{"lang":"txt","code":"- 최상위 라우트 분리가 기능명이 아니라 레이아웃 셸 기준인가\n- 폴더 전용 구조와 플랫 전용 구조 중 하나로 치우치지 않았는가\n- URL에 반영되는 상위는 일반 폴더로 두었는가\n- 하위 route 묶음은 () 그룹 폴더로 분리했는가\n- 하위 route라면 feature.css, feature.ts, feature.layout.tsx, feature.index.tsx 4-file set을 갖췄는가\n- 그룹 폴더 안의 엔트리 파일명이 feature.index.tsx처럼 검색 가능한가\n- 화면 전용 순수 support code가 route 파일 안에 누적되지 않았고, 추출했다면 generic helper 파일 대신 owner-named sibling `*.ts`에 named export로 두었는가\n- 인증/권한 가드를 컴포넌트 본문이 아니라 beforeLoad에 두었는가\n- 쿼리스트링을 읽는 화면에 validateSearch가 선언되어 있는가\n- route 전용 보조 모듈이 -local/에 정리되어 있는가\n- \u003cgenerated-route-tree-path>를 수동 수정하지 않았는가"}]}]},{"skill":"typescript","id":"naming-centralize-shared-config-namespaces","number":"1.1","title":"Centralize Shared Config Under `shared/config.ts`","titleKo":"공용 설정은 shared/config.ts로 모으기","impact":"HIGH","impactDescription":"공용 설정 값이 leaf 파일로 흩어져 공개 출처 하나를 잃는 것을 막음","appliesWhen":"여러 leaf 모듈이 함께 쓰는 URL, feature flag, 페이지 크기나 상수를 추가·이동·중복 정의하거나 shared config 경계를 바꾼다.","tags":["config","namespace","ownership"],"requiresSelected":[],"reviewWith":["naming-preserve-config-origin-with-chained-access","naming-use-direct-imports-and-public-entry-points"],"sectionPrefix":"naming","prose":["여러 파일에서 공유되는 설정과 상수는 기본적으로 `shared/config.ts` 한 파일을 공개 진입점으로 삼아 `config` namespace","아래에 모읍니다.","leaf 파일마다 공용 URL, feature flag, 페이지 크기, 상수 문자열을 흩뿌리지 말고,","`config.*` 체이닝으로 읽을 수 있게 정리합니다.","수가 많지 않을 때는 `config/` 폴더로 미리 쪼개지 말고 단일 `config.ts`를 유지하고,","여러 독립 섹션으로 커졌을 때만 분리를 검토합니다."],"examples":[{"kind":"incorrect","label":"공용 설정을 leaf 파일마다 흩뿌림","blocks":[{"lang":"ts","code":"const defaultPageSize = 20;\nconst billing_feature_keys = [\"invoices\", \"refunds\"];"}]},{"kind":"correct","label":"공용 설정은 `shared/config.ts` namespace에서 읽음","blocks":[{"lang":"ts","code":"import {config} from \"@/shared/config\";\n\nconfig.api.public_base_url;\nconfig.api.billing_base_url;\nconfig.features.enable_refunds;\nconfig.pagination.default_page_size;"}]}]},{"skill":"typescript","id":"naming-preserve-config-origin-with-chained-access","number":"1.2","title":"Preserve Shared Namespace Origin With Chained Access","titleKo":"config·util은 체인 접근으로 출처 보존","impact":"HIGH","impactDescription":"넓은 스코프 별칭으로 출처를 숨기지 않고 값이 어디서 오는지 읽는 사람이 알게 함","appliesWhen":"`config` 또는 `util` 값을 leaf 모듈에서 접근하며 넓은 스코프 구조분해, 별칭 또는 feature-local namespace를 추가·변경한다.","tags":["config","chaining","traceability"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"naming","prose":["공용 설정과 공용 순수 함수는 leaf 모듈 직접 import 뒤에 `config.*`, `util.*` 체이닝 접근을 기본으로 합니다.","넓은 스코프에서 구조분해하거나 별칭 상수로 끊어 원본 오리진을 흐리지 말고,","필요한 구조분해는 함수 내부의 좁은 스코프에서만 제한적으로 사용합니다.","특히 `shared/config.ts`와 `shared/util.ts`는 발견성을 위해 namespace를 유지하고,","feature-local `helper.ts`나 `utils.ts` 대신 공용 경계에서만 `config`/`util` 이름을 사용합니다."],"examples":[{"kind":"incorrect","label":"넓은 스코프에서 원본 오리진을 감춤","blocks":[{"lang":"ts","code":"const {api, features} = config;\nconst {date} is-real","number":"3.2","title":"Extract Support Functions Only When the Boundary Is Real","titleKo":"support 함수는 경계가 실재할 때만 추출","impact":"HIGH","impactDescription":"재사용 계약이나 테스트 경계가 실제로 없을 때 헬퍼 추출이 지역 흐름을 조각내는 것을 막음","appliesWhen":"support function을 추출·이동·export·공유하거나 generic helper 파일, 단일 owner 전용 mapper 또는 작은 sub-step 경계를 바꾼다.","tags":["helpers","extraction","boundaries"],"requiresSelected":[],"reviewWith":["docs-use-helper-for-reusable-pure-helper-functions","docs-require-header-jsdoc-on-key-declarations"],"sectionPrefix":"functions","prose":["actually exists)**","","support function은 \"이름\"이 아니라 \"호출 경계\"가 있을 때만 분리합니다.","","- 필수: 명확한 input/output, 런타임 문맥 없는 독립 검증 가능성","- 추출 신호: 여러 owner의 직접 호출, 여러 export에서 반복되는 도메인 규칙","- 유지: 한 번만 쓰는 짧은 계산, optional 보정, label fallback, 단일 namespace method 전용 mapper","- 배치: generic `helper.ts`/`utils.ts` 금지, owner-named support module 우선","- 승격: 여러 owner가 실제 공유하는 범용 pure function만 `shared/util.ts`의 `util.*`"],"examples":[{"kind":"incorrect","label":"단회성 계산을 generic util 파일로 분리","blocks":[{"lang":"ts","code":"// utils.ts\nexport const util = {\n\tgetNextIteration(iteration: number) {\n\t\treturn iteration + 1;\n\t},\n};"}]},{"kind":"incorrect","label":"support module 안에서도 export helper를 단계별로 누적","blocks":[{"lang":"ts","code":"export const normalizeProfileValues = (formValues: ProfileFormValues) => {\n\t// ...\n};\n\nexport const buildAvatarRequests = (files: UploadFile[]) => {\n\t// ...\n};\n\nexport const buildProfileUpdatePayload = (\n\tformValues: ProfileFormValues,\n\tfiles: UploadFile[],\n) => {\n\treturn {\n\t\t...normalizeProfileValues(formValues),\n\t\tavatarRequests: buildAvatarRequests(files),\n\t};\n};"}]},{"kind":"incorrect","label":"한 namespace method만 위해 mapper/helper를 쪼갬","blocks":[{"lang":"ts","code":"const readLabelText = (label: Label) => label.name.trim() || label.code;\n\nconst mapRecordToEntryView = (record: RecordItem): EntryView => {\n\tconst summary = record.description ?? record.memo;\n\n\treturn {\n\t\tid: record.id,\n\t\turl: record.url,\n\t\tdata: {\n\t\t\ttype: \"record\",\n\t\t\ttitle: record.title,\n\t\t\tsummary,\n\t\t\tlabels: record.labels.map(readLabelText),\n\t\t},\n\t};\n};\n\nexport const api = {\n\trecord: {\n\t\tmapEntry: (record: RecordItem) => mapRecordToEntryView(record),\n\t},\n};"}]},{"kind":"correct","label":"작은 계산은 local flow에 둠","blocks":[{"lang":"ts","code":"const nextIteration = iteration + 1;"}]},{"kind":"correct","label":"feature-local support module은 domain-sized export 안에서 단계별로 정리","blocks":[{"lang":"ts","code":"// profile-support.ts\n/**\n * @helper profile form 값을 저장 payload로 조립\n */\nexport const buildProfileUpdatePayload = (formValues: ProfileFormValues) => {\n\tconst normalizedDisplayName = formValues.displayName.trim();\n\n\treturn {\n\t\tdisplayName: normalizedDisplayName,\n\t};\n};"}]},{"kind":"correct","label":"단일 owner namespace의 단계는 메서드 본문에 둠","blocks":[{"lang":"ts","code":"export const api = {\n\trecord: {\n\t\tmapEntry: (record: RecordItem): EntryView => {\n\t\t\tconst summary = record.description ?? record.memo;\n\n\t\t\treturn {\n\t\t\t\tid: record.id,\n\t\t\t\turl: record.url,\n\t\t\t\tdata: {\n\t\t\t\t\ttype: \"record\",\n\t\t\t\t\ttitle: record.title,\n\t\t\t\t\tsummary,\n\t\t\t\t\tlabels: record.labels.map((label) => label.name.trim() || label.code),\n\t\t\t\t},\n\t\t\t};\n\t\t},\n\t},\n};"},{"lang":"ts","code":"// profile-form.ts\nimport { buildProfileUpdatePayload } from \"./profile-support\";"},{"lang":"ts","code":"// shared/util.ts\nexport const util = {\n\tdate: {\n\t\t/**\n\t\t * @helper date 입력값을 ISO 문자열로 정규화\n\t\t */\n\t\tnormalize(value: Date | string): string {\n\t\t\treturn new Date(value).toISOString();\n\t\t},\n\t},\n};"}]}]},{"skill":"typescript","id":"functions-prefer-immutable-array-sorting","number":"3.3","title":"Prefer Immutable Array Sorting","titleKo":"배열 정렬은 원본을 건드리지 않기","impact":"MEDIUM","impactDescription":"props·state·공유 입력에서 온 배열을 정렬할 때 변형 버그를 피함","appliesWhen":"props, state, 매개변수 또는 공유 입력에서 온 배열을 정렬하거나 기존 `.sort()` 호출을 추가·변경한다.","tags":["functions","arrays","sorting","immutability"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"functions","prose":["정렬이 필요한데 원본 배열을 계속 써야 한다면 `.sort()`로 제자리 mutation을 하지 않습니다.","프로젝트 런타임이 ES2023 이상이거나 `toSorted()` 지원이 보장되면 `.toSorted()`를 우선하고,","그렇지 않으면 복사 후 정렬합니다.","companion skill이므로 지원 여부가 불분명한 환경에 무조건 `toSorted()`를 강제하지는 않습니다."],"examples":[{"kind":"incorrect","label":"원본 배열을 직접 mutation","blocks":[{"lang":"ts","code":"const sortedUsers = users.sort((left, right) => left.name.localeCompare(right.name));"},{"lang":"ts","code":"const sortedUsers = users.toSorted((left, right) => left.name.localeCompare(right.name));"},{"lang":"ts","code":"const sortedUsers = [...users].sort((left, right) => left.name.localeCompare(right.name));"}]}]},{"skill":"typescript","id":"functions-replace-enum-with-as-const-objects","number":"3.4","title":"Replace `enum` With `as const` Objects","titleKo":"enum 대신 as const 객체","impact":"MEDIUM-HIGH","impactDescription":"enum 특유의 동작을 들이지 않고 런타임 값을 명시적으로, 타입 추출을 가볍게 유지함","appliesWhen":"`enum` 또는 타입과 런타임에서 함께 쓰는 enum-like 값 집합을 추가·변경한다.","tags":["enum","as-const","values"],"requiresSelected":["naming-use-consistent-file-and-symbol-naming","types-document-custom-types-and-shapes"],"reviewWith":[],"sectionPrefix":"functions","prose":["behavior)**","","`enum` 대신 객체 리터럴과 `as const`를 사용합니다.","이렇게 하면 런타임 값과 타입 추론을 함께 유지하면서도 enum 고유 문법과 번들 영향을 피할 수 있습니다."],"examples":[{"kind":"incorrect","label":"`enum`을 직접 사용","blocks":[{"lang":"ts","code":"enum AuditStatus {\n\tpending = \"pending\",\n\tpassed = \"passed\",\n\tfailed = \"failed\",\n}"}]},{"kind":"correct","label":"객체 리터럴과 타입 추출을 조합","blocks":[{"lang":"ts","code":"const audit_status = {\n\tpending: \"pending\",\n\tpassed: \"passed\",\n\tfailed: \"failed\",\n} as const;\n\n/**\n * @summary 감사 상태 값 집합\n */\ntype AuditStatus = (typeof audit_status)[keyof typeof audit_status];"}]}]},{"skill":"typescript","id":"functions-use-named-object-params-for-complex-signatures","number":"3.5","title":"Use Named Object Params for Complex Signatures","titleKo":"복잡한 시그니처는 named 객체 매개변수로","impact":"HIGH","impactDescription":"긴 함수 시그니처를 읽을 수 있게 유지하고 위치 혼동 없이 묶인 입력을 확장하게 함","appliesWhen":"매개변수 3개 이상 또는 같은 계열 인자를 받는 일반 함수를 추가·변경하거나 객체 매개변수의 구조분해 위치를 바꾼다. React 함수 컴포넌트의 props 수신·구조분해만 바꾸면 제외한다.","tags":["functions","params","signatures"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"functions","prose":["confusion)**","","매개변수가 3개 이상이거나 같은 계열 값이 묶여 전달되면 단일 객체 매개변수로 묶고,","함수 시그니처에서 바로 구조분해하지 않습니다.","객체 매개변수 타입은 파일 최상단의 named contract를 사용하고, 함수 본문 첫 줄에서 구조분해해 사용합니다.","구조분해 줄이 길어 formatter 예외가 꼭 필요할 때도 함수 본문 안에서 처리합니다.","","React 함수 컴포넌트의 props 전체 수신과 본문 구조분해만 바뀌는 경우는 `react/composition-destructure-props-inside`가","담당하므로 이 규칙을 중복 선택하지 않습니다.","객체 인자와 field type·optionality·의미가 같은 기존 named contract가 있으면 그대로 재사용하고,","이 규칙을 지키기 위해 별도 `*Params`나 `*Args`를 새로 만들지 않습니다."],"examples":[{"kind":"incorrect","label":"시그니처에서 바로 구조분해","blocks":[{"lang":"ts","code":"const buildRequestUrl = ({baseUrl, resourcePath, searchParams}: BuildRequestUrlArgs): URL => {\n\tconst requestUrl = new URL(resourcePath, baseUrl);\n\n\tfor (const [key, value] of Object.entries(searchParams)) {\n\t\trequestUrl.searchParams.set(key, value);\n\t}\n\n\treturn requestUrl;\n};"}]},{"kind":"correct","label":"객체 전체를 받고 본문에서 구조분해","blocks":[{"lang":"ts","code":"/**\n * @summary grouped args로 API request URL 생성\n */\nconst buildRequestUrl = (args: BuildRequestUrlArgs): URL => {\n\tconst {baseUrl, resourcePath, searchParams} = args;\n\tconst requestUrl = new URL(resourcePath, baseUrl);\n\n\tfor (const [key, value] of Object.entries(searchParams)) {\n\t\trequestUrl.searchParams.set(key, value);\n\t}\n\n\treturn requestUrl;\n};"}]}]},{"skill":"typescript","id":"functions-use-set-and-map-for-repeated-lookups","number":"3.6","title":"Use Set and Map for Repeated Lookups","titleKo":"반복 조회에는 Set과 Map","impact":"MEDIUM","impactDescription":"조회 횟수가 늘어나면 반복되는 포함 검사와 키 접근을 명시적으로 드 에서 조용히 숨김","blocks":[{"lang":"ts","code":"const supportEmail = settings.supportEmail ?? \"help@example.com\";"}]},{"kind":"correct","label":"기본값이 명확한 예외만 이유와 함께 허용","blocks":[{"lang":"ts","code":"/**\n * @helper 제품 명세에 따라 페이지 크기 기본값 적용\n */\nconst resolvePageSize = (query: SearchQuery): string => {\n\tconst normalizedPageSize = query.pageSize?.trim();\n\n\tif (!normalizedPageSize) {\n\t\t// 기본 페이지 크기는 제품 명세상 20으로 고정한다.\n\t\treturn \"20\";\n\t}\n\n\treturn normalizedPageSize;\n};"}]}]},{"skill":"typescript","id":"docs-keep-inline-comments-for-constraints-and-caveats","number":"5.1","title":"Keep Inline Comments for Constraints and Caveats Only","titleKo":"인라인 주석은 제약과 예외에만","impact":"MEDIUM","impactDescription":"자명한 코드를 설명하는 주석은 막고 실제 오해를 방지하는 메모는 남김","appliesWhen":"함수 본문의 `//` 주석을 추가·수정·유지하거나 도메인 규칙, 예외 방어, 외부 제약 또는 부수효과 순서를 주석으로 설명한다.","tags":["comments","inline","caveats"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"docs","prose":["misunderstandings)**","","함수 본문 내부에서는 JSDoc 블록 주석을 사용하지 않고, `//` 주석은 도메인 규칙, 예외 방어 의도, 외부 라이브러리 제약,","부수효과 순서처럼 없으면 오해될 수 있는 경우에만 씁니다.","변수명 그대로 반복하는 설명은 남기지 않습니다."],"examples":[{"kind":"incorrect","label":"자명한 동작을 그대로 설명","blocks":[{"lang":"ts","code":"// count를 1 증가시킨다.\nconst nextCount = count + 1;"}]},{"kind":"correct","label":"제약이나 우회 이유를 설명","blocks":[{"lang":"ts","code":"// SDK가 빈 문자열을 허용하지 않아 trim 이후 값이 없으면 호출하지 않는다.\nif (!normalizedToken) {\n\treturn;\n}"}]}]},{"skill":"typescript","id":"docs-require-header-jsdoc-on-key-declarations","number":"5.2","title":"Require Header JSDoc on Key Declarations","titleKo":"핵심 선언에는 헤더 JSDoc 필수","impact":"MEDIUM-HIGH","impactDescription":"구현 본문을 뜯어보기 전에 중요한 경계를 검색하고 설명할 수 있게 함","appliesWhen":"named query·mutation, 원격 함수, 비자명한 handler/effect, reusable/exported helper·custom hook, custom type·interface, store, formatter 또는 예외 memo 선언을 추가·변경한다.","tags":["jsdoc","declarations","boundaries"],"requiresSelected":["docs-standardize-annotation-tags-by-declaration-role","docs-write-concise-korean-comments-about-purpose-and-constraints"],"reviewWith":[],"sectionPrefix":"docs","prose":["body)**","","named query·mutation binding과 원격 함수에는 `@api` 헤더 JSDoc을 작성하고, 비자명한 handler/effect,","reusable/exported helper·custom hook, 커스텀 `type`/`interface`, store,","formatter와 예외 memo 선언에도 헤더 JSDoc을 작성합니다.","중요한 경계가 파일 검색에서 바로 보이도록 하는 것이 목적입니다.","annotation 종류는 선언 역할에 따라 `@api`, `@event`, `@watch`, `@helper`, `@summary` 중 하나를 고릅니다.","header tag가 있어도 body가 비어 있거나 영문 label뿐이면 header 요구를 충족하지 않습니다.","`requiresSelected`의 `docs-write-concise-korean-comments-about-purpose-and-constraints`는 선택 bookkeeping이 아니라 실제","한국어 content gate입니다."],"examples":[{"kind":"incorrect","label":"주요 선언에 헤더 설명이 없음","blocks":[{"lang":"ts","code":"export const normalizeUserIds = (userIds: string[]): string[] => {\n\treturn Array.from(new Set(userIds)).sort();\n};"}]},{"kind":"correct","label":"핵심 선언의 헤더 JSDoc과 역할 태그를 명시","blocks":[{"lang":"ts","code":"/**\n * @helper 중복 제거 후 사용자 ID 정렬\n */\nexport const normalizeUserIds = (userIds: string[]): string[] => {\n\treturn Array.from(new Set(userIds)).sort();\n};"}]}]},{"skill":"typescript","id":"docs-standardize-annotation-tags-by-declaration-role","number":"5.3","title":"Standardize Annotation Tags by Declaration Role","titleKo":"JSDoc 태그는 선언 역할에 맞춰 통일","impact":"MEDIUM-HIGH","impactDescription":"고정된 소수의 annotation 집합으로 TypeScript와 TSX가 섞인 파일을 훑을 수 있게 유지함","appliesWhen":"TypeScript/TSX 선언의 JSDoc 태그를 추가·변경하거나 선언 역할에 맞는 annotation을 검토한다.","tags":["jsdoc","annotations","roles"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"docs","prose":["annotation 태그는 아래 여덟 개만 사용합니다.","","| 태그 | 대상 |","| --- | --- |","| `@api` | 원격 데이터, 파일, 외부 실행 경계 |","| `@event` | 이벤트 핸들러, 사용자 액션 처리 |","| `@watch` | 반응형 동기화 블록, subscription |","| `@helper` | 재사용 가능한 pure support function |","| `@summary` | type, interface, store, custom hook, schema root |","| `@field` | 계약 내부 필드 |","| `@part` | compound component public part |","| `@description` | `@part`와 함께 쓰는 part 설명 |","","`@description`은 `@part`와 함께만 사용합니다.","`@schema`, `@shape`, `@contract`, `@data`, `@type`, `@property`는 쓰지 않습니다."],"examples":[{"kind":"incorrect","label":"역할이 드러나지 않는 예전 태그나 part 전용 태그를 잘못 사용","blocks":[{"lang":"ts","code":"/**\n * @description 프로젝트 설정 파일 로드\n */\nexport const loadProjectConfig = async (path: string): Promise\u003cstring> => {\n\treturn await Promise.resolve(path);\n};\n\n/**\n * @summary 선택된 entry 변경 처리\n */\nconst handleSelectEntry = (entryId: string) => {\n\treturn entryId;\n};\n\n/**\n * @schema 게시 결과 스키마\n */\nconst publishResultSchema = z.object({\n\tdocumentId: z.string(),\n});"}]},{"kind":"correct","label":"선언 역할에 따라 고정 태그를 사용","blocks":[{"lang":"ts","code":"/**\n * @api 프로젝트 설정 파일 로드\n */\nexport const loadProjectConfig = async (path: string): Promise\u003cstring> => {\n\treturn await Promise.resolve(path);\n};\n\n/**\n * @event 선택된 entry 변경 처리\n */\nconst handleSelectEntry = (entryId: string) => {\n\treturn entryId;\n};\n\n/**\n * @summary 게시 결과 스키마\n */\nconst publishResultSchema = z.object({\n\t/**\n\t * @field 게시 대상 문서 ID\n\t */\n\tdocumentId: z.string(),\n});\n\n/**\n * @part dialog root\n * @description dialog 열림 상태와 compound part 공유 context를 소유하는 루트 컴포넌트\n */\ninterface DialogRootProps {\n\t/**\n\t * @field dialog 트리를 감싸는 자식 요소\n\t */\n\tchildren: ReactNode;\n}"}]}]},{"skill":"typescript","id":"docs-use-helper-for-reusable-pure-helper-functions","number":"5.4","title":"Use `@helper` on Reusable Support Functions","titleKo":"재사용 support 함수에는 @helper","impact":"MEDIUM-HIGH","impactDescription":"재사용 가능한 순수 support 로직을 지역 구현 세부나 통합 경계와 구분함","appliesWhen":"여러 caller가 쓰는 pure support function, owner-named exported helper 또는 `shared/util.ts` 함수를 추가·변경하거나 `@helper`를 붙이려 한다.","tags":["helper","pure-functions","reuse"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"docs","prose":["boundaries)**","","`@helper`는 재사용 가능한 pure support function에만 붙입니다.","","사용 대상:","","- 여러 caller가 직접 호출하는 문자열 조립, 정규화, 포맷, 계약 변환 함수","- owner-named support module의 domain-sized exported pure function","- 여러 owner가 공유하는 `shared/util.ts`의 `util.*` 함수","","사용하지 않을 대상:","","- 외부 I/O, 원격 데이터, 파일 접근 같은 `@api` 경계","- 한 함수나 한 support module 안에서만 쓰는 작은 sub-step","- 반복이 보이지만 아직 caller surface가 넓지 않은 local 계산"],"examples":[{"kind":"incorrect","label":"외부 연동 함수나 단회성 계산을 helper로 혼동","blocks":[{"lang":"ts","code":"/**\n * @helper 사용자 설정 파일 로드\n */\nconst loadUserSettings = async (): Promise\u003cstring> => {\n\treturn await Promise.resolve(\"settings\");\n};"}]},{"kind":"incorrect","label":"support module 내부 sub-step을 전부 `@helper`로 export","blocks":[{"lang":"ts","code":"/**\n * @helper 프로필 입력 trim\n */\nexport const normalizeProfileValues = (formValues: ProfileFormValues) => {\n\treturn formValues;\n};\n\n/**\n * @helper 프로필 저장 payload 조립\n */\nexport const buildProfilePayload = (formValues: ProfileFormValues) => {\n\treturn normalizeProfileValues(formValues);\n};"}]},{"kind":"correct","label":"여러 caller가 공유하는 순수 정규화 경계에 `@helper`를 사용","blocks":[{"lang":"ts","code":"/**\n * @helper 목록 화면과 상세 화면이 함께 쓰는 사용자 ID 정규화\n */\nexport const normalizeUserIds = (userIds: string[]): string[] => {\n\treturn Array.from(new Set(userIds)).sort();\n};"}]}]},{"skill":"typescript","id":"docs-write-concise-korean-comments-about-purpose-and-constraints","number":"5.5","title":"Write Concise Korean Comments About Purpose and Constraints","titleKo":"주석은 목적과 제약을 한국어로 간결하게","impact":"MEDIUM","impactDescription":"코드 동작을 서술하지 않고 의도와 제약에 주석을 집중시킴","appliesWhen":"TypeScript/TSX의 JSDoc이나 inline comment 문구를 추가·수정·번역하거나 리뷰한다.","tags":["comments","korean","purpose"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"docs","prose":["주석은 한글로 작성하고, 목적, 제약, 부작용 중심으로 간결하게 적습니다.","`@api`, `@event`, `@watch`, `@helper`, `@summary`, `@field` 문장은 명사형 종결이나 개조식 표현을 기본으로 하며,","코드 동작 설명보다 도입 이유와 제약 설명을 우선합니다.","","기술 용어와 identifier는 영문으로 섞을 수 있지만","annotation 본문 전체가 ASCII 또는 영문 label이면 한글 주석으로 인정하지 않습니다.","새로 추가하거나 바꾼 각 annotation body에는 그 선언의 목적이나 제약을 설명하는 한글 구절이 있어야 합니다.","다른 `@field`가 한글이어도 영문-only `@summary`를 대신 통과시키지 않습니다."],"examples":[{"kind":"incorrect","label":"영문 또는 How 중심의 장황한 설명","blocks":[{"lang":"ts","code":"/**\n * @summary This function sorts rule refs and returns the result.\n */\n\n/**\n * @summary route-local entry tree props\n */"}]},{"kind":"correct","label":"한글, 명사형, 의도 중심 설명","blocks":[{"lang":"ts","code":"/**\n * @summary 중복 제거 후 규칙 경로 정렬\n */\n\n/**\n * @summary route-local 엔트리 트리 입력 계약\n */"}]}]},{"skill":"typescript","id":"guardrails-review-banned-typescript-shortcuts-before-finishing","number":"6.1","title":"Review Banned TypeScript Shortcuts Before Finishing","titleKo":"마무리 전에 금지된 TypeScript 지름길 점검","impact":"MEDIUM","impactDescription":"import·타입·헬퍼·fallback·주석 규율을 가장 자주 무너뜨리는 지름길을 잡음","appliesWhen":"TypeScript/TSX 변경을 완료 판정하거나 diff에서 barrel, 중복 타입, 조기 helper, 넓은 조립, 무근거 fallback 또는 자명한 주석을 점검한다.","tags":["review","banned-patterns","guardrails"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"guardrails","prose":["discipline)**","","작업을 끝냈다고 보기 전에 반복적으로 금지되는 TypeScript 지름길을 다시 확인합니다.","barrel export, 기존 타입 재선언, 재사용 근거 없는 조기 추상화, 넓은 스코프 명령형 조립, 사유 없는 폴백,","자명한 코드 설명 주석은 마무리 전에 제거합니다."],"examples":[{"kind":"incorrect","label":"금지 패턴을 그대로 남김","blocks":[{"lang":"ts","code":"export * from \"./index\";\n\ninterface RequestSnapshot {\n\trequest: string;\n}\n\nconst supportEmail = settings.supportEmail ?? \"help@example.com\";"}]},{"kind":"correct","label":"공개 경계와 결측 처리를 명시적으로 유지","blocks":[{"lang":"ts","code":"import type {UserRecord} from \"\u003ctype-public-import>\";\n\n/**\n * @summary 사용자 미리보기 계약\n */\ntype UserPreview = Pick\u003cUserRecord, \"id\" | \"name\">;\n\nif (!settings.supportEmail) {\n\tthrow new Error(\"supportEmail is required.\");\n}"}]}]}]}</script>
<script>
(() => {
	"use strict";

	const DATA = JSON.parse(document.getElementById("viewer-data").textContent);
	window.CONVENTION_DATA = DATA;

	const RULES = DATA.rules;
	const IMPACTS = ["CRITICAL", "HIGH", "MEDIUM-HIGH", "MEDIUM"];
	const DOT = {
		CRITICAL: "var(--coral)",
		HIGH: "color-mix(in srgb, var(--coral) 75%, transparent)",
		"MEDIUM-HIGH": "color-mix(in srgb, var(--coral) 40%, transparent)",
		MEDIUM: "var(--edge)",
	};

	const keyOf = (r) => r.skill + "/" + r.id;
	const domIdOf = (r) => "r-" + r.skill + "--" + r.id;
	const byKey = new Map(RULES.map((r) => [keyOf(r), r]));
	const titleOf = (r) => r.titleKo || r.title;
	const secOf = (r) => DATA.sections.find((s) => s.skill === r.skill && s.prefix === r.sectionPrefix);
	const secLabel = (s) => s.titleKo || s.title;

	// skill 은 단일 선택. section 은 skill 마다 같은 prefix 를 쓸 수 있어 "skill/prefix" 로 잡는다.
	const state = {q: "", skill: "", impact: new Set(), section: "", tags: new Set(), open: new Set(), when: new Set(), why: new Set()};

	const remember = () => { try { localStorage.setItem("viewer-skill", state.skill); } catch (e) {} };
	try { state.skill = localStorage.getItem("viewer-skill") || ""; } catch (e) {}
	if (!DATA.skills.some((s) => s.name === state.skill)) {
		state.skill = DATA.skills.some((s) => s.name === "react") ? "react" : (DATA.skills[0] ? DATA.skills[0].name : "");
	}

	const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
	const KW = /\b(const|let|var|function|return|if|else|for|while|export|import|from|type|interface|as|await|async|new|void|null|undefined|true|false|extends|default|typeof|in|of)\b/g;

	function hl(code, lang) {
		let s = esc(code);
		const hold = [];
		// 자리표시자는 코드에 절대 없는 NUL 이어야 한다.
		// 공백+숫자를 쓰면 `arr.length > 0 ?` 의 " 0 " 과 충돌해 코드가 깨진다.
		const park = (t) => "\u0000" + (hold.push(t) - 1) + "\u0000";
		const wrap = (cls, m) => park('<span class="' + cls + '">' + m + "</span>");
		s = s.replace(/\/\/[^\n]*/g, (m) => wrap("c", m));
		s = s.replace(/\/\*[\s\S]*?\*\//g, (m) => wrap("c", m));
		s = s.replace(/(&#39;|'|"|`)(?:\\.|(?!\1)[\s\S])*?\1/g, (m) => wrap("s", m));
		if (lang === "tsx" || lang === "astro") {
			s = s.replace(/&lt;\/?([A-Za-z][\w.-]*)/g, (m, n) => m.replace(n, '<span class="g">' + n + "</span>"));
		}
		s = s.replace(KW, '<span class="k">$&</span>');
		return s.replace(/\u0000(\d+)\u0000/g, (_, i) => hold[+i]);
	}

	const inline = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

	function renderProse(prose) {
		let out = "", para = [], tbl = null, list = null;
		const flushP = () => { if (para.length) { out += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
		const flushL = () => {
			if (!list) return;
			out += "<ul>" + list.map((item) => "<li>" + inline(item) + "</li>").join("") + "</ul>";
			list = null;
		};
		const flushT = () => {
			if (!tbl) return;
			const head = tbl[0], body = tbl.slice(1);
			out += '<div class="tw"><table><thead><tr>' + head.map((c) => "<th>" + inline(c) + "</th>").join("") + "</tr></thead><tbody>";
			out += body.map((r) => "<tr>" + r.map((c) => "<td>" + inline(c) + "</td>").join("") + "</tr>").join("");
			out += "</tbody></table></div>";
			tbl = null;
		};
		const flushAll = () => { flushP(); flushL(); flushT(); };

		for (const p of prose) {
			// 문자열은 일반 줄, 객체는 코드 블록이다.
			if (typeof p !== "string") { flushAll(); out += '<pre class="code">' + hl(p.code, p.lang) + "</pre>"; continue; }
			const t = p.trim();

			// 표
			if (t.startsWith("|")) {
				flushP(); flushL();
				const cells = t.replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
				if (cells.every((c) => /^:?-{2,}:?$/.test(c))) continue;
				tbl = tbl || []; tbl.push(cells);
				continue;
			}
			flushT();

			// 목록. 이걸 문단으로 뭉치면 "- 항목 - 항목" 으로 이어져 읽을 수 없다.
			const bullet = /^[-*+]\s+(.*)$/.exec(t);
			if (bullet) {
				flushP();
				list = list || []; list.push(bullet[1]);
				continue;
			}
			// 목록 항목의 이어지는 줄은 마지막 항목에 붙인다.
			if (list && t) { list[list.length - 1] += " " + t; continue; }

			if (!t) { flushAll(); continue; }
			para.push(t);
		}
		flushAll();
		return out;
	}

	function haystack(r) {
		if (r._h) return r._h;
		const code = r.examples.flatMap((e) => e.blocks.map((b) => b.code)).join("\n");
		// 한국어·영어 제목을 모두 색인해 어느 언어로 검색해도 걸린다.
		return (r._h = [r.titleKo, r.title, r.id, r.skill, r.appliesWhen, r.impactDescription, r.tags.join(" "), code].join("\n").toLowerCase());
	}

	function matches(r) {
		if (state.skill && r.skill !== state.skill) return false;
		if (state.section && r.skill + "/" + r.sectionPrefix !== state.section) return false;
		if (state.impact.size && !state.impact.has(r.impact)) return false;
		if (state.tags.size && !r.tags.some((t) => state.tags.has(t))) return false;
		if (state.q) {
			const h = haystack(r);
			return state.q.toLowerCase().split(/\s+/).filter(Boolean).every((t) => h.includes(t));
		}
		return true;
	}

	function hi(text) {
		const t = esc(text);
		if (!state.q) return t;
		const terms = state.q.split(/\s+/).filter(Boolean).map((x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
		return terms.length ? t.replace(new RegExp("(" + terms.join("|") + ")", "gi"), "<mark>$1</mark>") : t;
	}

	// 참조 칩은 규칙 ID 대신 한국어 제목을 보여준다. ID 는 title 속성에 남겨 grep 이 되게 한다.
	// 같은 skill 안의 참조는 ID 만 오므로 소유 skill 을 붙여 해석한다.
	const refHtml = (target, ownerSkill) => {
		const ext = target.includes("/");
		const key = ext ? target : ownerSkill + "/" + target;
		const rule = byKey.get(key);
		const label = rule ? (ext ? rule.skill + " · " : "") + titleOf(rule) : target;
		return '<button class="ref" data-ext="' + (ext ? 1 : 0) + '" title="' + esc(key) + '"' +
			(rule ? ' data-goto="' + esc(key) + '"' : " disabled") + ">" + esc(label) + "</button>";
	};

	// 블록이 여러 개면 박스 하나 안에서 "1 / 2 · lang" 구분선으로 잇는다.
	const codeHtml = (blocks) => blocks.map((b, i) =>
		(blocks.length > 1 ? '<div class="code-lb">' + (i + 1) + " / " + blocks.length + "  ·  " + esc(b.lang) + "</div>" : "") +
		'<pre class="code">' + hl(b.code, b.lang) + "</pre>").join("");

	const boxHtml = (e) => {
		if (!e) return "";
		const bad = e.kind === "incorrect";
		const langs = [...new Set(e.blocks.map((b) => b.lang))].join(" · ");
		return '<div class="box ' + (bad ? "box-bad" : "box-good") + '"><div class="box-hd">' +
			'<span class="box-l"><span aria-hidden="true">' + (bad ? "\u2715" : "\u2713") + "</span>" +
			"<span>" + (bad ? "INCORRECT" : "CORRECT") + "</span>" +
			(e.label ? '<span class="box-note">' + esc(e.label) + "</span>" : "") + "</span>" +
			'<span class="box-langs">' + esc(langs) + "</span></div>" + codeHtml(e.blocks) + "</div>";
	};

	function ruleHtml(r) {
		const key = keyOf(r);
		const open = state.open.has(key);
		const whenOpen = state.when.has(key);
		const whyOpen = state.why.has(key);
		const sec = secOf(r);
		const exCount = r.examples.reduce((t, e) => t + e.blocks.length, 0);

		let body = "";
		if (open) {
			const pairs = [];
			for (let i = 0; i < r.examples.length; i++) {
				const e = r.examples[i];
				const nx = r.examples[i + 1];
				if (e.kind === "incorrect" && nx && nx.kind === "correct") { pairs.push([e, nx]); i++; }
				else pairs.push([e]);
			}
			const refs = [];
			if (r.requiresSelected.length) refs.push(["함께 적용", r.requiresSelected]);
			if (r.reviewWith.length) refs.push(["함께 검토", r.reviewWith]);

			// 아코디언 두 개는 같은 형태로 둔다. 둘 다 접힌 상태로 시작해 코드가 먼저 읽힌다.
			const acc = (attr, label, open, inner) =>
				'<div class="acc" data-open="' + (open ? 1 : 0) + '">' +
				'<button class="acc-btn" data-' + attr + '="' + esc(key) + '">' +
				'<span class="acc-car" aria-hidden="true">' + (open ? "\u25be" : "\u25b8") + "</span>" +
				"<span>" + label + "</span></button>" +
				'<div class="acc-body">' + (open ? inner() : "") + "</div></div>";

			// 순서: 코드 → 언제 → 왜 → 함께 → 태그.
			// 규칙을 펼치는 이유는 "어떻게 고치나" 이므로 코드가 먼저 온다.
			body = '<div class="body">' +
				'<div class="meta"><span>' + esc(r.id) + "</span>" +
				(sec ? '<span class="meta-s">·</span><span>' + esc(secLabel(sec)) + "</span>" : "") +
				'<span class="meta-s">·</span><span>예시 ' + exCount + "</span></div>" +
				'<div class="pairs">' + pairs.map((p) => '<div class="pair">' +
					boxHtml(p.find((e) => e.kind === "incorrect")) +
					boxHtml(p.find((e) => e.kind !== "incorrect")) + "</div>").join("") + "</div>" +
				'<div class="accs">' +
				(r.appliesWhen
					? acc("when", "언제 적용할까요?", whenOpen, () => "<p>" + hi(r.appliesWhen) + "</p>")
					: "") +
				(r.prose.length || r.impactDescription
					? acc("why", "이 규칙이 왜 필요할까요?", whyOpen, () =>
						(r.impactDescription ? '<p class="lead">' + esc(r.impactDescription) + "</p>" : "") + renderProse(r.prose))
					: "") +
				"</div>" +
				(refs.length ? '<div class="refs">' + refs.map((g) => '<div class="ref-g"><span class="ref-lb">' + g[0] + "</span>" +
					'<span class="ref-items">' + g[1].map((t) => refHtml(t, r.skill)).join("") + "</span></div>").join("") + "</div>" : "") +
				'<div class="rtags">' + r.tags.map((t) => '<button class="rtag" data-tag="' + esc(t) + '">#' + esc(t) + "</button>").join("") + "</div>" +
				"</div>";
		}

		return '<article class="row" data-imp="' + r.impact + '" data-open="' + (open ? 1 : 0) + '" id="' + domIdOf(r) + '">' +
			'<span class="row-stripe" aria-hidden="true"></span>' +
			'<button class="row-hd" data-rule="' + esc(key) + '" aria-expanded="' + open + '">' +
			'<span class="row-no" title="' + esc(r.skill) + " HANDBOOK " + r.number + '">' + r.number + "</span>" +
			'<span class="row-ti">' + hi(titleOf(r)) + "</span>" +
			'<span class="row-meta"><span class="imp imp-' + r.impact + '">' + r.impact + "</span>" +
			'<span class="car" aria-hidden="true">' + (open ? "\u25be" : "\u25b8") + "</span></span></button>" +
			body + "</article>";
	}

	function renderRail() {
		const scoped = RULES.filter((r) => !state.skill || r.skill === state.skill);
		const count = (fn) => scoped.filter(fn).length;

		document.getElementById("f-skill").innerHTML = DATA.skills.map((s) =>
			'<button class="ch ch-skill" data-skill="' + s.name + '" aria-pressed="' + (state.skill === s.name) + '">' +
			'<span class="ch-lb">' + s.name + '</span><span class="ch-n">' + s.ruleCount + "</span></button>").join("");

		document.getElementById("f-impact").innerHTML = IMPACTS.map((k) => {
			const active = state.impact.has(k);
			return '<button class="ch ch-imp" data-impact="' + k + '" aria-pressed="' + active + '">' +
				'<span class="ch-dot" style="background:' + (active ? "#fff" : DOT[k]) + '"></span>' +
				'<span class="ch-lb">' + k + '</span><span class="ch-n">' + count((r) => r.impact === k) + "</span></button>";
		}).join("");

		const secs = DATA.sections.filter((s) => !state.skill || s.skill === state.skill)
			.slice()
			.sort((a, b) => a.skill.localeCompare(b.skill, "en-US") || a.order - b.order);
		document.getElementById("f-section").innerHTML = secs.map((s) => {
			const key = s.skill + "/" + s.prefix;
			return '<button class="ch ch-sec" data-section="' + esc(key) + '" aria-pressed="' + (state.section === key) + '">' +
				'<span class="ch-no">' + (state.skill ? s.order + "." : s.skill.slice(0, 3) + " " + s.order) + "</span>" +
				'<span class="ch-lb">' + esc(secLabel(s)) + '</span><span class="ch-n">' +
				count((r) => r.skill === s.skill && r.sectionPrefix === s.prefix) + "</span></button>";
		}).join("");

		const tally = new Map();
		for (const r of scoped) for (const t of r.tags) tally.set(t, (tally.get(t) || 0) + 1);
		document.getElementById("f-tags").innerHTML = [...tally.entries()].filter((e) => e[1] > 1)
			.sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
			.slice(0, 36)
			.map((e) => '<button class="tg" data-tag="' + esc(e[0]) + '" aria-pressed="' + state.tags.has(e[0]) + '">' +
				"<span>" + esc(e[0]) + '</span><span class="tg-n">' + e[1] + "</span></button>").join("");

		const seen = new Set();
		const hints = [];
		const skill = DATA.skills.find((s) => s.name === state.skill);
		for (const c of skill ? skill.companions : []) {
			if (c.skill === state.skill || seen.has(c.skill)) continue;
			seen.add(c.skill);
			hints.push('<button class="comp-ch" data-skill="' + c.skill + '">\u2192 ' + c.skill + (c.mode === "required" ? " 필수" : " 조건") + "</button>");
		}
		document.getElementById("companion").innerHTML = hints.length ? '<span class="comp-lb">동반</span>' + hints.join("") : "";
	}

	function render() {
		const hits = RULES.filter(matches);
		const scopeTotal = RULES.filter((r) => !state.skill || r.skill === state.skill).length;
		document.getElementById("list").innerHTML = hits.length
			? hits.map(ruleHtml).join("")
			: '<div class="empty">일치하는 규칙이 없습니다. 검색어나 필터를 줄여보세요.</div>';
		const codeTotal = hits.reduce((n, r) => n + r.examples.reduce((m, e) => m + e.blocks.length, 0), 0);
		document.getElementById("count").textContent = hits.length + " / " + scopeTotal + " 규칙" + (hits.length ? "  ·  코드 " + codeTotal : "");
		const allOpen = hits.length > 0 && hits.every((r) => state.open.has(keyOf(r)));
		document.getElementById("expand").textContent = allOpen ? "전체 접기" : "전체 펼침";
		renderRail();
	}

	function selectSkill(name) {
		if (state.skill === name) return;
		state.skill = name;
		state.section = "";
		state.impact.clear();
		state.tags.clear();
		remember();
		render();
	}

	document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value.trim(); render(); });

	document.getElementById("expand").addEventListener("click", () => {
		const hits = RULES.filter(matches);
		const allOpen = hits.length && hits.every((r) => state.open.has(keyOf(r)));
		for (const r of hits) { const k = keyOf(r); allOpen ? state.open.delete(k) : state.open.add(k); }
		render();
	});

	document.getElementById("theme").addEventListener("click", () => {
		const cur = document.documentElement.dataset.theme;
		const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
		document.documentElement.dataset.theme = dark ? "light" : "dark";
	});

	document.addEventListener("click", (ev) => {
		const t = ev.target.closest("[data-rule],[data-skill],[data-impact],[data-section],[data-tag],[data-when],[data-why],[data-goto],[data-clear]");
		if (!t) return;
		const toggle = (set, key) => { set.has(key) ? set.delete(key) : set.add(key); render(); };

		if (t.dataset.rule) return toggle(state.open, t.dataset.rule);
		if (t.dataset.skill) return selectSkill(t.dataset.skill);
		if (t.dataset.impact) return toggle(state.impact, t.dataset.impact);
		if (t.dataset.tag) return toggle(state.tags, t.dataset.tag);
		if (t.dataset.section) { state.section = state.section === t.dataset.section ? "" : t.dataset.section; return render(); }
		if (t.dataset.when) return toggle(state.when, t.dataset.when);
		if (t.dataset.why) return toggle(state.why, t.dataset.why);

		if (t.dataset.goto) {
			// 단일 선택이라 다른 skill 규칙으로 가려면 선택을 그 skill 로 옮긴다.
			const target = byKey.get(t.dataset.goto);
			if (!target) return;
			state.q = ""; state.impact.clear(); state.tags.clear(); state.section = "";
			document.getElementById("q").value = "";
			if (state.skill !== target.skill) { state.skill = target.skill; remember(); }
			state.open.add(t.dataset.goto);
			render();
			const el = document.getElementById(domIdOf(target));
			if (el) {
				const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
				window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - 88, behavior: reduce ? "auto" : "smooth"});
			}
			return;
		}

		if (t.dataset.clear) {
			if (t.dataset.clear === "impact") state.impact.clear();
			if (t.dataset.clear === "tags") state.tags.clear();
			if (t.dataset.clear === "section") state.section = "";
			render();
		}
	});

	document.addEventListener("keydown", (e) => {
		if (e.key === "/" && e.target.tagName !== "INPUT") { e.preventDefault(); document.getElementById("q").focus(); }
		if (e.key === "Escape" && e.target.id === "q") { e.target.value = ""; state.q = ""; render(); e.target.blur(); }
	});

	render();
})();
</script>
</body>
</html>
