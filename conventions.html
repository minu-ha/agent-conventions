t":"CRITICAL","impactDescription":"기준 화면과 현재 화면 없이 CSS를 추측 수정하는 일을 막음","appliesWhen":"","tags":["evidence","screenshot","browser"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"evidence","prose":["구현 전에 Figma node/design context/screenshot과 현재 브라우저 구현 화면을 모두 확인합니다.","Figma node가 너무 크거나 tool fetch가 실패하면 더 작은 node, parent section, screenshot, metadata fallback을 사용하고,","확보한 evidence와 한계를 기록합니다."],"examples":[{"kind":"incorrect","label":"Figma node 실패를 이유로 분석 포기","blocks":[{"lang":"md","code":"Figma context fetch 실패. 기존 화면만 보고 spacing을 대략 조정한다."}]},{"kind":"correct","label":"fallback evidence를 확보하고 한계를 기록","blocks":[{"lang":"md","code":"Figma node fetch 실패.\n1. 더 작은 child node 요청 또는 탐색\n2. parent section screenshot 확인\n3. metadata fallback으로 레이어명/크기 확인\n4. 모르는 항목은 visual diff 표에 \"확인 필요\"로 기록"}]}]},{"skill":"figma-visual-parity","id":"evidence-write-visual-diff-table-before-implementation","number":"2.2","title":"Write the Visual Diff Table Before Implementation","titleKo":"구현 전에 시각 diff 표를 먼저 쓰기","impact":"CRITICAL","impactDescription":"구현 범위와 완료 기준을 layout, spacing, typography 같은 항목으로 명확히 고정함","appliesWhen":"","tags":["evidence","visual-diff","planning"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"evidence","prose":["코드를 수정하기 전에 Figma와 현재 구현의 차이를 표로 작성합니다.","최소 항목은 layout, spacing, typography, color, border/radius, surface/background, shadow, icon/assets, static copy,","states, responsive behavior입니다."],"examples":[{"kind":"incorrect","label":"차이 분류 없이 바로 수정","blocks":[{"lang":"md","code":"Figma가 더 촘촘해 보여서 padding과 font-size를 조금 줄임."}]},{"kind":"correct","label":"수정 기준을 먼저 표로 고정","blocks":[{"lang":"md","code":"| 항목 | Figma | 현재 구현 | 수정 방침 |\n| --- | --- | --- | --- |\n| spacing | 카드 내부 12px | 카드 내부 20px | token spacing-sm로 축소 |\n| static copy | \"상세 보기\" | \"보기\" | Figma copy로 맞춤 |\n| metric value | 예시 숫자 98.7% | API 응답 값 | 하드코딩하지 않음 |"}]}]},{"skill":"figma-visual-parity","id":"integration-audit-and-use-every-available-figma-integration","number":"3.1","title":"Audit and Use Every Available Figma Integration Layer","titleKo":"쓸 수 있는 Figma 연동 레이어를 전부 확인하고 쓰기","impact":"CRITICAL","impactDescription":"MCP만 쓰고 끝내지 않고 사용 가능한 integration을 모두 조합하게 함","appliesWhen":"","tags":["integration","mcp","rest-api","code-connect"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"integration","prose":["Figma visual parity 작업을 시작하면 먼저 사용 가능한 integration을 audit합니다.","Figma MCP, Code Connect, Figma REST API token, variables/components/styles metadata, repo design system inventory,","browser screenshot diff 중 접근 가능한 것은 모두 사용합니다.","접근할 수 없는 계층은 조용히 생략하지 말고 \"없음\", \"권한 없음\", \"scope 부족\", \"rate limit\",","\"tool unavailable\"처럼 이유를 기록합니다."],"examples":[{"kind":"incorrect","label":"MCP 한 계층만 보고 바로 구현","blocks":[{"lang":"md","code":"Figma MCP screenshot을 봤으니 바로 CSS를 수정한다.\nCode Connect, REST API token, variables metadata, browser diff 가능 여부는 확인하지 않는다."}]},{"kind":"correct","label":"가능한 evidence layer를 먼저 정리","blocks":[{"lang":"md","code":"Integration audit:\n- Figma MCP: 사용 가능, design context와 screenshot 확보\n- Code Connect: 사용 가능, Button/Table snippet 확인\n- Figma REST API: FIGMA_TOKEN 있음, node JSON과 reference PNG 확보\n- Variables API: 403 file_variables:read scope 없음, repo token inventory로 fallback\n- Browser diff: Playwright screenshot 확인 가능"}]}]},{"skill":"figma-visual-parity","id":"integration-map-variables-components-and-styles-to-project-tokens","number":"3.2","title":"Map Variables, Components, and Styles to Project Tokens","titleKo":"Figma 변수·컴포넌트·스타일을 프로젝트 토큰에 매핑","impact":"HIGH","impactDescription":"Figma token metadata를 확인할 수 있는데 raw visual value를 코드에 박는 일을 줄임","appliesWhen":"","tags":["integration","variables","tokens"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"integration","prose":["권한이 있으면 Figma variables, components, styles metadata를 확인해 project token과 component mapping에 반영합니다.","`file_variables:read` scope가 있으면 `GET /v1/files/:file_key/variables/local` 또는 published variables endpoint로","mode별 token 값을 확인합니다.","published component/style metadata가 필요하면 file/team component endpoints를 사용합니다.","scope, plan, rate limit 때문에 실패하면 repo의 CSS variable, design token, component usage inventory로 fallback합니다."],"examples":[{"kind":"incorrect","label":"metadata 확인 없이 raw value를 늘림","blocks":[{"lang":"css","code":".card {\n  color: #1a5cff;\n  border-radius: 13px;\n}"}]},{"kind":"correct","label":"Figma variable/style과 project token을 매핑","blocks":[{"lang":"md","code":"Token mapping:\n- Figma variable `color/action/primary` -> `--color-action-primary`\n- Figma radius style `radius/card/default` -> `--radius-card`\n- Figma Table component -> `DataTable` usage in src/components"}]}]},{"skill":"figma-visual-parity","id":"integration-prefer-code-connect-and-repo-components","number":"3.3","title":"Prefer Code Connect and Repo Components Over Rebuilding UI","titleKo":"UI를 새로 만들기보다 Code Connect와 레포 컴포넌트를","impact":"CRITICAL","impactDescription":"실제 디자인 시스템 컴포넌트를 무시하고 raw JSX/CSS를 새로 만드는 일을 막음","appliesWhen":"","tags":["integration","code-connect","components"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"integration","prose":["Code Connect context가 있으면 import statement, component snippet, prop mapping, variant value,","custom instruction을 우선 구현 기준으로 사용합니다.","Code Connect가 없으면 repo의 `src/components`, `src/shared`, design system docs,","existing route usage를 검색해 Figma component와 code component mapping table을 먼저 작성합니다.","새 컴포넌트나 raw CSS는 기존 컴포넌트로 표현할 수 없을 때만 만듭니다."],"examples":[{"kind":"incorrect","label":"연결된 component snippet을 무시","blocks":[{"lang":"tsx","code":"// Figma Button에 Code Connect snippet이 있는데도 새 버튼 markup을 만듦\n\u003cbutton className=\"primary-blue-rounded-button\">저장\u003c/button>"}]},{"kind":"correct","label":"Code Connect 또는 repo component mapping을 구현 기준으로 사용","blocks":[{"lang":"tsx","code":"import {Button} from \"@/components/ui/button\";\n\n\u003cButton variant=\"primary\" size=\"sm\">\n  저장\n\u003c/Button>"}]}]},{"skill":"figma-visual-parity","id":"integration-use-rest-api-for-node-json-and-reference-images","number":"3.4","title":"Use REST API for Node JSON and Reference Images When Available","titleKo":"가능하면 REST API로 node JSON과 기준 이미지 받기","impact":"CRITICAL","impactDescription":"Figma URL에서 구조화된 node 데이터와 비교용 reference image를 확보하게 함","appliesWhen":"","tags":["integration","rest-api","screenshot"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"integration","prose":["Figma REST API token이 있으면 Figma URL에서 `fileKey`와 `nodeId`를 파싱합니다.","URL의 `node-id=1-2`는 API 요청용 `1:2`로 변환합니다.","`GET /v1/files/:key/nodes?ids=\u003cnodeId>`로 node JSON과 subtree를 확인하고, 큰 node는 `depth`를 낮춰 구조를 먼저 봅니다.","`GET /v1/images/:key?ids=\u003cnodeId>&format=png&scale=2`로 reference image를 확보해 browser screenshot diff 기준으로","사용합니다.","token, signed image URL, 원본 응답 전체는 로그나 커밋에 노출하지 않습니다."],"examples":[{"kind":"incorrect","label":"REST API 사용 가능 상태를 무시","blocks":[{"lang":"md","code":"FIGMA_TOKEN과 node URL이 있지만 MCP screenshot만 보고 구현한다.\nreference image 없이 눈대중으로 browser 화면을 비교한다."}]},{"kind":"correct","label":"구조와 reference image를 함께 확보","blocks":[{"lang":"md","code":"Parsed Figma URL:\n- fileKey: abc123\n- nodeId: 12:34\n\nREST evidence:\n- GET /v1/files/:key/nodes?ids=12:34\n- GET /v1/images/:key?ids=12:34&format=png&scale=2"}]}]},{"skill":"figma-visual-parity","id":"data-classify-static-copy-and-dynamic-values","number":"4.1","title":"Classify Static UI Copy and Dynamic Values","titleKo":"정적 UI 문구와 동적 값을 구분","impact":"CRITICAL","impactDescription":"Figma copy는 맞추되 서버/API 값을 하드코딩하는 오류를 막음","appliesWhen":"","tags":["data","copy","api"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"data","prose":["Figma에 보이는 모든 텍스트와 숫자를 static UI copy와 dynamic data로 먼저 분류합니다.","버튼명, 탭명, 컬럼명, 라벨, placeholder, empty state, default option, 고정 안내문구는 Figma 기준으로 맞춥니다.","row data, metric value, user-specific data, API mock 값은 UI 고정값처럼 박지 않습니다."],"examples":[{"kind":"incorrect","label":"Figma 숫자를 API 값 대신 하드코딩","blocks":[{"lang":"tsx","code":"\u003cMetricCard label=\"성공률\" value=\"98.7%\" />"}]},{"kind":"correct","label":"static label만 맞추고 value는 데이터 오리진 유지","blocks":[{"lang":"tsx","code":"\u003cMetricCard label=\"성공률\" value={responseMetric.successRateLabel} />"}]}]},{"skill":"figma-visual-parity","id":"data-do-not-confuse-static-labels-with-server-data","number":"4.2","title":"Do Not Confuse Static Labels with Server Data","titleKo":"정적 라벨을 서버 데이터로 착각하지 않기","impact":"HIGH","impactDescription":"Figma의 고정 라벨과 섹션 제목을 데이터라는 이유로 방치하지 않게 함","appliesWhen":"","tags":["data","labels","copy"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"data","prose":["Figma static label을 서버 데이터라고 착각해서 맞추지 않는 것도 오류입니다.","버튼 텍스트, column header, tab label, empty state,","section heading은 제품 copy이므로 Figma 또는 사용자 지시를 기준으로 맞춥니다.","애매하면 먼저 \"static copy 후보\"와 \"dynamic data 후보\"로 분류해 보고합니다."],"examples":[{"kind":"incorrect","label":"고정 라벨을 데이터라고 보고 방치","blocks":[{"lang":"md","code":"Figma: \"활성 포지션\"\n현재 구현: \"운영중\"\n판단: 서버에서 내려오는 것 같으니 변경하지 않음."}]},{"kind":"correct","label":"visible static label은 Figma 기준으로 맞춤","blocks":[{"lang":"md","code":"Figma: \"활성 포지션\"\n현재 구현: \"운영중\"\n판단: 탭 라벨은 static UI copy이므로 Figma 기준으로 \"활성 포지션\"에 맞춤."}]}]},{"skill":"figma-visual-parity","id":"implementation-keep-parity-changes-scoped","number":"5.1","title":"Keep Parity Changes Scoped","titleKo":"parity 변경은 범위 안에 두기","impact":"HIGH","impactDescription":"visual polish 중 불필요한 구조 리팩터링과 shared surface 변경을 막음","appliesWhen":"","tags":["implementation","scope","shared"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"implementation","prose":["Visual parity 작업은 Figma와 현재 화면의 차이를 줄이는 데 집중합니다.","불필요한 구조 리팩터링, API/data shaping 변경, shared component/style 변경을 기본값으로 삼지 않습니다.","scope 밖 shared surface 변경이 필요하면 왜 필요한지 먼저 보고하고 승인을 받습니다."],"examples":[{"kind":"incorrect","label":"스타일 보정 중 구조를 크게 바꿈","blocks":[{"lang":"md","code":"scope: src/pages/detail\n작업: 공용 Button variant, 전역 table CSS, API response mapper까지 함께 리팩터링."}]},{"kind":"correct","label":"scope 안에서 parity 차이를 먼저 줄임","blocks":[{"lang":"md","code":"scope: src/pages/detail\n작업: detail-local wrapper와 CSS token 조정으로 Figma spacing/color/radius를 맞춤.\n공용 Button 변경 필요성은 별도 보고."}]}]},{"skill":"figma-visual-parity","id":"implementation-preserve-visible-labels-and-headings","number":"5.2","title":"Preserve Visible Labels and Headings Unless Explicitly Removed","titleKo":"명시적 삭제 요청 없이 라벨·제목을 없애지 않기","impact":"HIGH","impactDescription":"UI polish 중 사용자에게 보이는 구조 신호를 임의 삭제하지 않게 함","appliesWhen":"","tags":["implementation","labels","headings"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"implementation","prose":["Visible label, section title, heading, column header는 화면 구조와 접근성의 일부입니다.","Figma 또는 사용자가 명확히 제거하라고 하지 않는 한, visual polish를 이유로 임의 삭제하지 않습니다.","Figma에 label이 있고 현재 구현에 없으면 static UI copy로 맞출 후보입니다."],"examples":[{"kind":"incorrect","label":"깔끔해 보이게 하려고 heading 삭제","blocks":[{"lang":"tsx","code":"return \u003cDataTable rows={rows} />;"}]},{"kind":"correct","label":"Figma의 visible section title 유지","blocks":[{"lang":"tsx","code":"return (\n  \u003csection aria-labelledby=\"position-summary-title\">\n    \u003ch2 id=\"position-summary-title\">포지션 요약\u003c/h2>\n    \u003cDataTable rows={rows} />\n  \u003c/section>\n);"}]}]},{"skill":"figma-visual-parity","id":"implementation-reuse-components-and-design-tokens-first","number":"5.3","title":"Reuse Existing Components and Design Tokens First","titleKo":"기존 컴포넌트와 디자인 토큰을 먼저 재사용","impact":"HIGH","impactDescription":"visual parity 작업이 raw CSS 누적이나 디자인 시스템 우회로 흐르지 않게 함","appliesWhen":"","tags":["implementation","components","tokens"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"implementation","prose":["Figma와 맞지 않는 부분을 고칠 때도 기존 컴포넌트, CSS 변수, spacing/color/type token,","local wrapper 규칙을 먼저 확인합니다.","필요한 경우 owner scope 안에서 CSS/layout을 조정하되, 디자인 시스템에 이미 있는 표현을 raw value로 새로 늘리지 않습니다."],"examples":[{"kind":"incorrect","label":"토큰 확인 없이 raw CSS만 추가","blocks":[{"lang":"css","code":".summary-card {\n  padding: 13px 19px;\n  color: #2663eb;\n  border-radius: 11px;\n}"}]},{"kind":"correct","label":"기존 token과 owner scope를 우선 사용","blocks":[{"lang":"css","code":".detail-summary-card {\n  padding: var(--spacing-3);\n  color: var(--color-accent-primary);\n  border-radius: var(--radius-md);\n}"}]}]},{"skill":"figma-visual-parity","id":"verification-compare-screenshots-before-completion","number":"6.1","title":"Compare Screenshots Before Completion","titleKo":"완료 전에 스크린샷을 비교","impact":"CRITICAL","impactDescription":"build/test 성공만으로 visual parity 완료를 선언하는 일을 막음","appliesWhen":"","tags":["verification","screenshot","browser"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"verification","prose":["Build/test 통과는 필요하지만 visual parity의 완료 조건은 아닙니다.","실제 브라우저에서 구현 화면 screenshot을 확인하고,","Figma screenshot과 비교해 mismatch가 남으면 가능한 범위에서 수정 반복합니다.","브라우저 검증을 못 하면 완료가 아니라 미검증 상태로 보고합니다."],"examples":[{"kind":"incorrect","label":"빌드 성공만으로 완료","blocks":[{"lang":"md","code":"npm run build 통과했습니다. 완료입니다."}]},{"kind":"correct","label":"브라우저 screenshot 비교까지 보고","blocks":[{"lang":"md","code":"npm run build 통과.\n브라우저 screenshot 확인 완료.\nFigma 대비 spacing과 button label mismatch 수정 완료.\n남은 mismatch: chart 내부 tick label은 third-party canvas 렌더링이라 별도 후속 필요."}]}]},{"skill":"figma-visual-parity","id":"verification-report-scope-data-copy-mismatch-and-commands","number":"6.2","title":"Report Scope, Data Boundaries, Mismatches, and Commands","titleKo":"범위·데이터 경계·불일치·실행 명령을 보고","impact":"CRITICAL","impactDescription":"완료 보고에서 근거, 제외 항목, 남은 차이를 숨기지 않게 함","appliesWhen":"","tags":["verification","report","completion"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"verification","prose":["완료 보고에는 사용한 Figma 링크/node, 수정 scope, 구현한 visual parity 항목, 동적 데이터라서 하드코딩하지 않은 항목,","정적 UI copy로 맞춘 항목, 브라우저 screenshot 검증 여부, 남은 mismatch, 실행한 검증 명령을 포함합니다."],"examples":[{"kind":"incorrect","label":"검증 근거와 남은 차이를 생략","blocks":[{"lang":"md","code":"Figma에 맞춰 스타일 수정했습니다. 테스트도 통과했습니다."}]},{"kind":"correct","label":"완료 기준을 추적 가능하게 보고","blocks":[{"lang":"md","code":"- 사용한 Figma 링크/node: node-id=12:34\n- 수정 scope: src/pages/detail/**\n- 구현한 visual parity 항목: layout, spacing, typography, static copy\n- 동적 데이터라서 하드코딩하지 않은 항목: metric value, row count\n- 정적 UI copy로 맞춘 항목: tab label, empty state\n- 브라우저 screenshot 검증 여부: 완료\n- 남은 mismatch: chart axis는 canvas renderer 제한으로 남음\n- 실행한 검증 명령: npm run build, npm run test"}]}]},{"skill":"nestjs","id":"naming-organize-domain-modules-and-shared-backend-code-by-scope","number":"1.1","title":"Organize Domain Modules and Shared Backend Code by Scope","titleKo":"도메인 모듈과 공용 백엔드 코드를 스코프로 구성","impact":"HIGH","impactDescription":"도메인 소유와 진짜 공용 백엔드 코드를 분리해 모듈이 기본적으로 지역에 머물게 함","appliesWhen":"","tags":["modules","folders","shared-code"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"naming","prose":["하나의 도메인은 하나의 모듈 폴더로 구성하고,","`_shared/` 같은 공유 디렉터리에는 2개 이상의 모듈에서 함께 쓰는 코드만 둡니다.","한 모듈에서만 쓰이는 Guard, Pipe, Decorator, 상수는 해당 모듈 폴더 안에 유지합니다."],"examples":[{"kind":"incorrect","label":"공유 여부가 불분명한 코드가 전역으로 올라감","blocks":[{"lang":"txt","code":"\u003csrc-root>/\n  shared/\n    users.guard.ts\n    users.constants.ts\n  users.service.ts"}]},{"kind":"correct","label":"도메인과 공유 범위를 분리","blocks":[{"lang":"txt","code":"\u003csrc-root>/\n  users/\n    dto/\n      create-user.dto.ts\n      user-response.dto.ts\n    users.module.ts\n    users.controller.ts\n    users.service.ts\n    users.constants.ts\n  \u003cshared-dir>/\n    constants.ts\n    dto/\n  prisma/\n    prisma.module.ts\n    prisma.service.ts"}]}]},{"skill":"nestjs","id":"naming-place-shared-and-module-local-constants-by-scope","number":"1.2","title":"Place Shared and Module-local Constants by Scope","titleKo":"공용·모듈 전용 상수를 스코프에 맞게 배치","impact":"MEDIUM-HIGH","impactDescription":"controller·service 파일이 소유가 불분명한 상수의 임시 보관소가 되는 것을 막음","appliesWhen":"","tags":["constants","scope","modules"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"naming","prose":["ownership)**","","2개 이상의 모듈에서 공유되는 상수는 `\u003csrc-root>/\u003cshared-dir>/constants.ts`에 모으고,","특정 도메인 모듈에서만 쓰이는 상수는 해당 모듈의 `*.constants.ts` 파일에 둡니다.","Controller나 Service 파일에 공용 상수를 직접 선언하지 않습니다."],"examples":[{"kind":"incorrect","label":"Service 파일에 상수를 직접 선언","blocks":[{"lang":"ts","code":"const DEFAULT_PAGE_SIZE = 20;"}]},{"kind":"correct","label":"상수 소유 범위에 맞는 파일에서 읽음","blocks":[{"lang":"ts","code":"import {DEFAULT_PAGE_SIZE} from \"./users.constants\";"}]}]},{"skill":"nestjs","id":"naming-use-kebab-role-suffixed-nestjs-file-names","number":"1.3","title":"Use Kebab-case Filenames With Nest Role Suffixes","titleKo":"파일 이름은 kebab-case에 Nest 역할 접미사","impact":"HIGH","impactDescription":"파일을 열기 전에 파일명만으로 NestJS 파일의 목적이 드러나게 함","appliesWhen":"","tags":["naming","files","suffixes"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"naming","prose":["NestJS 파일명은 `kebab-case`를 사용하고 역할 suffix를 반드시 포함합니다.","변수, 함수, 메서드는 `camelCase`, 클래스와 타입, 인터페이스는 `PascalCase`,","상수는 `SCREAMING_SNAKE_CASE`를 유지해 파일명과 심볼 역할이 함께 읽히도록 합니다."],"examples":[{"kind":"incorrect","label":"파일 목적이나 심볼 규칙이 불분명함","blocks":[{"lang":"txt","code":"UsersService.ts\nusers.ts\nCreateUser.ts"}]},{"kind":"correct","label":"역할 suffix와 일관된 심볼 규칙을 유지","blocks":[{"lang":"txt","code":"users.module.ts\nusers.controller.ts\nusers.service.ts\ncreate-user.dto.ts\nuser-response.dto.ts"}]}]},{"skill":"nestjs","id":"layers-keep-controllers-thin-and-boundary-focused","number":"2.1","title":"Keep Controllers Thin and Boundary-focused","titleKo":"controller는 얇게, 경계에만 집중","impact":"CRITICAL","impactDescription":"service 에 속한 도메인 로직·영속 호출·응답 가공을 controller 가 흡수하는 것을 막음","appliesWhen":"","tags":["controllers","layering","boundaries"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"layers","prose":["belongs in services)**","","Controller는 요청 수신, 입력 검증 위임, 응답 반환만 담당합니다.","비즈니스 로직, Prisma 호출, 조건 분기, 응답 shape 조립은 Controller에 두지 않고 Service로 위임하며, `@Body()`,","`@Param()`, `@Query()`는 DTO나 변환된 타입으로 받습니다."],"examples":[{"kind":"incorrect","label":"Controller에 Prisma 호출과 비즈니스 로직이 들어감","blocks":[{"lang":"ts","code":"@Controller(\"users\")\nexport class UsersController {\n\tconstructor(private readonly prisma: PrismaService) {}\n\n\t@Get(\":id\")\n\tasync findOne(@Param(\"id\") id: string) {\n\t\tconst user = await this.prisma.user.findUnique({where: {id: Number(id)}});\n\n\t\tif (!user) {\n\t\t\tthrow new NotFoundException();\n\t\t}\n\n\t\treturn {...user, displayName: `${user.firstName} ${user.lastName}`};\n\t}\n}"}]},{"kind":"correct","label":"Controller는 경계만 담당하고 Service로 위임","blocks":[{"lang":"ts","code":"@Controller(\"users\")\nexport class UsersController {\n\tconstructor(private readonly usersService: UsersService) {}\n\n\t@Get(\":id\")\n\tasync findOne(@Param(\"id\", ParseIntPipe) id: number) {\n\t\treturn this.usersService.findOneOrThrow(id);\n\t}\n}"}]}]},{"skill":"nestjs","id":"layers-keep-services-responsible-for-domain-rules-and-prisma","number":"2.2","title":"Keep Services Responsible for Domain Rules and Prisma","titleKo":"도메인 규칙과 Prisma는 service가 책임","impact":"CRITICAL","impactDescription":"비즈니스 규칙·트랜잭션 조율·영속 접근을 그것을 소유하도록 설계된 계층에 둠","appliesWhen":"","tags":["services","prisma","domain-logic"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"layers","prose":["designed to own them)**","","Service는 비즈니스 로직, 도메인 규칙, 트랜잭션 조율을 담당하고 `PrismaService`를 직접 주입받아 데이터에 접근합니다.","다른 도메인 데이터가 필요하면 해당 도메인의 Service를 주입해 사용하고,","리소스 부재나 도메인 위반 예외도 Service에서 결정합니다."],"examples":[{"kind":"incorrect","label":"도메인 규칙이 Controller나 외부 레이어에 흩어짐","blocks":[{"lang":"ts","code":"@Controller(\"users\")\nexport class UsersController {\n\tconstructor(private readonly prisma: PrismaService) {}\n\n\t@Post()\n\tasync create(@Body() dto: CreateUserDto) {\n\t\tif (await this.prisma.user.findUnique({where: {email: dto.email}})) {\n\t\t\tthrow new ConflictException();\n\t\t}\n\n\t\treturn this.prisma.user.create({data: dto});\n\t}\n}"}]},{"kind":"correct","label":"Service가 규칙과 Prisma 접근을 함께 소유","blocks":[{"lang":"ts","code":"@Injectable()\nexport class UsersService {\n\tconstructor(private readonly prisma: PrismaService) {}\n\n\t/**\n\t * @api 사용자 단건 조회 - 미존재 시 NotFoundException 발생\n\t */\n\tasync findOneOrThrow(id: number): Promise\u003cSafeUser> {\n\t\tconst user = await this.prisma.user.findUnique({where: {id}});\n\n\t\tif (!user) {\n\t\t\tthrow new NotFoundException(`User ${id} not found`);\n\t\t}\n\n\t\treturn user;\n\t}\n}"}]}]},{"skill":"nestjs","id":"layers-preserve-one-way-dependencies-through-services","number":"2.3","title":"Preserve One-way Dependencies Through Services","titleKo":"의존은 service를 거쳐 한 방향으로","impact":"HIGH","impactDescription":"service 경계를 우회해 백엔드 변경 영향을 추론하기 어렵게 만드는 계층 간 지름길을 막음","appliesWhen":"","tags":["dependencies","layering","services"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"layers","prose":["reason about)**","","의존 방향은 `Controller -> Service -> Prisma` 단방향만 허용합니다.","Service가 Controller를 참조하는 것을 금지하고, 다른 도메인의 데이터가 필요하면","Prisma를 우회해 직접 접근하지 말고 해당 도메인 Service를 통해 연결합니다."],"examples":[{"kind":"incorrect","label":"Controller가 Prisma에 직접 접근해 서비스 경계를 우회","blocks":[{"lang":"ts","code":"@Controller(\"users\")\nexport class UsersController {\n\tconstructor(private readonly prisma: PrismaService) {}\n\n\t@Post()\n\tasync create(@Body() dto: CreateUserDto) {\n\t\treturn this.prisma.user.create({data: dto});\n\t}\n}"}]},{"kind":"correct","label":"Controller에서 Service를 통해 한 방향으로 흐름 유지","blocks":[{"lang":"ts","code":"@Controller(\"users\")\nexport class UsersController {\n\tconstructor(private readonly usersService: UsersService) {}\n\n\t@Post()\n\tasync create(@Body() dto: CreateUserDto) {\n\t\treturn this.usersService.create(dto);\n\t}\n}"}]}]},{"skill":"nestjs","id":"dto-document-custom-backend-types-and-parameter-objects","number":"3.1","title":"Document Custom Backend Types and Parameter Objects","titleKo":"커스텀 백엔드 타입과 매개변수 객체 문서화","impact":"MEDIUM-HIGH","impactDescription":"메서드 본문을 훑지 않고도 백엔드 전용 계약과 매개변수 객체를 이해할 수 있게 함","appliesWhen":"","tags":["types","jsdoc","params"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"dto","prose":["bodies)**","","Prisma 생성 타입이 아닌 커스텀 `type`, `interface`, 파라미터 객체에는 JSDoc을 작성합니다.","객체형 계약은 헤더에 `@summary`, 각 필드 바로 위 `@field`를 사용하고, 관련 파일 최상단에 모아 배치합니다."],"examples":[{"kind":"incorrect","label":"커스텀 계약 설명이 없거나 헤더에 `@property`를 몰아씀","blocks":[{"lang":"ts","code":"/**\n * @summary 페이지네이션 조회 공통 파라미터\n * @property page 페이지 번호\n */\ninterface PaginationParams {\n\tpage: number;\n\tlimit: number;\n}"}]},{"kind":"correct","label":"헤더 `@summary` + 필드별 `@field`를 사용","blocks":[{"lang":"ts","code":"/**\n * @summary 페이지네이션 조회 공통 파라미터\n */\ninterface PaginationParams {\n\t/**\n\t * @field 1부터 시작하는 페이지 번호\n\t */\n\tpage: number;\n\t/**\n\t * @field 페이지당 항목 수\n\t */\n\tlimit: number;\n}"}]}]},{"skill":"nestjs","id":"dto-expose-response-fields-explicitly","number":"3.2","title":"Expose Response DTO Fields Explicitly","titleKo":"응답 DTO 필드는 명시적으로 노출","impact":"HIGH","impactDescription":"백엔드 응답이 기본적으로 Prisma 모델 전체나 민감 필드를 흘리는 것을 막음","appliesWhen":"","tags":["dto","response","security"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"dto","prose":["응답 DTO는 클라이언트에 노출할 필드를 명시적으로 선언하고, Prisma 모델 전체를 그대로 반환하지 않습니다.","`@Exclude()`와 `@Expose()`를 사용해 민감 필드를 응답에서 제거합니다."],"examples":[{"kind":"incorrect","label":"응답에 모델 전체를 그대로 노출","blocks":[{"lang":"ts","code":"return this.prisma.user.findUnique({where: {id}});"}]},{"kind":"correct","label":"응답 DTO가 노출 필드를 명시적으로 소유","blocks":[{"lang":"ts","code":"@Exclude()\nexport class UserResponseDto {\n\t@Expose()\n\tid: number;\n\n\t@Expose()\n\temail: string;\n\n\t@Expose()\n\tname: string;\n\n\t@Expose()\n\tcreatedAt: Date;\n\n\tpassword: string;\n}"}]}]},{"skill":"nestjs","id":"dto-replace-enum-with-as-const-except-prisma-enums","number":"3.3","title":"Replace Local `enum` With `as const` Except Prisma Enums","titleKo":"Prisma enum 외에는 enum 대신 as const","impact":"MEDIUM-HIGH","impactDescription":"생성된 Prisma enum 은 정본으로 남기면서 지역 런타임 값은 가볍게 유지함","appliesWhen":"","tags":["enum","as-const","prisma"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"dto","prose":["source of truth)**","","로컬 TypeScript `enum` 대신 객체 리터럴과 `as const`를 사용합니다.","다만 Prisma 스키마에서 생성된 enum은 `@prisma/client`에서 그대로 import해 source of truth를 유지합니다."],"examples":[{"kind":"incorrect","label":"로컬 enum을 직접 선언","blocks":[{"lang":"ts","code":"enum UserRole {\n\tADMIN = \"ADMIN\",\n\tMEMBER = \"MEMBER\",\n}"}]},{"kind":"correct","label":"로컬 값은 `as const`, Prisma enum은 generated source 사용","blocks":[{"lang":"ts","code":"const USER_ROLE = {\n\tADMIN: \"ADMIN\",\n\tMEMBER: \"MEMBER\",\n} as const;\n\ntype UserRole = (typeof USER_ROLE)[keyof typeof USER_ROLE];"},{"lang":"ts","code":"import {Role} from \"@prisma/client\";"}]}]},{"skill":"nestjs","id":"dto-reuse-prisma-generated-types-before-new-backend-types","number":"3.4","title":"Reuse Prisma Generated Types Before New Backend Types","titleKo":"새 백엔드 타입 전에 Prisma 생성 타입 재사용","impact":"HIGH","impactDescription":"Prisma 가 이미 같은 구조 계약을 소유할 때 백엔드 타입이 중복 선언되는 것을 막음","appliesWhen":"","tags":["prisma","types","reuse"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"dto","prose":["Prisma가 생성한 타입이 이미 존재하면 동일하거나 유사한 구조의 별도 타입 선언을 만들지 않습니다.","필요한 경우 Prisma 타입을 직접 참조하거나 `Pick`/`Omit`으로 파생하고,","구조 중복이 아니라 의미 차이가 실제로 있을 때만 신규 타입을 선언합니다."],"examples":[{"kind":"incorrect","label":"Prisma 타입과 같은 구조를 다시 선언","blocks":[{"lang":"ts","code":"interface CreateUserParams {\n\temail: string;\n\tpassword: string;\n\tname: string;\n}"}]},{"kind":"correct","label":"Prisma 생성 타입을 직접 재사용","blocks":[{"lang":"ts","code":"import type {Prisma, User} from \"@prisma/client\";\n\ntype CreateUserParams = Prisma.UserCreateInput;\ntype UserData = User;\ntype SafeUser = Omit\u003cUser, \"password\">;"}]}]},{"skill":"nestjs","id":"dto-validate-request-dtos-with-validator-transformer-and-swagger","number":"3.5","title":"Validate Request DTOs With Validator, Transformer, and Swagger","titleKo":"요청 DTO는 validator·transformer·Swagger로 검증","impact":"HIGH","impactDescription":"검증·변환·API 문서를 DTO 한곳에 모아 요청 계약을 명시적으로 유지함","appliesWhen":"","tags":["dto","validation","swagger"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"dto","prose":["DTO)**","","요청 DTO는 `class-validator` 데코레이터로 유효성 검증을 선언하고,","필요할 때 `class-transformer`로 타입 변환을 명시합니다.","각 필드는 `@ApiProperty()`로 Swagger 문서를 유지하고, DTO 파일명은 `\u003caction>-\u003cdomain>.dto.ts` 규칙을 따릅니다."],"examples":[{"kind":"incorrect","label":"요청 구조가 검증과 문서화 없이 흩어짐","blocks":[{"lang":"ts","code":"export class CreateUserDto {\n\temail: string;\n\tpassword: string;\n\tname: string;\n}"}]},{"kind":"correct","label":"DTO가 검증, 변환, 문서화를 함께 소유","blocks":[{"lang":"ts","code":"export class CreateUserDto {\n\t@ApiProperty({example: \"user@example.com\"})\n\t@IsEmail()\n\temail: string;\n\n\t@ApiProperty({example: \"password123\", minLength: 8})\n\t@IsString()\n\t@MinLength(8)\n\tpassword: string;\n\n\t@ApiProperty({example: \"홍길동\"})\n\t@IsString()\n\tname: string;\n}"}]}]},{"skill":"nestjs","id":"methods-throw-context-rich-nestjs-exceptions","number":"4.1","title":"Throw Context-rich NestJS Exceptions","titleKo":"맥락이 담긴 NestJS 예외를 던지기","impact":"HIGH","impactDescription":"알맞은 NestJS 예외 타입과 실제 도메인 맥락으로 백엔드 실패를 진단 가능하게 함","appliesWhen":"","tags":["exceptions","errors","diagnostics"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"methods","prose":["NestJS 내장 예외 클래스(`NotFoundException`, `BadRequestException`, `ForbiddenException` 등)를 사용하고,","메시지에는 도메인 이름이나 식별자 같은 맥락 정보를 포함합니다.","예외를 무음 처리하거나 `'Not found'` 같은 빈약한 메시지를 남기지 않습니다."],"examples":[{"kind":"incorrect","label":"맥락 없는 메시지와 무음 처리","blocks":[{"lang":"ts","code":"throw new NotFoundException(\"Not found\");\n\ntry {\n\tawait this.prisma.user.delete({where: {id}});\n} catch (error) {}"}]},{"kind":"correct","label":"맥락과 도메인 규칙을 드러내는 예외 사용","blocks":[{"lang":"ts","code":"throw new NotFoundException(`User ${id} not found`);\n\nif (user.role !== USER_ROLE.ADMIN) {\n\tthrow new ForbiddenException(\"관리자 권한이 필요합니다.\");\n}"}]}]},{"skill":"nestjs","id":"methods-use-async-await-and-mark-intentional-fire-and-forget","number":"4.2","title":"Use Async/Await and Mark Intentional Fire-and-forget Calls","titleKo":"async/await 쓰고 의도적 fire-and-forget은 표시","impact":"HIGH","impactDescription":"비동기 백엔드 흐름을 읽을 수 있게 유지하고 의도적으로 await 하지 않은 부수효과를 드러냄","appliesWhen":"","tags":["async","await","side-effects"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"methods","prose":["비동기 처리는 `async/await`를 기본으로 사용하고 `.then()` 체이닝은 피합니다.","`void` 반환 비동기 호출은 반드시 `await`하거나 `void` 키워드로 fire-and-forget 의도를 명시합니다.","","**Incorrect (`.then()` 체이닝과 숨은 비동기 호출):**","",{"lang":"ts","code":"this.prisma.user.findUnique({where: {id}}).then((user) => {\n\treturn user;\n});\n\nthis.eventsService.emit(\"user.created\", user);"}],"examples":[{"kind":"correct","label":"`await` 또는 `void`로 의도를 드러냄","blocks":[{"lang":"ts","code":"await this.eventsService.emit(\"user.created\", user);\n\nvoid this.eventsService.emit(\"user.created\", user);"}]}]},{"skill":"nestjs","id":"methods-use-nestjs-class-methods-and-explicit-async-returns","number":"4.3","title":"Use NestJS Class Methods and Explicit Async Return Types","titleKo":"NestJS 클래스 메서드와 명시적 async 반환 타입","impact":"MEDIUM-HIGH","impactDescription":"백엔드 클래스 API 를 관례대로 두면서 구현을 열지 않고도 async 계약을 읽게 함","appliesWhen":"","tags":["methods","async","return-types"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"methods","prose":["opening implementations)**","","클래스 메서드는 NestJS 관례에 따라 일반 메서드 선언을 사용하고, 클래스 외부 유틸 함수는 화살표 함수를 기본으로 합니다.","복잡한 함수나 `async` 함수는 `Promise\u003cT>` 반환 타입을 명시해 서비스 계약이 시그니처에서 드러나게 합니다."],"examples":[{"kind":"incorrect","label":"반환 계약이 불분명하거나 관례가 섞임","blocks":[{"lang":"ts","code":"@Injectable()\nexport class UsersService {\n\tfindOneOrThrow = async (id: number) => {\n\t\treturn this.prisma.user.findUnique({where: {id}});\n\t};\n}"}]},{"kind":"correct","label":"NestJS 메서드 스타일과 명시적 반환 타입 사용","blocks":[{"lang":"ts","code":"@Injectable()\nexport class UsersService {\n\tasync findOneOrThrow(id: number): Promise\u003cSafeUser> {\n\t\tconst user = await this.prisma.user.findUnique({where: {id}});\n\n\t\tif (!user) {\n\t\t\tthrow new NotFoundException(`User ${id} not found`);\n\t\t}\n\n\t\treturn user;\n\t}\n}\n\nexport const buildPaginationMeta = (total: number, params: PaginationParams) => {\n\tconst {page, limit} = params;\n\treturn {total, page, limit, totalPages: Math.ceil(total / limit)};\n};"}]}]},{"skill":"nestjs","id":"docs-keep-inline-comments-for-domain-rules-and-library-caveats","number":"5.1","title":"Keep Inline Comments for Domain Rules and Library Caveats","titleKo":"인라인 주석은 도메인 규칙과 라이브러리 예외에만","impact":"MEDIUM","impactDescription":"잘못 읽거나 실수로 지우기 쉬운 백엔드 제약에만 인라인 주석을 남겨둠","appliesWhen":"","tags":["comments","inline","domain-rules"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"docs","prose":["accidentally remove)**","","함수 본문 내부에서는 JSDoc 블록 주석을 사용하지 않고, `//` 주석은 도메인 규칙, 정합성 제약, Prisma 동작 제약,","트랜잭션 순서처럼 없으면 오해될 수 있는 내용에만 사용합니다.","변수명 그대로 반복하는 설명은 남기지 않습니다."],"examples":[{"kind":"incorrect","label":"변수명 반복이나 자명한 설명","blocks":[{"lang":"ts","code":"const userId = params.id; // id 저장"}]},{"kind":"correct","label":"도메인 규칙이나 라이브러리 제약을 드러냄","blocks":[{"lang":"ts","code":"// 소프트 삭제된 사용자는 목록 조회에서 제외하되 단건 조회는 허용한다.\nconst where = includeDeleted ? {id} : {id, deletedAt: null};"}]}]},{"skill":"nestjs","id":"docs-require-jsdoc-on-service-hooks-and-boundary-methods","number":"5.2","title":"Require JSDoc on Service Hooks and Boundary Methods","titleKo":"service hook과 경계 메서드에는 JSDoc 필수","impact":"MEDIUM-HIGH","impactDescription":"구현 세부를 뜯어보기 전에 중요한 백엔드 실행 경계를 검색할 수 있게 함","appliesWhen":"","tags":["jsdoc","services","lifecycle"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"docs","prose":["details)**","","Service public 메서드, Prisma 접근이나 외부 API 호출 블록, NestJS 생명주기 훅, 커스텀 `type`/`interface`,","Guard/Interceptor/Pipe 핵심 메서드에는 예외 없이 JSDoc을 작성합니다.","Controller는 Swagger 데코레이터가 충분하면 JSDoc을 생략할 수 있습니다.","annotation 태그 선택은 companion skill인 `convention-typescript`의 표준인 e":["end)**","","unit test에서는 DB, 외부 API, JWT, cache 같은 외부 의존성을 mock 처리하고","Service public 메서드의 핵심 분기와 예외를 검증합니다.","e2e test에서는 `AppModule` 또는 필요한 실제 모듈 조합을 띄우고, `supertest`로 HTTP 진입점부터 ValidationPipe, Filter,","Service, Prisma, DB 반영까지 실제 wiring을 검증합니다."],"examples":[{"kind":"incorrect","label":"unit에서 실제 DB를 띄우거나 e2e에서 핵심 wiring을 검증하지 않음","blocks":[{"lang":"txt","code":"- unit test에서 실제 PostgreSQL 연결\n- e2e test는 상태 코드만 보고 DB 반영 결과는 확인하지 않음"}]},{"kind":"correct","label":"레벨에 맞는 의존 전략을 사용","blocks":[{"lang":"ts","code":"describe(\"AuthService\", () => {\n\tit(\"login - invalid password increases lockCount\", async () => {\n\t\t// unit: 외부 의존성은 jest.fn()으로 대체\n\t});\n});"},{"lang":"ts","code":"// e2e: supertest로 실제 HTTP 요청 + DB 반영 결과 검증\nawait request(app.getHttpServer()).post(\"/users\").send(payload).expect(201);"}]}]},{"skill":"nestjs","id":"testing-place-test-files-by-runtime-scope","number":"6.3","title":"Place Test Files by Runtime Scope","titleKo":"테스트 파일은 런타임 스코프에 맞게 배치","impact":"HIGH","impactDescription":"service 인접 단위 테스트와 최상위 HTTP e2e 테스트를 분리해 테스트 소유를 분명히 함","appliesWhen":"","tags":["test-files","placement","runtime-scope"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"testing","prose":["tests)**","","Service unit test는 대상 파일 옆의 `*.service.spec.ts`로 두고,","HTTP e2e test는 `test/` 아래 `\u003cdomain>.e2e-spec.ts`로 둡니다.","테스트 파일명은 대상과 범위가 즉시 드러나야 하며, unit과 e2e를 같은 위치나 같은 이름 패턴으로 섞지 않습니다."],"examples":[{"kind":"incorrect","label":"범위와 대상이 드러나지 않는 배치","blocks":[{"lang":"txt","code":"src/\n  auth/\n    auth.test.ts\ntest/\n  test.ts"}]},{"kind":"correct","label":"런타임 범위에 따라 배치","blocks":[{"lang":"txt","code":"src/\n  auth/\n    auth.service.ts\n    auth.service.spec.ts\n\ntest/\n  auth.e2e-spec.ts"}]}]},{"skill":"nestjs","id":"testing-separate-service-unit-tests-from-http-e2e-tests","number":"6.4","title":"Separate Service Unit Tests From HTTP E2E Tests","titleKo":"service 단위 테스트와 HTTP e2e 테스트 분리","impact":"CRITICAL","impactDescription":"비즈니스 로직과 전체 배선을 다른 테스트 층위에 배정해 백엔드 실패를 진단 가능하게 함","appliesWhen":"","tags":["unit-tests","e2e","levels"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"testing","prose":["test levels)**","","테스트는 `unit test`와 `e2e test`를 기본 축으로 구분합니다.","unit test는 Service 단위의 비즈니스 로직 검증을 담당하고, e2e test는 HTTP 요청부터 ValidationPipe, Filter, Service,","Prisma, DB까지의 연결을 검증합니다.","특별한 이유가 없으면 controller 전용 spec보다 service unit test와 HTTP e2e test를 우선합니다."],"examples":[{"kind":"incorrect","label":"controller spec과 service logic test가 뒤섞임","blocks":[{"lang":"txt","code":"- Controller 전용 spec을 기본값으로 만들고\n- Service 분기 테스트는 생략\n- HTTP e2e는 없음"}]},{"kind":"correct","label":"레벨별 목적을 분명히 분리","blocks":[{"lang":"txt","code":"- Service 비즈니스 분기/예외 -> unit test\n- HTTP 엔드포인트와 wiring -> e2e test\n- 단순 DTO/상수 파일 -> 테스트 강제 없음"}]}]},{"skill":"nestjs","id":"guardrails-review-banned-nestjs-shortcuts-before-finishing","number":"7.1","title":"Review Banned NestJS Shortcuts Before Finishing","titleKo":"마무리 전에 금지된 NestJS 지름길 점검","impact":"MEDIUM","impactDescription":"NestJS 레이어·계약·테스트 의미를 가장 자주 흐리는 지름길을 마무리 전에 잡음","appliesWhen":"","tags":["review","guardrails","banned-patterns"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"guardrails","prose":["the work is closed out)**","","마무리 전에 반복적으로 금지되는 NestJS 지름길을 다시 확인합니다.","Controller에서 Prisma 직접 호출, `.then()` 체이닝, void 반환 비동기 호출 방치, 모델 전체 응답 노출, 중복 타입 선언,","맥락 없는 예외 메시지, 무음 처리, 이유 없는 폴백 같은 패턴은 정리하고 끝냅니다."],"examples":[{"kind":"incorrect","label":"금지 패턴을 남긴 채 마무리","blocks":[{"lang":"ts","code":"@Controller(\"users\")\nexport class UsersController {\n\tconstructor(private readonly prisma: PrismaService) {}\n\n\t@Post()\n\tasync create(@Body() dto: CreateUserDto) {\n\t\treturn this.prisma.user.create({data: dto});\n\t}\n}\n\nconst userName = user?.name ?? \"\";\nthrow new NotFoundException(\"Not found\");"}]},{"kind":"correct","label":"레이어, 결측, 예외 맥락을 명시적으로 유지","blocks":[{"lang":"ts","code":"@Controller(\"users\")\nexport class UsersController {\n\tconstructor(private readonly usersService: UsersService) {}\n\n\t@Post()\n\tasync create(@Body() dto: CreateUserDto) {\n\t\treturn this.usersService.create(dto);\n\t}\n}\n\nif (!user) {\n\tthrow new NotFoundException(`User ${id} not found`);\n}"}]}]},{"skill":"playwright-test","id":"strategy-classify-e2e-tests-by-real-backend-and-auth","number":"1.1","title":"Classify E2E Tests by Real Backend and Auth Dependence","titleKo":"e2e는 실제 백엔드·인증 의존으로 분류","impact":"CRITICAL","impactDescription":"실제 백엔드·실제 인증·실제 라우팅이 테스트에 남아 있어야 한다고 요구해 e2e 의미를 엄격하게 유지함","appliesWhen":"","tags":["e2e","real-backend","auth"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"strategy","prose":["of the test)**","","실제 로그인, 실제 저장, 실제 권한 연결이 끊기면 테스트 의미가 사라지면 E2E입니다.","E2E는 실제 백엔드, 실제 인증 플로우, 실제 라우팅과 번들 결과를 사용하고,","핵심 엔드포인트를 `page.route()`로 가로채면서 E2E라고 부르지 않습니다."],"examples":[{"kind":"incorrect","label":"실제 시스템 경계를 우회하면서 E2E라고 분류","blocks":[{"lang":"txt","code":"- 로그인 성공 응답을 route mocking\n- 저장 API도 route mocking\n- 파일명은 *.e2e.spec.ts"}]},{"kind":"correct","label":"실제 백엔드와 인증이 의미의 일부일 때만 E2E","blocks":[{"lang":"txt","code":"- 파일 기준: \u003ctest-root>/**/*.e2e.spec.ts\n- 실제 백엔드 사용\n- 실제 인증 사용\n- 실제 저장/권한/라우팅 보증"}]}]},{"skill":"playwright-test","id":"strategy-classify-integration-tests-by-mocked-dependency-boundary","number":"1.2","title":"Classify Integration Tests by Mocked Dependency Boundary","titleKo":"integration은 모킹한 의존 경계로 분류","impact":"CRITICAL","impactDescription":"integration 테스트가 백엔드·인증을 모킹한 상태로 UI 와 route 동작을 검증한다는 점을 분명히 함","appliesWhen":"","tags":["integration","mocking","boundaries"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"strategy","prose":["boundaries)**","","주요 API를 mock해도 테스트 목적이 유지되면 Integration입니다.","Integration은 `page.route()` 기반 API mocking, 인증 상태 mocking, 초기 데이터 강제 주입을 허용하고, 폼 검증,","로딩/에러/빈 상태, 권한 redirect, search/pagination 동기화 같은 화면 조합 책임을 검증합니다."],"examples":[{"kind":"incorrect","label":"mock을 적극적으로 쓰면서도 E2E라고 부름","blocks":[{"lang":"txt","code":"- page.route()로 핵심 API 응답을 모두 가로채고\n- 권한 상태도 강제 주입하지만\n- 파일명은 *.e2e.spec.ts"}]},{"kind":"correct","label":"의존 경계가 mock이면 Integration으로 분류","blocks":[{"lang":"txt","code":"- 파일 기준: \u003ctest-root>/**/*.spec.ts\n- API mocking, auth mocking 허용\n- 목적: 상태 분기와 사용자 반응 검증"}]}]},{"skill":"playwright-test","id":"strategy-default-to-integration-plus-minimal-e2e","number":"1.3","title":"Default to Integration Plus Minimal Critical E2E","titleKo":"integration을 기본으로, 핵심 e2e만 최소로","impact":"HIGH","impactDescription":"느린 실제 시스템 테스트에서 모든 분기를 중복하지 않고 상태 커버리지를 넓게 유지함","appliesWhen":"","tags":["integration","e2e","strategy"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"strategy","prose":["새 기능은 기본적으로 Integration에서 상태 분기와 화면 반응을 먼저 잡고, 필요한 최소 핵심 사용자 흐름만 E2E로 남깁니다.","모든 상태 조합을 E2E로 복제하지 않고, 실제 끝까지 되는지 보장해야 하는 핵심 여정만 E2E에 둡니다."],"examples":[{"kind":"incorrect","label":"모든 상태 조합을 E2E로 복제","blocks":[{"lang":"txt","code":"- loading / error / empty / success 모두 E2E만 작성\n- 실제 로그인/실제 저장 여부와 무관한 분기까지 E2E로 중복"}]},{"kind":"correct","label":"상태 분기는 Integration, 핵심 여정은 최소 E2E","blocks":[{"lang":"txt","code":"- 폼 validation, 권한 redirect, empty/error/success 매트릭스 -> Integration\n- 실제 로그인 성공, 실제 저장 smoke -> E2E"}]}]},{"skill":"playwright-test","id":"strategy-keep-vitest-out-of-browser-ui-tests","number":"1.4","title":"Keep Vitest Out of Browser UI Tests by Default","titleKo":"브라우저 UI 테스트에는 기본적으로 Vitest를 쓰지 않기","impact":"MEDIUM-HIGH","impactDescription":"Playwright 가 이미 런타임 경계를 소유할 때 브라우저 UI 커버리지를 여러 도구로 쪼개지 않음","appliesWhen":"","tags":["vitest","ui-tests","tooling"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"strategy","prose":["boundary)**","","`vi`와 `Vitest`는 이 프로젝트의 기본 UI 테스트 도구가 아닙니다.","화면이나 라우트 기능 검증을 위해 Vitest를 기본 도입하지 않고,","DOM 없이 검증하는 편이 더 싼 순수 계산 로직이 충분히 생겼을 때만 별도 합의 후 검토합니다."],"examples":[{"kind":"incorrect","label":"브라우저 UI 검증에 Vitest를 기본 도입","blocks":[{"lang":"txt","code":"- 화면 상호작용 검증을 Vitest DOM 테스트로 기본 작성\n- 같은 UI 경계를 Playwright와 Vitest가 나눠 가짐"}]},{"kind":"correct","label":"브라우저 UI는 Playwright가 기본값","blocks":[{"lang":"txt","code":"- UI/라우트 기능 검증 -> Playwright\n- 순수 계산/formatter/helper만 정말 필요할 때 별도 도구 검토"}]}]},{"skill":"playwright-test","id":"strategy-never-mix-integration-and-e2e-in-one-file","number":"1.5","title":"Never Mix Integration and E2E in One File","titleKo":"integration과 e2e를 한 파일에 섞지 않기","impact":"HIGH","impactDescription":"spec 파일마다 런타임 경계를 하나로 배정해 테스트 의도와 실패 진단을 분명하게 유지함","appliesWhen":"","tags":["levels","files","boundaries"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"strategy","prose":["한 spec 파일 안에는 하나의 테스트 레벨만 둡니다.","Integration과 E2E는 도구가 아니라 의존 경계로 구분되므로,","한 파일 안에서 mock 기반 테스트와 실제 시스템 기반 테스트를 섞지 않습니다."],"examples":[{"kind":"incorrect","label":"한 파일 안에서 Integration과 E2E를 섞음","blocks":[{"lang":"ts","code":"test(\"mocked validation error\", async ({page}) => {\n\t// integration\n});\n\ntest(\"real login smoke\", async ({page}) => {\n\t// e2e\n});"}]},{"kind":"correct","label":"레벨마다 파일을 분리","blocks":[{"lang":"txt","code":"login.spec.ts\nlogin.e2e.spec.ts"}]}]},{"skill":"playwright-test","id":"strategy-use-playwright-as-the-single-browser-ui-tool","number":"1.6","title":"Use Playwright as the Single Browser UI Tool","titleKo":"브라우저 UI 도구는 Playwright 하나로","impact":"CRITICAL","impactDescription":"테스트 층위 전체에서 도구 하나와 상호작용 모델 하나를 써서 브라우저 UI 테스트를 일관되게 유지함","appliesWhen":"","tags":["playwright","tool-choice","consistency"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"strategy","prose":["levels)**","","브라우저 UI 테스트의 기본 도구는 `Playwright` 하나로 통일합니다.","같은 도구를 쓰더라도 Integration과 E2E 경계는 별도로 나누고, locator, assertion,","waiting 방식도 Playwright의 web-first 문법으로 통일합니다."],"examples":[{"kind":"incorrect","label":"브라우저 UI 테스트 도구가 섞임","blocks":[{"lang":"txt","code":"- 일부 화면은 Playwright\n- 일부 화면은 다른 브라우저 테스트 도구\n- 수준별 문법과 waiting 방식이 제각각"}]},{"kind":"correct","label":"브라우저 테스트는 Playwright 하나로 통일","blocks":[{"lang":"txt","code":"- Playwright Integration\n- Playwright E2E\n- locator / assertion / waiting 모두 Playwright web-first 패턴 사용"}]}]},{"skill":"playwright-test","id":"naming-place-specs-by-feature-path","number":"2.1","title":"Place Specs by Feature Path","titleKo":"spec은 기능 경로에 맞춰 배치","impact":"HIGH","impactDescription":"테스트 트리가 실제 route·기능 경로를 반영하게 해 테스트 소유를 찾을 수 있게 함","appliesWhen":"","tags":["spec-placement","features","paths"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"naming","prose":["테스트는 `\u003ctest-root>/\u003c기능 경로>/...` 아래에 두고, 디렉터리 구조는 실제 화면이나 도메인 구조를 따라갑니다.","그래야 feature를 찾을 때 구현 파일과 테스트 파일이 비슷한 경로 감각으로 탐색됩니다."],"examples":[{"kind":"incorrect","label":"기능 구조와 무관한 한 폴더에 spec를 몰아넣음","blocks":[{"lang":"txt","code":"\u003ctest-root>/\n  all/\n    login.spec.ts\n    members.spec.ts\n    project.spec.ts"}]},{"kind":"correct","label":"기능 경로를 반영해 배치","blocks":[{"lang":"txt","code":"\u003ctest-root>/login/login.spec.ts\n\u003ctest-root>/login/login.e2e.spec.ts\n\u003ctest-root>/project/members/members.form.{-$mid}.spec.ts\n\u003ctest-root>/project/members/members.e2e.spec.ts"}]}]},{"skill":"playwright-test","id":"naming-promote-shared-support-only-after-real-reuse","number":"2.2","title":"Promote Shared Support Only After Real Reuse","titleKo":"공용 support는 실제 재사용이 생긴 뒤에 승격","impact":"MEDIUM-HIGH","impactDescription":"여러 기능이 진짜로 필요해질 때까지 전역 헬퍼를 미뤄 support 계층을 규모에 맞게 유지함","appliesWhen":"","tags":["support","reuse","helpers"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"naming","prose":["need them)**","","전역 공용 helper는 `\u003ctest-support-path>`에 두되, 여러 feature가 함께 쓰는 인증, API seed, 공용 route setup만 올립니다.","특정 기능 하나에서만 쓰는 mock builder, request body helper, bootstrap wait는 spec 근처에 두고,","공용화는 두 개 이상 feature에서 반복될 때만 합니다."],"examples":[{"kind":"incorrect","label":"한 기능 전용 helper를 너무 빨리 전역 support로 올림","blocks":[{"lang":"txt","code":"\u003ctest-support-path>/members-form-mock.ts\n\u003ctest-support-path>/project-members-route-body.ts"}]},{"kind":"correct","label":"실제 재사용 전에는 feature 근처에 유지","blocks":[{"lang":"txt","code":"\u003ctest-support-path>/support.ts  // 인증, 공용 seed, 공용 route setup\n\u003ctest-root>/project/members/members.mock.ts  // feature local helper"}]}]},{"skill":"playwright-test","id":"naming-use-discoverable-spec-file-names","number":"2.3","title":"Use Discoverable Spec File Names","titleKo":"spec 파일 이름은 찾기 쉽게","impact":"HIGH","impactDescription":"기능과 층위를 파일명에 직접 담아 spec 의 목적을 검색 가능하게 유지함","appliesWhen":"","tags":["filenames","discovery","levels"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"naming","prose":["Integration은 `*.spec.ts`, E2E는 `*.e2e.spec.ts`를 사용하고, 파일명에는 라우트나 기능 이름이 바로 보이게 유지합니다.","`index.spec.ts`, `test.spec.ts`처럼 탐색이 어려운 이름은 금지합니다."],"examples":[{"kind":"incorrect","label":"파일명만 봐서는 기능과 레벨이 보이지 않음","blocks":[{"lang":"txt","code":"index.spec.ts\ntest.spec.ts\nmembers.test.ts"}]},{"kind":"correct","label":"기능과 레벨이 즉시 보임","blocks":[{"lang":"txt","code":"login.spec.ts\nlogin.e2e.spec.ts\nmembers.form.{-$mid}.spec.ts\nmembers.e2e.spec.ts"}]}]},{"skill":"playwright-test","id":"authoring-follow-the-integration-or-e2e-first-writing-sequence","number":"3.1","title":"Follow the Declared Integration or E2E Writing Sequence","titleKo":"정해진 integration·e2e 작성 순서를 따르기","impact":"MEDIUM","impactDescription":"동작을 쓰기 전에 테스트 층위와 의존 경계를 먼저 분류하게 해 혼란스러운 setup 을 줄임","appliesWhen":"","tags":["workflow","writing-order","setup"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"authoring","prose":["writing actions)**","","신규 테스트를 쓸 때는 먼저 Integration인지 E2E인지 결정하고, 그 레벨에 맞는 setup만 선언한 뒤,","사용자 locator로 action을 작성하고, web-first assertion으로 결과를 검증합니다.","마지막으로 정말 필요한 비동기 경계만 명시적으로 기다립니다."],"examples":[{"kind":"incorrect","label":"레벨 구분 없이 test body부터 쓰기 시작","blocks":[{"lang":"txt","code":"1. 일단 page.goto()부터 작성\n2. 중간에 route mocking과 실제 로그인 helper를 같이 추가\n3. 나중에 파일명을 *.spec.ts 또는 *.e2e.spec.ts로 고민"}]},{"kind":"correct","label":"레벨을 먼저 고정하고 그 경계에 맞게 작성","blocks":[{"lang":"txt","code":"1. 먼저 Integration인지 E2E인지 결정\n2. 의존 경계에 맞는 setup만 선언\n3. 사용자 locator로 action 작성\n4. web-first assertion으로 결과 검증\n5. 필요한 비동기 경계만 상태 기반으로 대기"}]}]},{"skill":"playwright-test","id":"authoring-isolate-and-clean-up-test-data","number":"3.2","title":"Isolate and Clean Up Test Data","titleKo":"테스트 데이터는 격리하고 정리하기","impact":"HIGH","impactDescription":"계정·id·seed 레코드 재사용으로 원격·공유 상태 브라우저 테스트가 충돌하는 것을 막음","appliesWhen":"","tags":["data-isolation","cleanup","seeds"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"authoring","prose":["records)**","","원격 백엔드를 건드리는 테스트는 고유 데이터로 실행하고 `try/finally`로 cleanup합니다.","`Date.now()`, worker suffix, 고유 login ID 같은 전략으로 충돌을 피하고,","공용 관리자 계정이나 고정 ID를 파괴적으로 수정하는 테스트는 만들지 않습니다."],"examples":[{"kind":"incorrect","label":"공유 데이터에 파괴적으로 의존","blocks":[{"lang":"txt","code":"- 공용 관리자 계정의 이름을 수정\n- 고정 멤버 ID를 테스트마다 덮어씀\n- cleanup 없이 seed 데이터만 생성"}]},{"kind":"correct","label":"고립된 데이터 생성과 명시적 정리","blocks":[{"lang":"ts","code":"const loginId = `pw.${Date.now()}@example.com`;\n\ntry {\n\tawait support.members.createMemberViaApi({loginId});\n\t// test body\n} finally {\n\tawait support.members.deleteMemberViaApi({loginId});\n}"}]}]},{"skill":"playwright-test","id":"authoring-keep-beforeeach-limited-and-visible","number":"3.3","title":"Keep `beforeEach` Limited and Visible","titleKo":"beforeEach는 최소로, 보이게","impact":"HIGH","impactDescription":"공용 setup 이 테스트의 실제 의존 경계나 핵심 단정을 숨기는 것을 막음","appliesWhen":"","tags":["beforeEach","setup","visibility"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"authoring","prose":["`beforeEach`에는 반복되는 인증 stub, 공용 이동 경로, 공용 seed 설치처럼 진짜 반복되는 준비만 둡니다.","핵심 assertion이나 테스트마다 다른 mock/seed를 `beforeEach`에 숨기지 않고, 각 테스트 본문에서 선언합니다."],"examples":[{"kind":"incorrect","label":"`beforeEach`에 테스트 의미를 숨김","blocks":[{"lang":"ts","code":"test.beforeEach(async ({page}) => {\n\tawait page.route(\"/api/members\", async (route) => {\n\t\tawait route.fulfill({body: JSON.stringify({list: []})});\n\t});\n\tawait expect(page.getByText(\"비어 있음\")).toBeVisible();\n});"}]},{"kind":"correct","label":"공통 준비만 `beforeEach`에 두고 목적별 설정은 test body에서 선언","blocks":[{"lang":"ts","code":"test.beforeEach(async ({page}) => {\n\tawait support.route.setupAuthenticatedSession(page);\n});\n\ntest(\"검색 결과가 비어 있으면 empty 상태를 보여준다\", async ({page}) => {\n\tawait page.route(\"/api/members\", async (route) => {\n\t\tawait route.fulfill({body: JSON.stringify({list: []})});\n\t});\n});"}]}]},{"skill":"playwright-test","id":"authoring-keep-one-behavior-per-test","number":"3.4","title":"Keep One Behavior Per Test","titleKo":"테스트 하나에 행위 하나","impact":"HIGH","impactDescription":"setup·동작·단정을 좁게 유지해 브라우저 실패가 여러 검사가 아니라 한 행위를 가리키게 함","appliesWhen":"","tags":["test-design","scope","assertions"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"authoring","prose":["unrelated checks)**","","한 테스트는 한 행동과 한 결과에 집중합니다.","기본 구조는 `Arrange -> Act -> Assert` 순서를 따르고, unrelated assertion을 한 테스트 안에 과도하게 나열하지 않습니다."],"examples":[{"kind":"incorrect","label":"여러 행동과 결과를 한 test에 밀어 넣음","blocks":[{"lang":"ts","code":"test(\"목록 조회와 생성과 삭제가 모두 동작한다\", async ({page}) => {\n\t// 너무 많은 행동과 assertion\n});"}]},{"kind":"correct","label":"행동과 결과를 하나로 좁힘","blocks":[{"lang":"ts","code":"test(\"저장 후 성공 토스트를 표시한다\", async ({page}) => {\n\t// 한 행동 + 한 핵심 결과\n});"}]}]},{"skill":"playwright-test","id":"authoring-name-tests-by-user-action-and-result","number":"3.5","title":"Name Tests by User Action and Result","titleKo":"테스트 이름은 사용자 동작과 결과로","impact":"MEDIUM-HIGH","impactDescription":"구현 세부나 setup 용어가 아니라 사용자 행위로 브라우저 테스트를 읽히게 함","appliesWhen":"","tags":["test-titles","naming","behavior"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"authoring","prose":["`test.describe()`는 기능 단위 이름을 쓰고, `test()` 제목은 “사용자 행동 + 기대 결과” 형태로 작성합니다.","구현 세부사항이나 내부 state가 아니라 사용자가 보는 결과가 읽혀야 합니다."],"examples":[{"kind":"incorrect","label":"구현 세부사항이나 setup 중심 제목","blocks":[{"lang":"ts","code":"test(\"calls members API and updates state\", async ({page}) => {});\ntest(\"test 1\", async ({page}) => {});"}]},{"kind":"correct","label":"행동과 결과가 함께 드러나는 제목","blocks":[{"lang":"ts","code":"test(\"저장 버튼을 누르면 성공 토스트를 표시한다\", async ({page}) => {});\ntest(\"권한이 없으면 멤버 화면 진입 시 로그인으로 이동한다\", async ({page}) => {});"}]}]},{"skill":"playwright-test","id":"authoring-write-comments-only-for-non-obvious-setup-boundaries","number":"3.6","title":"Write Comments Only for Non-obvious Setup Boundaries","titleKo":"주석은 자명하지 않은 setup 경계에만","impact":"MEDIUM","impactDescription":"자명한 Arrange/Act/Assert 서술 대신 그 setup 이 왜 있는지에 주석을 집중시킴","appliesWhen":"","tags":["comments","setup","helpers"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"authoring","prose":["steps)**","","테스트 주석은 한글로 작성하고, helper, seed/cleanup,","bootstrap wait처럼 목적이 바로 드러나지 않는 setup에만 왜 필요한지 짧게 남깁니다.","코드 그대로를 반복 설명하거나 Arrange/Act/Assert를 줄마다 해설하는 과한 단계 주석은 기본값으로 쓰지 않습니다."],"examples":[{"kind":"incorrect","label":"코드 그대로를 반복 설명","blocks":[{"lang":"ts","code":"// 저장 버튼을 클릭한다.\nawait page.getByRole(\"button\", {name: \"저장\"}).click();"}]},{"kind":"correct","label":"비자명한 경계에만 이유를 설명","blocks":[{"lang":"ts","code":"// bootstrap query가 끝나기 전에는 폼 필드가 비활성이라 안정적인 marker를 먼저 기다린다.\nawait expect(page.getByRole(\"heading\", {name: \"멤버 생성\"})).toBeVisible();"}]}]},{"skill":"playwright-test","id":"integration-cover-state-matrices-and-user-visible-results","number":"4.1","title":"Cover State Matrices and User-visible Results in Integration","titleKo":"integration은 상태 조합과 사용자에게 보이는 결과를 덮기","impact":"HIGH","impactDescription":"넓은 UI 상태 조합과 각 상태의 눈에 보이는 결과를 integration 테스트가 책임지게 함","appliesWhen":"","tags":["integration","states","results"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"integration","prose":["Integration은 상태 매트릭스를 책임집니다.","loading, empty, error, success, validation error, permission redirect, search/pagination 동기화를 우선 검토하고,","submit 계열 테스트는 request body 검증만으로 끝내지 말고 저장 후 URL, 토스트,","화면 전환 같은 사용자 결과도 함께 확인합니다."],"examples":[{"kind":"incorrect","label":"request body만 보고 사용자 결과는 보지 않음","blocks":[{"lang":"ts","code":"test(\"저장 요청 body를 보낸다\", async ({page}) => {\n\t// request payload만 확인하고 끝냄\n});"}]},{"kind":"correct","label":"상태와 사용자 결과를 함께 검증","blocks":[{"lang":"ts","code":"test(\"저장 후 목록 화면으로 이동하고 성공 토스트를 표시한다\", async ({page}) => {\n\t// payload 검증 + URL/토스트/화면 변화 확인\n});"}]}]},{"skill":"playwright-test","id":"integration-mock-only-the-endpoints-required-by-the-spec","number":"4.2","title":"Mock Only the Endpoints Required by the Spec","titleKo":"spec이 요구하는 엔드포인트만 모킹","impact":"HIGH","impactDescription":"시나리오에 중요한 의존만 모킹해 integration setup 을 읽을 수 있게 유지함","appliesWhen":"","tags":["integration","mocks","routes"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"integration","prose":["Integration에서 `page.route()`는 반드시 `page.goto()` 전에 등록하고, 해당 테스트 목적에 필요한 엔드포인트만 선언합니다.","인증이 필요하면 공용 authenticated session helper를 우선 사용하고,","어디서 무엇이 응답되는지 spec에서 바로 읽을 수 있어야 합니다."],"examples":[{"kind":"incorrect","label":"무관한 엔드포인트까지 넓게 mock","blocks":[{"lang":"ts","code":"test(\"멤버 검색\", async ({page}) => {\n\tawait page.route(\"**/*\", async (route) => {\n\t\tawait route.fulfill({body: \"{}\"});\n\t});\n});"}]},{"kind":"correct","label":"필요한 경계만 명시적으로 mock","blocks":[{"lang":"ts","code":"test(\"멤버 검색 결과를 표시한다\", async ({page}) => {\n\tawait support.route.setupAuthenticatedSession(page);\n\tawait page.route(\"**/api/members?keyword=kim\", async (route) => {\n\t\tawait route.fulfill({body: JSON.stringify({list: [{name: \"Kim\"}]})});\n\t});\n});"}]}]},{"skill":"playwright-test","id":"integration-wait-for-state-not-time","number":"4.3","title":"Wait for State, Not Time, in Integration Tests","titleKo":"시간이 아니라 상태를 기다리기","impact":"CRITICAL","impactDescription":"임의의 sleep 대신 관찰 가능한 상태를 기다려 integration 테스트를 결정적으로 유지함","appliesWhen":"","tags":["waiting","integration","stability"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"integration","prose":["Integration에서는 Suspense, bootstrap query,","lazy data 주입이 있는 화면일수록 관련 응답이나 안정적인 화면 marker가 생긴 뒤 assertion을 시작합니다.","`waitForTimeout()` 대신 URL, response, locator 상태 같은 관찰 가능한 상태를 기다립니다."],"examples":[{"kind":"incorrect","label":"시간 기반 안정화","blocks":[{"lang":"ts","code":"await page.waitForTimeout(1000);\nawait expect(page.getByText(\"완료\")).toBeVisible();"}]},{"kind":"correct","label":"상태를 기다린 뒤 검증","blocks":[{"lang":"ts","code":"await expect(page).toHaveURL(/members/);\nawait page.waitForResponse(/api\\/members/);\nawait expect(page.getByRole(\"heading\", {name: \"멤버\"})).toBeVisible();"}]}]},{"skill":"playwright-test","id":"e2e-avoid-destructive-shared-account-scenarios-and-parallel-collisions","number":"5.1","title":"Avoid Destructive Shared-account Scenarios and Parallel Collisions","titleKo":"공용 계정 파괴 시나리오와 병렬 충돌 피하기","impact":"CRITICAL","impactDescription":"실제 시스템 브라우저 테스트가 공용 계정을 망치거나 같은 원격 자원에서 경합하는 것을 막음","appliesWhen":"","tags":["e2e","shared-accounts","parallelism"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"e2e","prose":["resources)**","","공유 관리자 계정으로 실패 로그인, 잠금, 비밀번호 변경 같은 destructive 시나리오를 검증하지 않습니다.","같은 원격 자원이나 계정을 동시에 건드릴 수 있으면 serial 실행이나 고립된 데이터 전략을 우선하고,","안정성이 중요한 로컬 e2e 스위트는 직렬 실행을 기본으로 봅니다."],"examples":[{"kind":"incorrect","label":"공유 계정과 병렬 충돌을 무시","blocks":[{"lang":"txt","code":"- 공용 관리자 계정으로 틀린 비밀번호 시나리오 반복\n- 같은 멤버 레코드를 여러 worker가 동시에 수정"}]},{"kind":"correct","label":"공유 자원 충돌을 피하는 전략 사용","blocks":[{"lang":"txt","code":"- destructive 시나리오는 고립된 테스트 계정 사용\n- 같은 원격 자원 충돌 가능 시 serial 실행\n- 공용 계정은 smoke나 읽기 위주 검증에 한정"}]}]},{"skill":"playwright-test","id":"e2e-seed-with-api-helpers-and-clean-up-in-finally","number":"5.2","title":"Seed With API Helpers and Clean Up in `finally`","titleKo":"seed는 API 헬퍼로, 정리는 finally에서","impact":"HIGH","impactDescription":"브라우저 단계를 느린 seed 스크립트로 만들지 않고 e2e setup 을 빠르고 명시적으로 유지함","appliesWhen":"","tags":["e2e","seed","cleanup"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"e2e","prose":["e2e의 사전 상태가 필요하면 API helper로 준비하고 `finally`에서 cleanup합니다.","seed는 브라우저 UI로 장황하게 만들지 않되, 검증 대상 자체를 API로 우회하지는 않습니다."],"examples":[{"kind":"incorrect","label":"준비 단계까지 브라우저로 장황하게 생성하거나 cleanup을 빼먹음","blocks":[{"lang":"txt","code":"- 테스트 데이터 준비를 매번 브라우저 클릭으로 생성\n- 검증 대상 업 or /> : null}\n    \u003c/>\n  );\n}\n\nreturn (\n  \u003c>\n    \u003cUserName value={responseUserGetItemSuspense.data.name} />\n    \u003cUiButton disabled={mutationUserSave.isPending}>저장\u003c/UiButton>\n    {responseUserGetItemSuspense.isFetching ? \u003cRefreshIndicator /> : null}\n  \u003c/>\n);"}]}]},{"skill":"react","id":"data-name-query-and-mutation-bindings-consistently","number":"7.2","title":"Name Query and Mutation Bindings Consistently","titleKo":"query·mutation 바인딩 명명 규칙 통일","impact":"HIGH","impactDescription":"생성된 API hook과 로컬 바인딩을 쉽게 훑고 추적할 수 있게 합니다","appliesWhen":"React Query query·mutation hook의 로컬 binding을 추가·이름 변경하거나 역할이 드러나지 않는 별칭이 diff에 보인다.","tags":["state","query","mutation","naming"],"requiresSelected":["typescript/naming-use-consistent-file-and-symbol-naming","docs-require-jsdoc-on-key-declarations"],"reviewWith":["data-preserve-origin-chaining"],"sectionPrefix":"data","prose":["프로젝트가 이미 채택한 query/mutation hook 이름은 유지하되, 로컬 바인딩 접두사는 `response`와 `mutation`만 사용합니다.","codegen 여부와 무관하게 query는 `response...`,","mutation은 `mutation...`으로 맞춰야 화면 파일에서 역할과 오리진이 한눈에 보입니다."],"examples":[{"kind":"incorrect","label":"query와 mutation 바인딩 이름이 제각각임","blocks":[{"lang":"ts","code":"const list = useEntryListSuspense();\nconst removeApi = useEntryRemove();"}]},{"kind":"correct","label":"로컬 바인딩 접두사를 통일","blocks":[{"lang":"ts","code":"/**\n * @api entry 목록 조회 API\n */\nconst responseEntryListSuspense = useEntryListSuspense();\n\n/**\n * @api entry 삭제 API\n */\nconst mutationEntryRemove = useEntryRemove();"}]}]},{"skill":"react","id":"data-preserve-origin-chaining","number":"7.3","title":"Preserve Response and Store Origin in Wide Scopes","titleKo":"넓은 스코프에서의 응답·store 출처 보존","impact":"CRITICAL","impactDescription":"파일 전체에서 alias를 따라가지 않아도 값의 출처를 바로 알 수 있게 합니다","appliesWhen":"page·layout·screen 넓은 스코프에서 response·mutation·store를 구조분해하거나 별칭으로 끊고 원본 값 접근을 바꾼다.","tags":["state","origin","response","store"],"requiresSelected":[],"reviewWith":["screen-keep-derived-values-close"],"sectionPrefix":"data","prose":["페이지, 레이아웃, 화면 스코프에서는 `response...`, `mutation...`, `*Store` 원본을 유지합니다.","넓은 스코프의 구조분해와 별칭 상수는 값의 출처를 흐립니다.","","- 실제로 필요하면 handler나 effect 내부의 좁은 스코프에서만 제한적으로 구조분해합니다.","- `props`를 본문 첫 줄에서 구조분해하는 패턴만 예외입니다."],"examples":[{"kind":"incorrect","label":"넓은 스코프 구조분해로 출처가 흐려짐","blocks":[{"lang":"ts","code":"const { entries, selectedEntry } = responseEntryListSuspense.data;"}]},{"kind":"correct","label":"원본 체이닝으로 출처를 유지","blocks":[{"lang":"tsx","code":"\u003cUiList dataSource={responseEntryListSuspense.data.entries} />\n\u003cUiTable dataSource={responseEntryListSuspense.data.selectedEntry.fields} />"},{"lang":"ts","code":"/**\n * @watch 검색 응답이 비어 있을 때만 후속 동기화를 건너뜀\n */\nuseEffect(() => {\n  const { data, isFetching } = responseEntrySearchSuspense;\n\n  if (!isFetching && data.entries.length === 0) {\n    return;\n  }\n}, [responseEntrySearchSuspense]);"}]}]},{"skill":"react","id":"data-shape-query-data-with-select","number":"7.4","title":"Shape React Query Data in query.select","titleKo":"query.select를 통한 응답 데이터 가공","impact":"CRITICAL","impactDescription":"응답 변환을 fetch 경계 가까이에 두고 렌더 타임의 반복 매핑을 막습니다","appliesWhen":"서버 응답의 list·items·meta 등을 렌더에서 가공·반복 소비하거나 React Query `select`의 결과 shape를 추가·변경한다.","tags":["state","react-query","select"],"requiresSelected":["docs-require-jsdoc-on-key-declarations"],"reviewWith":["data-name-query-and-mutation-bindings-consistently","data-preserve-origin-chaining"],"sectionPrefix":"data","prose":["서버 응답 가공은 렌더링 본문이 아니라 `query.select`에서 처리합니다.","","- `data.list` 같은 원시 응답 구조를 화면 여러 군데에서 직접 해석하지 않습니다.","  도메인 의미가 드러나는 필드 이름으로 한 번 변환합니다.","- 여러 쿼리 데이터를 함께 가공해야 해도 먼저 `select`나 전용 hook 경계에서 풀 수 있는지 봅니다."],"examples":[{"kind":"incorrect","label":"응답 원형을 화면에서 직접 소비","blocks":[{"lang":"ts","code":"const items = responseEntryListSuspense.data.list;"}]},{"kind":"correct","label":"fetch 시점에 필요한 모양으로 변환","blocks":[{"lang":"ts","code":"/**\n * @api entry 목록 조회 API\n */\nconst responseEntryListSuspense = useEntryListSuspense({\n  query: {\n    select: (response) => ({\n      items: response.data.list,\n    }),\n  },\n});"}]}]},{"skill":"react","id":"state-calculate-derived-values-during-render","number":"8.1","title":"Calculate Derived Values During Rendering","titleKo":"파생 값의 렌더 중 계산","impact":"HIGH","impactDescription":"현재 입력에서 계산할 수 있는 값의 불필요한 state 동기화와 effect 기반 어긋남을 막습니다","appliesWhen":"현재 props·state·search·response에서 계산 가능한 값을 별도 state와 effect로 동기화하거나 그 동기화를 제거한다.","tags":["state","derived-state","render","effects"],"requiresSelected":["screen-keep-derived-values-close"],"reviewWith":[],"sectionPrefix":"state","prose":["현재 props, state, search, response에서 바로 계산할 수 있는 값은","`useEffect`와 `useState`로 다시 동기화하지 않습니다.","render 중에 계산하면 추가 렌더와 drift가 줄고, effect dependency도 억지로 늘어나지 않습니다.","","파생값은 render 중에 만들고 사용 지점 가까이에 둡니다.","배치 기준은 `screen-keep-derived-values-close`가 함께 정합니다."],"examples":[{"kind":"incorrect","label":"파생값을 effect로 다시 state에 동기화","blocks":[{"lang":"tsx","code":"const [selectedCount, setSelectedCount] = useState(0);\n\nuseEffect(() => {\n\tsetSelectedCount(selectedIds.length);\n}, [selectedIds]);"}]},{"kind":"correct","label":"render 중에 바로 계산","blocks":[{"lang":"tsx","code":"return \u003cSelectedCountBadge count={selectedIds.length} />;"}]}]},{"skill":"react","id":"state-choose-state-tools-by-source-of-truth","number":"8.2","title":"Choose State Tools by Source of Truth","titleKo":"source of truth 기준의 state 도구 선택","impact":"MEDIUM-HIGH","impactDescription":"로컬 UI state, 전역 client state, server state가 서로 섞이는 것을 막습니다","appliesWhen":"로컬 UI·전역 client·server 데이터를 새 state 도구로 옮기거나 서로 다른 source of truth 사이에 복제·동기화한다.","tags":["state","react-query","zustand","local-state"],"requiresSelected":[],"reviewWith":["state-store-derived-authority"],"sectionPrefix":"state","prose":["상태 도구는 값의 수명과 소유자를 기준으로 고릅니다.","","| 상태의 소유자 | 기본 도구 |","| --- | --- |","| 로컬 UI | `useState` 또는 `useReducer` |","| 전역 클라이언트 | `Zustand` |","| 서버 | `@tanstack/react-query` |","","이 기준으로 고르면 화면 파일이 더 읽기 쉬워지고 중복 동기화가 줄어듭니다.","","프로젝트가 이미 다른 전역 store나 server-state 도구를 표준으로 쓴다면 그것을 유지합니다.","`Zustand`나 `react-query`를 새로 들여오지 말고 source-of-truth 원칙만 지킵니다."],"examples":[{"kind":"incorrect","label":"서버 상태를 로컬 상태로 복제","blocks":[{"lang":"ts","code":"const responseUserGetItemSuspense = useUserGetItemSuspense();\nconst [userName, setUserName] = useState(responseUserGetItemSuspense.data.name);"}]},{"kind":"correct","label":"도구를 source of truth에 맞춤","blocks":[{"lang":"ts","code":"const [isOpen, setIsOpen] = useState(false);\nconst themeStore = useThemeStore();\n\n/**\n * @api 사용자 상세 조회 API\n */\nconst responseUserGetItemSuspense = useUserGetItemSuspense();"}]}]},{"skill":"react","id":"state-store-derived-authority","number":"8.3","title":"Store Shared Derived Decisions Only When They Are Truly Shared","titleKo":"공유 파생 결정의 선별적 store 승격","impact":"HIGH","impactDescription":"중복된 도메인 판별 휴리스틱이 여러 화면에 퍼지는 것을 막습니다","appliesWhen":"여러 화면·메뉴·route guard가 쓰는 권한·capability 같은 derived decision을 store에 저장·동기화하거나 단일 화면 값까지 store로 올린다.","tags":["state","zustand","derived-decisions"],"requiresSelected":[],"reviewWith":["docs-require-jsdoc-on-key-declarations"],"sectionPrefix":"state","prose":["여러 화면, 메뉴, route guard에서 반복해서 필요한 derived decision만 store에 승격합니다.","단일 화면에서 한두 번 읽는 query 필드까지 store로 복제하지 않습니다.","","store에 올리기로 했다면 문자열 비교나 도메인 판별은 bootstrap/layout 같은 한 경계에만 모으고,","화면은 `accessStore.canEditRecord` 같은 결과만 참조합니다.","Suspense query처럼 `onSuccess`가 없어서 동기화가 필요하다면 owner가 분명한 경계에서만 `useEffect` 또는","`useLayoutEffect`를 사용하고, selector 최적화는 실제로 필요한 경우에만 근거 주석과 함께 예외적으로 사용합니다."],"examples":[{"kind":"incorrect","label":"화면마다 판별을 반복하면서 단일 화면용 값을 store에도 복제","blocks":[{"lang":"ts","code":"const accessStore = useAccessStore();\nconst canEditRecord = responseRecordGetItemSuspense.data.ownerId === currentUserId;\n\nuseEffect(() => {\n  accessStore.setCanEditRecord(canEditRecord);\n}, [accessStore, canEditRecord]);"}]},{"kind":"correct","label":"공용 derived decision은 owner가 분명한 경계에서만 적재하고 화면은 결과만 참조","blocks":[{"lang":"ts","code":"const accessStore = useAccessStore();\n\nif (accessStore.canEditRecord) {\n  // ...\n}"},{"lang":"ts","code":"/**\n * @watch bootstrap capability 응답을 access store에 동기화\n */\nuseEffect(() => {\n  if (!responseAccessBootstrapSuspense.data) {\n    return;\n  }\n\n  accessStore.setCapabilities(responseAccessBootstrapSuspense.data.capabilities);\n}, [accessStore, responseAccessBootstrapSuspense.data]);"}]}]},{"skill":"react","id":"state-use-functional-setstate-updates","number":"8.4","title":"Use Functional setState Updates When Based on Previous State","titleKo":"이전 state 기반 갱신의 함수형 setState 사용","impact":"MEDIUM-HIGH","impactDescription":"다음 값이 현재 state에 의존할 때 stale closure 버그를 막습니다","appliesWhen":"다음 state가 현재 state에 의존하는 handler·async callback·반복 갱신에서 `setState` 호출 방식을 추가·변경한다.","tags":["state","setstate","closures","handlers"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"state","prose":["다음 state가 현재 state 값에 의존하면 직접 바깥 변수를 참조하지 말고 functional updater를 사용합니다.","특히 handler, async callback, 여러 번 연속 호출될 수 있는 갱신에서는 stale closure를 막는 데 중요합니다."],"examples":[{"kind":"incorrect","label":"현재 state를 바깥 closure에서 직접 읽음","blocks":[{"lang":"tsx","code":"const handleToggleUser = (userId: string) => {\n\tif (selectedUserIds.includes(userId)) {\n\t\tsetSelectedUserIds(selectedUserIds.filter((currentUserId) => currentUserId !== userId));\n\t\treturn;\n\t}\n\n\tsetSelectedUserIds([...selectedUserIds, userId]);\n};"}]},{"kind":"correct","label":"functional updater로 항상 최신 state를 기준으로 갱신","blocks":[{"lang":"tsx","code":"/**\n * @event 사용자 선택 목록 토글 처리\n */\nconst handleToggleUser = (userId: string) => {\n\tsetSelectedUserIds((currentUserIds) => {\n\t\tif (currentUserIds.includes(userId)) {\n\t\t\treturn currentUserIds.filter((currentUserId) => currentUserId !== userId);\n\t\t}\n\n\t\treturn [...currentUserIds, userId];\n\t});\n};"}]}]},{"skill":"react","id":"state-use-effectevent-for-non-reactive-effect-callbacks","number":"8.5","title":"Use useEffectEvent for Non-reactive Effect Callbacks","titleKo":"비반응성 effect 콜백의 useEffectEvent 사용","impact":"MEDIUM-HIGH","impactDescription":"최신 handler 로직은 읽으면서 effect는 실제 구독에만 반응하게 유지합니다","appliesWhen":"subscription effect가 최신 prop·state callback을 읽도록 ref 동기화 hack, dependency 재설치 또는 `useEffectEvent`를 추가·변경한다.","tags":["state","react19","useeffectevent","effects"],"requiresSelected":["docs-require-jsdoc-on-key-declarations"],"reviewWith":["events-run-user-actions-in-handlers-not-effects"],"sectionPrefix":"state","prose":["effect 안에서 최신 prop이나 state를 읽어야 하지만 그 값 변화가 subscription 재설치를","일으키면 안 되는 경우, ref hack 대신 `useEffectEvent`를 씁니다.","","event handler를 effect로 옮기라는 뜻이 아닙니다.","실제 구독·연결 effect 안에서만 쓰고, 클릭·제출 같은 사용자 액션은 named handler에 둡니다."],"examples":[{"kind":"incorrect","label":"최신 callback을 위해 ref를 수동 동기화","blocks":[{"lang":"tsx","code":"const onMessageRef = useRef(onMessage);\n\nuseEffect(() => {\n\tonMessageRef.current = onMessage;\n}, [onMessage]);\n\nuseEffect(() => {\n\tconst unsubscribe = socket.subscribe((message) => {\n\t\tonMessageRef.current(message);\n\t});\n\n\treturn unsubscribe;\n}, [socket]);"}]},{"kind":"correct","label":"non-reactive callback은 `useEffectEvent`로 분리","blocks":[{"lang":"tsx","code":"/**\n * @event socket message 수신 시 최신 onMessage 로직 실행\n */\nconst handleMessage = useEffectEvent((message: SocketMessage) => {\n\tonMessage(message);\n});\n\n/**\n * @watch socket subscription lifecycle 유지\n */\nuseEffect(() => {\n\tconst unsubscribe = socket.subscribe((message) => {\n\t\thandleMessage(message);\n\t});\n\n\treturn unsubscribe;\n}, [socket]);"}]}]},{"skill":"react","id":"perf-compiler-first-memoization","number":"9.1","title":"Prefer React Compiler Defaults Over Manual Memoization","titleKo":"수동 memoization 대신 React Compiler 기본값 사용","impact":"MEDIUM-HIGH","impactDescription":"검증된 효과 없이 노이즈만 늘리는 방어적 useMemo/useCallback을 막습니다","appliesWhen":"`useMemo`·`useCallback`을 추가·제거하거나 참조 동일성·실측 병목·무거운 deferred 계산을 이유로 수동 memoization을 검토한다.","tags":["state","react","memoization"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"perf","prose":["React Compiler가 처리하는 범위에서는 `useMemo`, `useCallback`을 기본적으로 쓰지 않습니다.","","허용하는 경우는 다음 셋뿐이며, 어느 경우든 바로 위에 한글 주석으로 이유를 남깁니다.","","- 외부 라이브러리가 참조 동일성에 민감할 때","- 병목이 실제로 확인됐을 때","- `useDeferredValue` 기준으로 무거운 파생 계산을 늦출 때","","마지막 경우에도 실제로 무거운 계산인지를 먼저 확인합니다."],"examples":[{"kind":"incorrect","label":"단순 가공을 관성적으로 memoization","blocks":[{"lang":"ts","code":"const columns = useMemo(() => buildColumns(response.data.columns), [response.data.columns]);"}]},{"kind":"correct","label":"필요할 때만 이유를 적고 사용","blocks":[{"lang":"ts","code":"// list library가 columns 참조 동일성을 요구하여 리렌더 폭증을 방지한다.\nconst columns = useMemo(() => buildColumns(response.data.columns), [response.data.columns]);"}]}]},{"skill":"react","id":"perf-use-lazy-state-initializers-for-expensive-defaults","number":"9.2","title":"Use Lazy State Initializers for Expensive Defaults","titleKo":"고비용 초기값의 lazy state initializer 사용","impact":"MEDIUM","impactDescription":"초기 state 계산 비용이 클 때 준비 작업이 렌더마다 반복되는 것을 막습니다","appliesWhen":"`useState` 초기값에 localStorage 파싱, 인덱스 생성, 큰 배열 정규화 같은 비용 있는 계산을 추가·변경한다.","tags":["state","usestate","initialization","performance"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"perf","prose":["`useState` 초기값이 localStorage 파싱, 인덱스 생성,","큰 배열 정규화처럼 무거운 계산이라면 값을 바로 넣지 말고 initializer 함수로 감쌉니다.","싼 literal이나 단순 prop passthrough까지 전부 함수형으로 감쌀 필요는 없습니다."],"examples":[{"kind":"incorrect","label":"비싼 초기화가 렌더마다 다시 평가됨","blocks":[{"lang":"tsx","code":"const [searchIndex] = useState(buildSearchIndex(entryList));\nconst [draftFilter] = useState(JSON.parse(localStorage.getItem(\"entry-filter\") ?? \"{}\"));"}]},{"kind":"correct","label":"비싼 초기화는 최초 렌더에서만 수행","blocks":[{"lang":"tsx","code":"const [searchIndex] = useState(() => buildSearchIndex(entryList));\nconst [draftFilter] = useState(() => {\n\tconst storedValue = localStorage.getItem(\"entry-filter\");\n\treturn storedValue ? JSON.parse(storedValue) : {};\n});"} ation`의 예외적 허용 사례입니다.","  deferred value 기준 재계산 비용이 실제로 크고,","  render마다 같은 작업을 반복하지 않으려는 목적이 분명할 때만 함께 씁니다."],"examples":[{"kind":"incorrect","label":"입력과 무거운 파생 렌더를 같은 값에 묶음","blocks":[{"lang":"tsx","code":"const [keyword, setKeyword] = useState(\"\");\nconst filteredRows = rows.filter((row) => fuzzyMatchRow(row, keyword));"}]},{"kind":"correct","label":"입력은 urgent, 무거운 파생 렌더는 deferred 값과 제한적인 memoization으로 계산","blocks":[{"lang":"tsx","code":"const [keyword, setKeyword] = useState(\"\");\nconst deferredKeyword = useDeferredValue(keyword);\n\nconst filteredRows = useMemo(() => {\n\treturn rows.filter((row) => fuzzyMatchRow(row, deferredKeyword));\n}, [deferredKeyword, rows]);"}]}]},{"skill":"react","id":"docs-document-compound-parts-with-part-and-description","number":"10.1","title":"Document Compound Parts with @part and @description","titleKo":"compound part의 @part·@description 문서화","impact":"MEDIUM","impactDescription":"compound 공개 part를 흩어진 선언이 아니라 이름 붙은 경계 하나로 훑을 수 있게 합니다","appliesWhen":"compound component의 exported public part·props interface·part 내부 handler를 추가·변경하거나 public part 문서를 수정한다.","tags":["docs","jsdoc","composition","compound-components"],"requiresSelected":["docs-require-jsdoc-on-key-declarations"],"reviewWith":[],"sectionPrefix":"docs","prose":["compound component가 public part를 노출하면 part 단위로 문서화합니다.","","작성 방식:","","- props `interface` 바로 위에 `@part`와 `@description`을 둡니다.","- component 선언은 그 `interface` 바로 아래에 둡니다.","- part field는 `@field`, part 내부 handler는 `@event`로 설명합니다.","- 단순 내부 wrapper에는 public part 문서를 만들지 않습니다."],"examples":[{"kind":"incorrect","label":"props와 component 설명이 분리되어 part 경계가 흐려짐","blocks":[{"lang":"tsx","code":"/**\n * @summary dialog header props\n */\ninterface DialogHeaderProps {\n\t/**\n\t * @field header 영역 안에 렌더할 자식 요소\n\t */\n\tchildren: ReactNode;\n}\n\n/**\n * @summary dialog 헤더 슬롯\n */\nconst DialogHeader = (props: DialogHeaderProps) => {\n\tconst { children } = props;\n\n\treturn \u003cheader className=\"dialog-head
