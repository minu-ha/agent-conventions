<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>팀 컨벤션 — 규칙 조회</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
h1, p, pre, button, input, table { margin: 0; padding: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

:root {
	--page: #eef1f3; --card: #fff;
	--ink: #14191c; --ink2: #47535a; --muted: #77848a; --faint: #98a3a8;
	--hair: #d8dee2; --soft: #e4e9ec; --edge: #c3ccd1; --hover: #e7ecef;
	--coral: #cc785c; --coral-dk: #a9583e;
	--bad: #a8392b; --good: #3f6f52; --tag-fg: #7d6a55;
	--code-bg: #fff; --code-fg: #14191c;
	--sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
	--mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* 디자인은 라이트를 기준으로 만들어졌다. 다크는 같은 토큰만 다시 정의해 얹는다. */
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--page: #101416; --card: #171c1f;
		--ink: #e6ebed; --ink2: #b3bec3; --muted: #8b979d; --faint: #6f7b81;
		--hair: #262d31; --soft: #222a2e; --edge: #3a444a; --hover: #1e2528;
		--coral: #d98a6c; --coral-dk: #e0a184;
		--bad: #dd8a7d; --good: #6bb890; --tag-fg: #b39a7c;
		--code-bg: #12171a; --code-fg: #e4eaec;
	}
}

:root[data-theme="dark"] {
	--page: #101416; --card: #171c1f;
	--ink: #e6ebed; --ink2: #b3bec3; --muted: #8b979d; --faint: #6f7b81;
	--hair: #262d31; --soft: #222a2e; --edge: #3a444a; --hover: #1e2528;
	--coral: #d98a6c; --coral-dk: #e0a184;
	--bad: #dd8a7d; --good: #6bb890; --tag-fg: #b39a7c;
	--code-bg: #12171a; --code-fg: #e4eaec;
}

body {
	min-height: 100vh; background: var(--page); color: var(--ink);
	font-family: var(--sans); font-size: 14px; line-height: 1.6;
	-webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; border-radius: 2px; }

/* ---------- header ---------- */
.hd { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--page) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--hair); }
.hd-in { max-width: 1320px; margin: 0 auto; padding: 0 28px; min-height: 64px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }
.brand-nm { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.brand-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .04em; padding-left: 4px; }

.sr { flex: 1 1 320px; display: flex; justify-content: center; min-width: 0; }
.sr-box { position: relative; width: 100%; max-width: 460px; }
.sr-ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; pointer-events: none; }
.sr-in {
	width: 100%; height: 34px; padding: 0 12px 0 30px;
	font-family: var(--mono); font-size: 12.5px; color: var(--ink);
	background: var(--card); border: 1px solid var(--hair); border-radius: 2px;
}
.sr-in::placeholder { color: var(--faint); }
.sr-in:focus { border-color: var(--coral); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--coral) 18%, transparent); }

.hd-r { flex: 0 0 auto; display: flex; align-items: center; gap: 14px; }
.cnt { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.btn { height: 32px; padding: 0 12px; font-size: 12.5px; color: var(--ink2); background: var(--card); border: 1px solid var(--hair); border-radius: 2px; white-space: nowrap; }
.btn:hover { border-color: var(--edge); color: var(--ink); }

/* ---------- shell ---------- */
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 28px; }
.pane { display: grid; grid-template-columns: 244px minmax(0, 1fr); gap: 40px; padding: 28px 0 96px; align-items: start; }
/* minmax(0,…): 1fr 이면 main 이 콘텐츠 min-width 아래로 줄지 못해 페이지가 가로로 늘어난다. */
@media (max-width: 940px) { .pane { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
.pane > main { min-width: 0; }

.rail { position: sticky; top: 88px; display: flex; flex-direction: column; gap: 26px; max-height: calc(100vh - 116px); overflow-y: auto; padding-right: 4px; }
@media (max-width: 940px) { .rail { position: static; max-height: none; overflow: visible; } }
.rail::-webkit-scrollbar { width: 6px; }
.rail::-webkit-scrollbar-thumb { background: var(--hair); border-radius: 3px; }

.grp-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 20px; padding-bottom: 8px; border-bottom: 1px solid var(--hair); margin-bottom: 10px; }
.grp-lb { font-family: var(--mono); font-size: 10.5px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); }
.grp-note { font-family: var(--mono); font-size: 10px; color: var(--faint); white-space: nowrap; }
.grp-clear { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.grp-clear:hover { color: var(--coral-dk); }

.col { display: flex; flex-direction: column; gap: 1px; }

.ch {
	display: grid; align-items: center; gap: 8px; width: 100%; text-align: left;
	min-height: 28px; padding: 0 8px; border-radius: 2px;
	font-size: 12.5px; color: var(--ink2);
}
.ch:hover { background: var(--hover); }
.ch[aria-pressed="true"] { background: var(--coral); color: #fff; }
.ch[aria-pressed="true"]:hover { background: var(--coral-dk); }
.ch-skill { grid-template-columns: minmax(0, 1fr) auto; font-family: var(--mono); font-size: 12px; }
.ch-imp { grid-template-columns: 10px minmax(0, 1fr) auto; font-family: var(--mono); font-size: 11px; letter-spacing: .02em; }
.ch-sec { grid-template-columns: 2.6em minmax(0, 1fr) auto; align-items: baseline; gap: 6px; padding: 5px 8px; }
.ch-lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ch-sec .ch-lb { white-space: normal; line-height: 1.4; }
.ch-n { font-family: var(--mono); font-size: 10.5px; font-variant-numeric: tabular-nums; opacity: .65; min-width: 2.2em; text-align: right; }
.ch-no { font-family: var(--mono); font-size: 10.5px; font-variant-numeric: tabular-nums; opacity: .6; }
.ch-dot { width: 8px; height: 8px; border-radius: 2px; }

.comp { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--hair); }
.comp:empty { display: none; }
.comp-lb { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); width: 100%; }
.comp-ch { font-family: var(--mono); font-size: 10.5px; min-height: 22px; padding: 0 7px; color: var(--coral-dk); background: color-mix(in srgb, var(--coral) 7%, transparent); border: 1px solid color-mix(in srgb, var(--coral) 28%, transparent); border-radius: 2px; }
.comp-ch:hover { background: color-mix(in srgb, var(--coral) 14%, transparent); }

.tagwrap { display: flex; flex-wrap: wrap; gap: 4px; }
.tg { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 0 8px; border-radius: 999px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); border: 1px solid var(--hair); }
.tg:hover { color: var(--coral-dk); border-color: color-mix(in srgb, var(--coral) 45%, transparent); }
.tg[aria-pressed="true"] { background: var(--coral); border-color: var(--coral); color: #fff; }
.tg-n { font-variant-numeric: tabular-nums; opacity: .6; }

/* ---------- rule cards ---------- */
.list { display: flex; flex-direction: column; gap: 8px; }
/* 반경은 레포 기존 html(overview.html, progressive-loading.html) 의 1~3px 취향에 맞춘다.
   칩 계열만 알약(999px)으로 남긴다. */
.row { position: relative; background: var(--card); border: 1px solid var(--hair); border-radius: 3px; overflow: hidden; }
.row[data-open="1"] { border-color: var(--edge); }
.row-stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
.row[data-imp="CRITICAL"] .row-stripe { background: var(--coral); }
.row[data-imp="HIGH"] .row-stripe { background: color-mix(in srgb, var(--coral) 55%, transparent); }
.row[data-imp="MEDIUM-HIGH"] .row-stripe { background: color-mix(in srgb, var(--coral) 25%, transparent); }

.row-hd { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; align-items: center; gap: 16px; width: 100%; text-align: left; padding: 14px 18px 14px 20px; }
.row-hd:hover { background: var(--hover); }
@media (max-width: 560px) { .row-hd { grid-template-columns: 44px minmax(0, 1fr); row-gap: 8px; } .row-meta { grid-column: 2; } }
.row-no { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--coral-dk); font-variant-numeric: tabular-nums; }
.row-ti { min-width: 0; font-size: 14.5px; font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row[data-open="1"] .row-ti { white-space: normal; }
.row-meta { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.car { color: #a8b2b8; font-size: 11px; width: 12px; text-align: center; }

.imp { display: inline-flex; align-items: center; gap: 5px; min-height: 22px; padding: 0 8px; border-radius: 999px; font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: .06em; white-space: nowrap; border: 1px solid transparent; }
.imp-CRITICAL { background: var(--coral); color: #fff; border-color: var(--coral); }
.imp-HIGH { background: color-mix(in srgb, var(--coral) 14%, transparent); color: var(--coral-dk); }
.imp-MEDIUM-HIGH { color: var(--coral-dk); border-color: color-mix(in srgb, var(--coral) 50%, transparent); }
.imp-MEDIUM { color: var(--muted); border-color: var(--hair); }

.body { border-top: 1px solid var(--soft); padding: 18px 20px 22px; }
.meta { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.meta-s { color: var(--edge); }

/* 아코디언 두 개는 같은 형태다. 판단에 쓰는 글은 읽기 편한 폭으로 제한한다. */
.accs { display: flex; flex-direction: column; margin-top: 16px; border-top: 1px dashed var(--hair); }
.accs:empty { display: none; }
.acc { border-bottom: 1px dashed var(--hair); }
.acc-btn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 11px 2px; font-size: 13px; font-weight: 500; color: var(--coral-dk); }
.acc-btn:hover { color: var(--coral); }
.acc-car { font-size: 9px; width: 8px; flex: 0 0 auto; }
.acc-body { display: none; padding: 0 2px 14px 18px; color: var(--ink2); font-size: 13.5px; line-height: 1.75; }
.acc[data-open="1"] .acc-body { display: block; }
.acc-body p { margin: 0 0 .75em; }
.acc-body p:last-child { margin-bottom: 0; }
.acc-body .lead { color: var(--ink); font-weight: 500; }
.acc-body ul { margin: 0 0 .75em; padding-left: 1.1em; list-style: none; }
.acc-body ul:last-child { margin-bottom: 0; }
.acc-body li { position: relative; margin: 0 0 .35em; }
.acc-body li::before { content: "·"; position: absolute; left: -.9em; color: var(--coral); font-weight: 700; }
.acc-body code { font-family: var(--mono); font-size: .88em; background: var(--hover); border: 1px solid var(--soft); border-radius: 3px; padding: 0 .25em; }
.acc-body strong { color: var(--ink); font-weight: 600; }
.acc-body .tw { overflow-x: auto; margin: 0 0 .8em; }
.acc-body table { border-collapse: collapse; font-size: 12.5px; min-width: 100%; }
.acc-body th, .acc-body td { border: 1px solid var(--hair); padding: 6px 10px; text-align: left; vertical-align: top; }
.acc-body th { background: var(--hover); font-family: var(--mono); font-size: 10.5px; font-weight: 500; }
.acc-body pre.code { border: 1px solid var(--soft); border-radius: 2px; margin: 0 0 .8em; }

.pairs { display: flex; flex-direction: column; gap: 18px; margin-top: 16px; }
.pair { display: flex; flex-direction: column; gap: 12px; }
.box { display: flex; flex-direction: column; min-width: 0; border-radius: 2px; overflow: hidden; }
/* 채도를 올려 두 박스가 한눈에 갈린다. 헤더 띠를 본문보다 진하게 둔다. */
.box-bad { border: 1px solid color-mix(in srgb, var(--bad) 42%, transparent); }
.box-good { border: 1px solid color-mix(in srgb, var(--good) 42%, transparent); }
.box-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 32px; padding: 4px 12px; }
.box-bad .box-hd { background: color-mix(in srgb, var(--bad) 13%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); }
.box-good .box-hd { background: color-mix(in srgb, var(--good) 13%, transparent); border-bottom: 1px solid color-mix(in srgb, var(--good) 30%, transparent); }
.box-l { display: flex; align-items: center; gap: 6px; min-width: 0; font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; }
.box-bad .box-l { color: var(--bad); }
.box-good .box-l { color: var(--good); }
.box-note { font-weight: 400; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0; }
.box-langs { font-family: var(--mono); font-size: 10px; color: var(--faint); flex: 0 0 auto; }

/* 코드는 가로 스크롤 대신 줄바꿈한다. 좁은 폭에서도 잘리지 않는다. */
pre.code {
	margin: 0; padding: 12px 14px; font-family: var(--mono); font-size: 12px; line-height: 1.7;
	background: var(--code-bg); color: var(--code-fg);
	white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; tab-size: 2;
}
/* 카드와 같은 흰색이면 코드 영역이 글과 구분되지 않는다. 의미색을 옅게 섞어 대비를 준다. */
.box-bad pre.code, .box-bad .code-lb { background: color-mix(in srgb, var(--bad) 7%, var(--code-bg)); }
.box-good pre.code, .box-good .code-lb { background: color-mix(in srgb, var(--good) 7%, var(--code-bg)); }
.acc-body pre.code { background: color-mix(in srgb, var(--ink) 4%, var(--code-bg)); }
pre.code + pre.code, .code-lb + pre.code { border-top: 1px solid var(--soft); }
.code-lb { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; color: var(--faint); padding: 6px 14px 0; background: var(--code-bg); }
pre.code + .code-lb { border-top: 1px solid var(--soft); }
.c { color: var(--faint); font-style: italic; }
.s { color: var(--good); }
.k { color: var(--coral-dk); font-weight: 500; }
.g { color: var(--tag-fg); }


.refs { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.ref-g { display: grid; grid-template-columns: 5.6em minmax(0, 1fr); align-items: start; gap: 10px; }
@media (max-width: 560px) { .ref-g { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.ref-lb { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding-top: 5px; }
.ref-items { display: flex; flex-wrap: wrap; gap: 5px; }
.ref { min-height: 24px; padding: 0 8px; border-radius: 2px; font-family: var(--mono); font-size: 10.5px; color: var(--coral-dk); background: color-mix(in srgb, var(--coral) 7%, transparent); border: 1px solid color-mix(in srgb, var(--coral) 28%, transparent); }
.ref:hover { background: color-mix(in srgb, var(--coral) 14%, transparent); }
.ref[data-ext="1"] { border-style: dashed; }
.ref[disabled] { color: var(--faint); background: none; border-color: var(--soft); cursor: default; }

.rtags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--hover); }
.rtag { min-height: 22px; padding: 0 8px; border-radius: 999px; font-family: var(--mono); font-size: 10px; color: var(--muted); border: 1px solid var(--hair); }
.rtag:hover { color: var(--coral-dk); border-color: color-mix(in srgb, var(--coral) 45%, transparent); }

.empty { padding: 72px 24px; text-align: center; border: 1px dashed var(--hair); border-radius: 3px; color: var(--muted); font-size: 13.5px; }
mark { background: color-mix(in srgb, var(--coral) 30%, transparent); color: inherit; border-radius: 2px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<header class="hd">
	<div class="hd-in">
		<div class="brand">
			<span class="brand-nm">팀 컨벤션</span>
			<span class="brand-sub">HANDBOOK</span>
		</div>
		<div class="sr">
			<div class="sr-box">
				<span class="sr-ico" aria-hidden="true">◇</span>
				<input id="q" class="sr-in" type="search" autocomplete="off" spellcheck="false"
					placeholder="규칙·상황·코드 검색   /" aria-label="규칙 검색">
			</div>
		</div>
		<div class="hd-r">
			<span class="cnt" id="count"></span>
			<button class="btn" id="expand">전체 펼침</button>
			<button class="btn" id="theme" aria-label="라이트·다크 전환">테마</button>
		</div>
	</div>
</header>
<div class="wrap">
	<div class="pane">
		<aside class="rail">
			<div>
				<div class="grp-hd"><span class="grp-lb">Skill</span><span class="grp-note">단일 선택</span></div>
				<div class="col" id="f-skill"></div>
				<div class="comp" id="companion"></div>
			</div>
			<div>
				<div class="grp-hd"><span class="grp-lb">Impact</span><button class="grp-clear" data-clear="impact">해제</button></div>
				<div class="col" id="f-impact"></div>
			</div>
			<div>
				<div class="grp-hd"><span class="grp-lb">섹션</span><button class="grp-clear" data-clear="section">해제</button></div>
				<div class="col" id="f-section"></div>
			</div>
			<div>
				<div class="grp-hd"><span class="grp-lb">태그</span><button class="grp-clear" data-clear="tags">해제</button></div>
				<div class="tagwrap" id="f-tags"></div>
			</div>
		</aside>
		<main><div class="list" id="list"></div></main>
	</div>

l document entry","- `_document.css`: route-shared body shell style","- `_head.astro`: head/meta concern","","피할 이름:","","- `_layout.astro`, `_shell.astro`, `_wrapper.astro`, `_base.astro`","- `site-layout.astro`","- 실제 재사용 경계 없는 `_page-chrome.astro`","","`_document.astro`와 `_head.astro`의 contract는 각 파일 안의 로컬 `Props`가 직접 소유합니다."],"examples":[{"kind":"incorrect","label":"generic shell 이름이나 feature 이름이 섞여 역할이 흐려짐","blocks":[{"lang":"text","code":"src/pages/_layout.astro\nsrc/pages/_shell.astro\nsrc/pages/_base.astro\nsrc/pages/site-layout.astro\nsrc/pages/_page-chrome.astro"}]},{"kind":"correct","label":"underscore prefix와 역할 이름으로 pages-local helper를 드러냄","blocks":[{"lang":"text","code":"src/pages/_document.astro\nsrc/pages/_document.css\nsrc/pages/_head.astro"}]}]},{"skill":"astro","id":"component-compose-page-level-documents-through-_document-and-page-adjacent-shells","number":"3.1","title":"Compose Page-level Documents Through `_document.astro` and `_head.astro`","titleKo":"페이지 문서는 _document.astro와 _head.astro로 조립","impact":"HIGH","impactDescription":"반복되는 document·head·body 셸 조립을 route 파일 밖으로 빼면서 페이지 진입점은 하나로 유지함","appliesWhen":"","tags":["component","document","head","pages","seo"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"component","prose":["page-level entry point)**","","반복되는 top-level document composition이 필요하면 routed page는 `src/pages/_document.astro` 하나만 import합니다.","","소유권:","","- Routed page: route data, page meta handoff, body content flow","- `_document.astro`: `\u003chtml>`, `\u003chead>` 연결, `\u003cbody>`, shared body shell, base CSS import, `\u003cslot />`","- `_head.astro`: SEO/meta/canonical/link/JSON-LD 계산과 head 전용 `Props`","- `_document.css`: document shell style","","금지:","","- 각 page가 `\u003chtml>`, `\u003chead>`, `\u003cbody>` 조립을 반복","- `_document.ts` 같은 중간 type-only contract 파일 추가","- `Props extends DocumentMetaProps`처럼 얇은 타입 확장으로 contract 숨기기","- 실제 재사용 경계 없는 `_page-chrome.astro` helper 추가","","SEO library는 `_head.astro` 내부 구현 선택지일 뿐 필수 contract가 아닙니다.","중요한 기준은 page, document, head의 책임이 한눈에 보이고, routed page가 body content를 slot으로 전달한다는 점입니다."],"examples":[{"kind":"incorrect","label":"각 page가 문서 조립을 반복함","blocks":[{"lang":"astro","code":"---\nimport Head from \"./_head.astro\";\n---\n\n\u003chtml lang=\"ko\">\n\t\u003cHead pageTitle=\"archive\" pageDescription=\"Archived entries\" />\n\t\u003cbody>\n\t\t\u003cheader>...\u003c/header>\n\t\t\u003cmain>\n\t\t\t\u003csection class=\"rt_entriesIndex__root\">...\u003c/section>\n\t\t\u003c/main>\n\t\u003c/body>\n\u003c/html>"}]},{"kind":"correct","label":"page는 document helper에 route body를 slot으로 전달","blocks":[{"lang":"astro","code":"---\nimport Document from \"@/pages/_document.astro\";\nimport WgEntryFeed from \"@/components/widget/entry-feed/wg-entry-feed.astro\";\n\nconst entries = await listEntries();\n---\n\n\u003cDocument currentPathname={Astro.url.pathname} pageTitle=\"entries\" pageDescription=\"Archived entries\">\n\t\u003csection class=\"rt_entriesIndex__root\">\n\t\t\u003cWgEntryFeed entries={entries} />\n\t\u003c/section>\n\u003c/Document>"},{"lang":"astro","code":"---\nimport \"./_document.css\";\nimport \"@/styles/base.css\";\nimport Head from \"./_head.astro\";\nimport WgSiteFooter from \"@/components/widget/site-footer/wg-site-footer.astro\";\nimport WgSiteHeader from \"@/components/widget/site-header/wg-site-header.astro\";\n\ninterface Props {\n\tcurrentPathname: string;\n\tpageTitle?: string;\n\tpageDescription?: string;\n}\n\nconst {currentPathname, pageTitle, pageDescription} = Astro.props as Props;\n---\n\n\u003c!doctype html>\n\u003chtml lang=\"ko\">\n\t\u003cHead pageTitle={pageTitle} pageDescription={pageDescription} />\n\t\u003cbody class=\"rt_document__body\">\n\t\t\u003cWgSiteHeader currentPathname={currentPathname} />\n\t\t\u003cmain class=\"rt_document__main\">\n\t\t\t\u003cslot />\n\t\t\u003c/main>\n\t\t\u003cWgSiteFooter />\n\t\u003c/body>\n\u003c/html>"},{"lang":"astro","code":"---\ninterface Props {\n\tpageTitle?: string;\n\tpageDescription?: string;\n}\n\nconst {pageTitle, pageDescription} = Astro.props as Props;\nconst title = pageTitle ? `${pageTitle} | Site` : \"Site\";\nconst description = pageDescription ?? \"Default site description\";\n---\n\n\u003chead>\n\t\u003cmeta charset=\"UTF-8\" />\n\t\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" />\n\t\u003ctitle>{title}\u003c/title>\n\t\u003cmeta name=\"description\" content={description} />\n\u003c/head>"}]}]},{"skill":"astro","id":"component-keep-frontmatter-server-only-and-template-focused","number":"3.2","title":"Keep Frontmatter Server-only and Template-focused","titleKo":"frontmatter는 서버 전용으로 두고 템플릿에 집중","impact":"HIGH","impactDescription":"브라우저 동작이 Astro의 서버 측 컴포넌트 준비 단계로 새는 것을 막음","appliesWhen":"","tags":["frontmatter","scripts","templates"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"component","prose":["Astro frontmatter는 server-only component script입니다.","import, `Astro.props` 해석, fetch, server-side 파생값 계산처럼 HTML을 준비하는 코드에 집중하고,","이 값이 브라우저에서 그대로 살아 있을 것처럼 가정하지 않습니다.","브라우저 이벤트 핸들러나 DOM 접근은 template의 `\u003cscript>`나 framework island로 넘기고,","frontmatter 값이 browser script에 필요하면 `data-*` attribute 같은 명시적인 handoff를 사용합니다."],"examples":[{"kind":"incorrect","label":"frontmatter 안에서 browser handler를 정의하고 template에 직접 연결하려 함","blocks":[{"lang":"astro","code":"---\nconst handleClick = () => {\n\twindow.alert(\"Subscribed\");\n};\n---\n\n\u003cbutton onclick={handleClick}>Subscribe\u003c/button>"}]},{"kind":"correct","label":"server 준비 코드는 frontmatter에 두고 browser 동작은 template script로 명시적으로 handoff","blocks":[{"lang":"astro","code":"---\nconst successMessage = \"Subscribed\";\n---\n\n\u003castro-subscribe data-success-message={successMessage}>\n\t\u003cbutton type=\"button\">Subscribe\u003c/button>\n\u003c/astro-subscribe>\n\n\u003cscript>\n\tclass AstroSubscribe extends HTMLElement {\n\t\tconnectedCallback() {\n\t\t\tconst button = this.querySelector(\"button\");\n\t\t\tconst successMessage = this.dataset.successMessage;\n\n\t\t\tbutton?.addEventListener(\"click\", () => {\n\t\t\t\twindow.alert(successMessage ?? \"Subscribed\");\n\t\t\t});\n\t\t}\n\t}\n\n\tcustomElements.define(\"astro-subscribe\", AstroSubscribe);\n\u003c/script>"}]}]},{"skill":"astro","id":"component-prefer-astro-for-static-shells-and-layouts","number":"3.3","title":"Prefer `.astro` for Static Shells and Layouts","titleKo":"정적 셸과 레이아웃은 .astro로","impact":"CRITICAL","impactDescription":"불필요한 클라이언트 프레임워크 표면을 줄이고 Astro의 zero-JS 기본값을 지킴","appliesWhen":"","tags":["astro-components","layouts","islands"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"component","prose":["state, effect, client runtime가 필요 없는 shell은 기본적으로 `.astro`로 작성합니다.","","기준:","","- `.astro`: page shell, route shell, wrapper, static content section, document/head helper","- Framework island: browser state, event handler, effect, client-only library가 필요한 leaf","- `src/pages/_document.astro`: top-level document와 shared body shell","- `src/pages/**/_local/*.astro`: 특정 route subtree만 쓰는 route shell","","React component를 이미 쓴다는 이유만으로 정적 shell까지 TSX로 밀어 넣지 않습니다.","page content가 주입되는 자리는 `\u003cslot />`로 드러내고,","full document shell이라면 `\u003chtml>`이 최상위 parent가 되게 유지합니다."],"examples":[{"kind":"incorrect","label":"정적 shell을 React component로 올려 불필요한 framework surface를 늘림","blocks":[{"lang":"tsx","code":"export const MarketingLayout = ({title, children}: PropsWithChildren\u003c{title: string}>) => {\n\treturn (\n\t\t\u003chtml lang=\"ko\">\n\t\t\t\u003cbody>\n\t\t\t\t\u003cheader>{title}\u003c/header>\n\t\t\t\t\u003cmain>{children}\u003c/main>\n\t\t\t\u003c/body>\n\t\t\u003c/html>\n\t);\n};"}]},{"kind":"correct","label":"정적 shell은 `.astro`가 직접 소유하고 interactive leaf만 필요 시 island로 연결","blocks":[{"lang":"astro","code":"---\nconst { title } = Astro.props;\n---\n\n\u003chtml lang=\"ko\">\n\t\u003cbody>\n\t\t\u003cheader>{title}\u003c/header>\n\t\t\u003cmain>\n\t\t\t\u003cslot />\n\t\t\u003c/main>\n\t\u003c/body>\n\u00 t} />"}]}]},{"skill":"astro","id":"routing-prefer-flat-files-for-leaf-dynamic-routes","number":"5.2","title":"Prefer Flat Files for Leaf Dynamic Routes","titleKo":"말단 동적 route는 평평한 파일로","impact":"HIGH","impactDescription":"route가 실제로 자식 route를 가질 때까지 동적 route 트리를 얕게 유지함","appliesWhen":"","tags":["routing","dynamic-routes","folders","pages"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"routing","prose":["하위 route가 없는 dynamic page는 folder로 감싸지 말고 flat file로 둡니다.","`index.astro` folder는 같은 resource 아래에 child route가 실제로 생겼을 때 사용합니다.","","판단 기준:","","- Leaf public detail은 `src/pages/posts/[slug].astro`처럼 둡니다.","- Leaf filtered list도 child route가 없으면 `src/pages/tags/[slug].astro`처럼 둡니다.","- 같은 dynamic resource 아래에 `feed.xml`, `[page].astro`,","  settings 같은 child route가 생기면 그때 `src/pages/tags/[slug]/index.astro`로 승격합니다.","- 공개 URL contract가 이미 배포됐다면 파일 구조 선호보다 URL 보존과 redirect 계획을 먼저 봅니다."],"examples":[{"kind":"incorrect","label":"하위 route가 없는데 dynamic route를 folder로 감쌈","blocks":[{"lang":"text","code":"src/pages/posts/[slug]/index.astro\nsrc/pages/tags/[slug]/index.astro\nsrc/pages/authors/[author]/index.astro"}]},{"kind":"correct","label":"leaf route는 flat file, child route가 있을 때만 folder","blocks":[{"lang":"text","code":"src/pages/posts/[slug].astro\nsrc/pages/posts/_slug.css\n\nsrc/pages/tags/[slug].astro\nsrc/pages/tags/_slug.css\n\nsrc/pages/topics/[topic]/index.astro\nsrc/pages/topics/[topic]/[page].astro\nsrc/pages/topics/[topic]/feed.xml.ts"}]}]},{"skill":"astro","id":"routing-prefer-sibling-index-and-page-files-for-paginated-route-families","number":"5.3","title":"Prefer Sibling `index.astro` and `[page].astro` Files for Paginated Route Families","titleKo":"페이지네이션 route는 index.astro와 [page].astro 형제로","impact":"HIGH","impactDescription":"페이지네이션 route를 얕게 유지하고 목록과 페이지네이션 계약을 한 폴더에서 읽히게 함","appliesWhen":"","tags":["routing","pagination","pages","route-families"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"routing","prose":["folder)**","","페이지네이 후 앱처럼 대부분의 page가 request-time 데이터와 auth에 묶인 경우에만 기본값으로 채택하고,","그 안의 정적 page만 `prerender = true`로 opt in 합니다."],"examples":[{"kind":"incorrect","label":"몇 개의 auth page만 동적인데 전체 project를 server mode로 돌림","blocks":[{"lang":"text","code":"- marketing, docs, blog가 대부분 정적임\n- account, billing 두 page 때문에 `output: \"server\"`를 전체 기본값으로 선택함"}]},{"kind":"correct","label":"대부분이 동적인 앱에서만 server mode를 기본값으로 사용하고 정적 page를 개별 opt in","blocks":[{"lang":"ts","code":"import { defineConfig } from \"astro/config\";\n\nexport default defineConfig({\n\toutput: \"server\",\n});"},{"lang":"astro","code":"---export const prerender = true;---\n\u003cAboutPage />"}]}]},{"skill":"astro","id":"rendering-use-prerender-false-for-request-bound-or-personalized-routes","number":"6.3","title":"Use `prerender = false` for Request-bound or Personalized Routes","titleKo":"요청 의존·개인화 route에는 prerender = false","impact":"CRITICAL","impactDescription":"요청마다 실제로 실행되는 route에만 요청 시점 로직을 둠","appliesWhen":"","tags":["prerender","ssr","rendering"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"rendering","prose":["쿠키, 인증 세션, 요청 헤더,","요청마다 바뀌는 개인화 데이터에 의존하는 page나 endpoint는 static mode에서 `export const prerender = false`로 on-demand","rendering을 명시합니다.","build 시점에 고정된 HTML로 만들 수 없는 동작을 정적 page 안에 억지로 숨기지 않습니다.","`output: \"server\"`를 이미 쓰는 프로젝트라면 같은 intent를 page-level로 다시 선언할 필요는 없습니다."],"examples":[{"kind":"incorrect","label":"request-time 데이터에 의존하지만 정적 page처럼 둠","blocks":[{"lang":"astro","code":"---\nconst session = await getSession(Astro.request.headers);\n---\n\n\u003cDashboardPage session={session} />"}]},{"kind":"correct","label":"request-bound page임을 route boundary에서 드러냄","blocks":[{"lang":"astro","code":"---\nexport const prerender = false;\n\nconst session = await getSession(Astro.request.headers);\n---\n\n\u003cDashboardPage session={session} />"}]}]},{"skill":"astro","id":"content-define-collections-in-src-content-config","number":"7.1","title":"Define Build-time Collections in `src/content.config.ts`","titleKo":"빌드 시점 컬렉션은 src/content.config.ts에 정의","impact":"HIGH","impactDescription":"콘텐츠 소유를 한곳에 모아 컬렉션 형태가 페이지마다 다시 정의되는 것을 막음","appliesWhen":"","tags":["content-collections","config","loaders"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"content","prose":["build-time content collection 정의는 `src/content.config.ts`에서 한 번에 관리합니다.","page 파일 안에서 glob, frontmatter parsing,","ad-hoc shape normalization을 반복하지 말고 collection loader와 registration을 중앙화합니다.","요청마다 fresh한 데이터를 가져오는 live collection은 이 파일이 아니라 `src/live.config.ts`와 `defineLiveCollection()`","쪽으로 분리합니다."],"examples":[{"kind":"incorrect","label":"page 파일 안에서 raw glob과 frontmatter parsing을 직접 반복","blocks":[{"lang":"astro","code":"---\nconst posts = await Astro.glob(\"../content/blog/*.md\");\nconst sortedPosts = posts\n\t.map((post) => ({ title: post.frontmatter.title, href: `/blog/${post.file.split(\"/\").at(-1)?.replace(\".md\", \"\")}/` }))\n\t.toSorted((left, right) => right.title.localeCompare(left.title));\n---"}]},{"kind":"correct","label":"collection 정의는 config에 모으고 page는 collection API만 사용","blocks":[{"lang":"ts","code":"import { defineCollection } from \"astro:content\";\nimport { glob } from \"astro/loaders\";\n\nconst blog = defineCollection({\n\tloader: glob({ base: \"./src/content/blog\", pattern: \"**/*.{md,mdx}\" }),\n});\n\nexport const collections = { blog };"}]}]},{"skill":"astro","id":"content-distinguish-build-time-and-live-collections","number":"7.2","title":"Distinguish Build-time and Live Collections","titleKo":"빌드 시점 컬렉션과 live 컬렉션을 구분","impact":"HIGH","impactDescription":"정적 콘텐츠와 요청 시점 콘텐츠 사이에서 신선도 가정이 어긋나는 것을 막음","appliesWhen":"","tags":["content-collections","live-collections","loaders"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"content","prose":["build-time content collection과 live collection은 같은 개념으로 취급하지 않습니다.","build-time collection은 `src/content.config.ts`와 `defineCollection()`에 두고 `getCollection()`/`getEntry()`로 읽습니다.","요청마다 fresh한 CMS나 API 데이터를 다뤄야 하면 `src/live.config.ts`와 `defineLiveCollection()`을 사용하고","`getLiveCollection()`/`getLiveEntry()`로 접근합니다.","live collection은 on-demand rendering 전제도 함께 갖습니다."],"examples":[{"kind":"incorrect","label":"request-time freshness가 필요한 데이터를 build-time collection처럼 취급함","blocks":[{"lang":"text","code":"- 실시간 상품 데이터는 `src/content.config.ts`에 등록한다\n- page에서는 `getCollection(\"products\")`로 읽고 재빌드 없이 최신값을 기대한다"}]},{"kind":"correct","label":"build-time과 live collection의 config와 query를 분리함","blocks":[{"lang":"ts","code":"import { defineLiveCollection } from \"astro:content\";\nimport { productLoader } from \"./loaders/product-loader\";\n\nconst products = defineLiveCollection({\n\tloader: productLoader({ endpoint: process.env.PRODUCTS_API_URL }),\n});\n\nexport const collections = { products };"}]}]},{"skill":"astro","id":"content-give-collections-explicit-zod-schemas","number":"7.3","title":"Give Collections Explicit Zod Schemas","titleKo":"컬렉션에는 명시적 Zod 스키마","impact":"HIGH","impactDescription":"구조화 콘텐츠를 타입 안전하게 만들고 frontmatter 변형이 페이지로 새는 것을 막음","appliesWhen":"","tags":["content-collections","zod","schema"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"content","prose":["구조화된 collection은 loader만 두고 끝내지 말고 schema를 명시적으로 둡니다.","collection entry shape를 page마다 추측하거나 optional chaining으로 봉합하지 말고 `astro:zod` 기반 schema에서 타입과","validation을 고정합니다."],"examples":[{"kind":"incorrect","label":"structured content인데 schema 없이 느슨하게 사용","blocks":[{"lang":"ts","code":"const docs = defineCollection({\n\tloader: glob({ base: \"./src/content/docs\", pattern: \"**/*.md\" }),\n});"}]},{"kind":"correct","label":"collection schema로 필수 필드와 타입을 명시","blocks":[{"lang":"ts","code":"import { defineCollection } from \"astro:content\";\nimport { glob } from \"astro/loaders\";\nimport { z } from \"astro/zod\";\n\nconst docs = defineCollection({\n\tloader: glob({ base: \"./src/content/docs\", pattern: \"**/*.md\" }),\n\tschema: z.object({\n\t\ttitle: z.string(),\n\t\tdescription: z.string(),\n\t\torder: z.number().int(),\n\t\tdraft: z.boolean().default(false),\n\t}),\n});"}]}]},{"skill":"astro","id":"server-choose-actions-vs-endpoints-by-caller-and-response-needs","number":"8.1","title":"Choose Actions vs. Endpoints by Caller and Response Needs","titleKo":"Actions와 Endpoints는 호출자와 응답 요건으로 선택","impact":"HIGH","impactDescription":"mutation 경계를 누가 호출하는지와 어떤 응답을 제어해야 하는지에 맞춤","appliesWhen":"","tags":["actions","endpoints","forms"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"server","prose":["control)**","","브라우저 UI가 직접 호출하는 form submit이나 mutation은 기본적으로 Actions를 먼저 검토합니다.","Actions는 input validation, error shape,","client/server 호출 계약을 한 경계에서 다루기 쉬워 UI와 가까운 write flow에 잘 맞습니다.","반대로 public API, webhook, binary 응답, 세밀한 header/status 제어,","non-UI consumer가 필요한 경우에는 endpoint가 더 자연스럽습니다.","static mode에서 HTML form 기반 action을 쓰면 on-demand rendering 전제도 함께 확인합니다."],"examples":[{"kind":"incorrect","label":"모든 서버 쓰기 흐름을 같은 방식으로 처리함","blocks":[{"lang":"text","code":"- UI form submit도 무조건 ad-hoc /api fetch로 처리한다\n- public webhook도 action처럼 취급한다\n- 파일 다운로드 응답도 action 안에서 우겨 넣는다"}]},{"kind":"correct","label":"caller와 response shape에 맞는 경계를 고른다","blocks":[{"lang":"text","code":"- page form이나 button mutation: Actions 우선\n- 외부 서비스 webhook, public JSON API, 이미지/파일 응답: endpoint 우선\n- static mode에서 request-time form 처리: adapter와 prerender 전제를 함께 확인"}]}]},{"skill":"astro","id":"server-keep-redirects-rewrites-and-auth-ownership-at-page-or-middleware-boundary","number":"8.2","title":"Keep Redirects, Rewrites, and Auth Ownership at the Page or Middleware Boundary","titleKo":"리다이렉트·rewrite·인증 소유는 page 또는 middleware 경계에","impact":"HIGH","impactDescription":"요청 시점 가드와 내비게이션 부수효과를 시각적으로 남아야 하는 layout 셸 밖에 둠","appliesWhen":"","tags":["server","redirects","middleware","auth","ownership"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"server","prose":["Route-local shell과 pages-local document helper는 shell 조립 역할만 하므로 redirect, rewrite,","auth guard의 owner가 되지 않습니다.","","Owner 기준:","","- Route-specific request gate: `src/pages/**` page boundary","- Cross-cutting concern: `src/middleware.ts`의 `onRequest()`","- Visual shell: page나 middleware가 결정한 결과를 props 또는 `Astro.locals`로 받아 표현","","Route param, query, page-level data selection과 결합된 guard는 page에서 처리합니다.","여러 route에 공통인 auth, locale, tenant, request locals 주입은 middleware에서 처리합니다.","Astro 공식 문서상 `Astro.redirect()`는 page가 `return`해야 하고,","middleware interception은 `src/middleware.ts`에서 수행합니다."],"examples":[{"kind":"incorrect","label":"layout이 request-time guard와 redirect를 직접 소유","blocks":[{"lang":"astro","code":"---\nconst session = Astro.locals.session;\n\nif (!session) {\n\treturn Astro.redirect(\"/login\");\n}\n---\n\n\u003cslot />"}]},{"kind":"correct","label":"route-specific guard는 page boundary에서 처리","blocks":[{"lang":"astro","code":"---\nimport AccountShell from \"./_local/account-shell.astro\";\n\nconst session = Astro.locals.session;\n\nif (!session) {\n\treturn Astro.redirect(\"/login\");\n}\n---\n\n\u003cAccountShell title=\"Account\">\n\t\u003cp>Account page\u003c/p>\n\u003c/AccountShell>"}]},{"kind":"correct","label":"cross-cutting auth는 middleware에서 처리","blocks":[{"lang":"ts","code":"import { defineMiddleware } from \"astro:middleware\";\n\nexport const onRequest = defineMiddleware((context, next) => {\n\tif (!context.locals.session && context.url.pathname.startsWith(\"/account\")) {\n\t\treturn context.redirect(\"/login\", 302);\n\t}\n\n\treturn next();\n});"}]}]},{"skill":"astro","id":"server-keep-server-islands-serializable-and-slot-fallbacks","number":"8.3","title":"Keep Server Islands Serializable and Slot Fallbacks Ready","titleKo":"server island는 직렬화 가능하게, slot fallback 준비","impact":"HIGH","impactDescription":"지연 렌더링을 이식 가능하게 유지하고 깨진 props나 빈 로딩 화면을 피함","appliesWhen":"","tags":["server-islands","serializable-props","fallback"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"server","prose":["`server:defer`를 쓰는 Astro component에는 serializable props만 넘기고,","느린 personalized content에는 fallback slot을 함께 준비합니다.","함수나 거대한 객체를 넘겨 deferred boundary를 깨뜨리거나, placeholder 없이 blank 영역을 남기지 않습니다."],"examples":[{"kind":"incorrect","label":"함수 prop과 fallback 없는 deferred island","blocks":[{"lang":"astro","code":"---\nimport Avatar from \"../components/Avatar.astro\";\n---\n\n\u003cAvatar\n\tserver:defer\n\tuser={currentUser}\n\tonLoaded={() => console.log(\"loaded\")}\n/>"}]},{"kind":"correct","label":"serializable props만 전달하고 fallback을 함께 둠","blocks":[{"lang":"astro","code":"---\nimport Avatar from \"../components/Avatar.astro\";\nimport GenericAvatar from \"../components/GenericAvatar.astro\";\n---\n\n\u003cAvatar server:defer userId={currentUser.id}>\n\t\u003cGenericAvatar slot=\"fallback\" />\n\u003c/Avatar>"}]}]},{"skill":"astro","id":"responsibility-compose-layouts-from-widget-and-ui-only","number":"9.1","title":"Compose Layouts from Widget and UI Only","titleKo":"레이아웃은 widget과 ui만으로 조립","impact":"HIGH","impactDescription":"layout 파일이 도메인 전용 공용 블록이 되지 않고 route 셸로 남게 함","appliesWhen":"","tags":["responsibility","layouts","ui","widget","composition"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"responsibility","prose":["`_document.astro`나 route-local shell이 shell composition을 맡는다면,","그 안에서 조립하는 shared piece는 `src/components/widget/**`와 `src/components/ui/**`로 제한합니다.","","구분 기준:","","- `ui`: button, input, card, table, box, stack, surface, text 같은 primitive","- `widget`: search-table, site-header, entry-feed, entry-detail처럼 `ui`를 조립한 reusable block","- Document shell: `_document.astro` and `_document.css`","- Route shell: owning route의 `_local/`","","Shell 자체를 `ui-*`나 `widget-*`로 이름 붙여 shared component처럼 승격하지 않습니다.","Shell class는 `rt_document__*`처럼 owner가 드러나게 유지합니다."],"examples":[{"kind":"incorrect","label":"layout 역할을 ui/widget로 위장함","blocks":[{"lang":"text","code":"src/components/ui/page-shell/ui-page-shell.astro\nsrc/components/widget/app-shell/widget-app-shell.astro"},{"lang":"astro","code":"---\nimport UiPageShell from \"@/components/ui/page-shell/ui-page-shell.astro\";\n---\n\n\u003cUiPageShell>\n\t\u003cslot />\n\u003c/UiPageShell>"}]},{"kind":"correct","label":"document shell은 pages-local에 남기고 shared piece만 ui/widget에서 조립","blocks":[{"lang":"astro","code":"---\nimport UiBox from \"@/components/ui/box/ui-box.astro\";\nimport UiStack from \"@/components/ui/stack/ui-stack.astro\";\nimport UiSurface from \"@/components/ui/surface/ui-surface.astro\";\nimport WgSiteHeader from \"@/components/widget/site-header/wg-site-header.astro\";\n\nconst { currentPathname } = Astro.props;\n---\n\n\u003cUiSurface class=\"rt_document__surface\">\n\t\u003cUiStack class=\"rt_document__stack\">\n\t\t\u003cUiBox class=\"rt_document__header\">\n\t\t\t\u003cWgSiteHeader currentPathname={currentPathname} />\n\t\t\u003c/UiBox>\n\t\t\u003cmain class=\"rt_document__main\">\n\t\t\t\u003cUiBox class=\"rt_document__content\">\n\t\t\t\t\u003cslot />\n\t\t\t\u003c/UiBox>\n\t\t\u003c/main>\n\t\u003c/UiStack>\n\u003c/UiSurface>"}]}]},{"skill":"astro","id":"responsibility-extract-route-support-code-only-when-the-boundary-is-real","number":"9.2","title":"Extract Route Support Code Only When the Boundary Is Real","titleKo":"route support 코드는 경계가 실재할 때만 추출","impact":"HIGH","impactDescription":"route 페이지의 일회성 frontmatter 로직이 generic 헬퍼 파일로 흩어지는 것을 막음","appliesWhen":"","tags":["responsibility","support-code","frontmatter","naming"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"responsibility","prose":["Route page frontmatter support code should move into owner-named support modules only when the boundary is real.","","추출할 수 있는 것:","","- clear input/output data boundary","- validation, auth, serialization, model building","- shared route-family data loader","","Page file에 남길 것:","","- small one-off booleans","- `Astro.props` destructuring","- page-local labels","- `class:list` conditions","- empty-state branch choices","","Do not create `_form.ts`, `_api.ts`, `utils.ts`, `helpers.ts`,","or `common.ts` unless the owner name makes the boundary explicit."],"examples":[{"kind":"incorrect","label":"small route-local calculations are scattered into generic helpers","blocks":[{"lang":"ts","code":"// src/pages/admin/entries/_form.ts\nexport const getHasActiveFilter = (filter?: string) => Boolean(filter);\n\nexport const getEmptyMessage = (filter?: string) => {\n\treturn filter ? \"No entries match this filter.\" : \"No entries yet.\";\n};"}]},{"kind":"correct","label":"owner-named support module에는 실제 route data boundary만 둠","blocks":[{"lang":"ts","code":"// src/pages/admin/entries/_entry-admin.ts\nimport type { EntryAdminInitialState } from \"./_local/entry-admin-runtime\";\n\n/**\n * @summary admin entries 화면의 초기 server state를 만든다.\n */\nexport const getEntryAdminInitialState = async (): Promise\u003cEntryAdminInitialState> => {\n\tconst entries = await entryAdminApi.listEntries();\n\n\treturn {\n\t\tentries: entries.map(toEntryAdminRow),\n\t};\n};"},{"lang":"astro","code":"---\nimport { getEntryAdminInitialState } from \"./_entry-admin\";\n\nconst initialState = await getEntryAdminInitialState();\nconst hasEntries = initialState.entries.length > 0;\nconst emptyMessage = hasEntries ? undefined : \"No entries yet.\";\n---"}]}]},{"skill":"astro","id":"responsibility-extract-route-local-sections-only-for-rendering-or-interaction-boundaries","number":"9.3","title":"Extract Route-local Sections Only for Rendering or Interaction Boundaries","titleKo":"route-local 섹션은 렌더링·상호작용 경계일 때만 추출","impact":"HIGH","impactDescription":"조급한 _local/ 섹션 추출 없이 route 페이지를 읽을 수 있게 유지함","appliesWhen":"","tags":["responsibility","local","islands","boundaries"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"responsibility","prose":["Move a section into `src/pages/**/_local/` only when it owns a real rendering or interaction boundary.","","추출할 수 있는 경계:","","- `client:*` or `client:only` hydration","- `server:defer` with fallback","- form/action ownership","- provider setup","- browser-only custom element or script behavior","- third-party widget adapter","- repeated slot contract","","Do not extract a component just because a heading/body/footer group looks like a section.","If the subtree still describes the same route surface,","keep the route `rt_*` owner instead of inventing a `loc_*` namespace."],"examples":[{"kind":"incorrect","label":"simple page markup is split into `_local/` wrappers","blocks":[{"lang":"astro","code":"---\nimport EntryBodySection from \"./_local/entry-body-section.astro\";\nimport EntryHeaderSection from \"./_local/entry-header-section.astro\";\nimport EntryMetaSection from \"./_local/entry-meta-section.astro\";\n\nconst { entry } = Astro.props;\n---\n\n\u003carticle class=\"rt_entryDetail__root\">\n\t\u003cEntryHeaderSection entry={entry} />\n\t\u003cEntryMetaSection entry={entry} />\n\t\u003cEntryBodySection html={entry.html} />\n\u003c/article>"}]},{"kind":"correct","label":"boundary가 있는 subtree만 `_local/`로 분리","blocks":[{"lang":"astro","code":"---\nimport RelatedEntriesPanel from \"./_local/related-entries-panel.astro\";\nimport EntryReactionIsland from \"./_local/entry-reaction-island.tsx\";\n\nconst { entry, relatedEntries } = Astro.props;\n---\n\n\u003carticle class=\"rt_entryDetail__root\">\n\t\u003cheader class=\"rt_entryDetail__header\">\n\t\t\u003ch1>{entry.title}\u003c/h1>\n\t\t\u003cp>{entry.description}\u003c/p>\n\t\u003c/header>\n\n\t\u003cdiv class=\"rt_entryDetail__meta\">\n\t\t\u003cspan>{entry.author}\u003c/span>\n\t\t\u003cspan>{entry.publishedAtLabel}\u003c/span>\n\t\u003c/div>\n\n\t\u003cdiv class=\"rt_entryDetail__body\" set:html={entry.html} />\n\n\t\u003cRelatedEntriesPanel server:defer entries={relatedEntries}>\n\t\t\u003cp slot=\"fallback\">Loading related entries...\u003c/p>\n\t\u003c/RelatedEntriesPanel>\n\n\t\u003cEntryReactionIsland client:visible entryId={entry.id} />\n\u003c/article>"}]}]},{"skill":"astro","id":"responsibility-keep-page-files-focused-on-route-contract-and-data-handoff","number":"9.4","title":"Keep Pa e":"Add New Pages in Layout-and-rendering-first Order","titleKo":"새 페이지는 레이아웃·렌더링 먼저 순서로 추가","impact":"MEDIUM","impactDescription":"파일이 번지기 전에 셸·렌더링 모드·아일랜드 경계를 먼저 정해 정리 작업을 줄임","appliesWhen":"","tags":["workflow","pages","checklist"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"workflow","prose":["새 page를 추가할 때는 화면 마크업부터 급하게 만들지 말고, 먼저 기본 `src/pages/_document.astro` 패턴으로 충분한지,","`_document.astro`와 `_head.astro`의 로컬 `Props`에 어떤 문서 계약이 필요한지, `_document.css`를 건드려야 하는지,","owning route의 `_local/` shell이 필요한지, guard owner, static/on-demand 여부, dynamic route 여부,","island 필요 여부를 정합니다.","이 순서를 따르면 `client:load` 남용이나 route-local ownership 붕괴를 뒤늦게 뜯어내는 일을 줄일 수 있습니다."],"examples":[{"kind":"incorrect","label":"page 파일부터 만들고 나중에 rendering과 shell을 끼워 맞춤","blocks":[{"lang":"text","code":"1. `src/pages/foo.astro`부터 크게 만든다\n2. 브라우저 상호작용이 생기면 일단 `client:load`를 붙인다\n3. 쿠키나 auth가 필요해지면 마지막에 SSR 여부를 고민한다"}]},{"kind":"correct","label":"layout과 rendering 결정을 먼저 고정하고 page를 연다","blocks":[{"lang":"text","code":"1. 이 page가 기본 `src/pages/_document.astro` shell로 충분한지 먼저 판단한다\n2. page가 넘겨야 할 `pageTitle`, `pageDescription`, `currentPathname` 같은 문서 계약을 먼저 정하고 `_document.astro`와 `_head.astro`의 로컬 `Props`에서 끝낼 수 있는지 본다\n3. route-shared body shell이 바뀐다면 `_document.css`와 `_document.astro` 안에서 끝낼 수 있는지 먼저 본다\n4. 이 page를 소유하는 route folder와 그 route의 `_local/` shell이 필요한지 판단한다\n5. auth, redirect, rewrite owner가 page boundary인지 `src/middleware.ts`인지 먼저 정한다\n6. static, `prerender = false`, `output: \"server\"` 중 어떤 rendering 전제가 맞는지 고른다\n7. dynamic route면 `getStaticPaths()`가 필요한지 page boundary에서 정한다\n8. interactive 부분만 island로 빼고 `client:*` 또는 `client:only` 필요성을 고른다\n9. route entry는 body flow를 소유하고, `_local/`에는 runtime/rendering boundary가 있는 조각만 내려갔는지 확인한다"}]}]},{"skill":"astro","id":"workflow-consult-official-docs-for-version-sensitive-astro-features","number":"11.2","title":"Consult Official Docs for Version-sensitive Astro Features","titleKo":"버전 민감한 Astro 기능은 공식 문서 확인","impact":"MEDIUM","impac cal·shared 스타일 스코프 분리","impact":"HIGH","impactDescription":"route 소유 페이지 스타일·공용 컴포넌트 스타일·순수 local 헬퍼 스타일이 같은 namespace나 파일에 섞이는 것을 막음","appliesWhen":"스타일 owner를 route screen/support, document, 독립 leaf helper, reusable widget, UI primitive 중에서 결정하거나 서로 다른 owner를 이동·분리한다.","tags":["route-scope","local-scope","shared-scope","css-files"],"requiresSelected":[],"reviewWith":["organization-keep-style-files-owned-by-one-component-or-route"],"sectionPrefix":"naming","prose":["the same namespace or file)**","","route/framework skill이 route-owned surface로 판단한 스타일은 `rt_*` scope를 유지합니다.","route screen의 흐름을 구성하거나 지원하는 route support surface는 파일이 `_local/` 같은 helper folder로 내려가도","`rt_*`입니다.","route 맥락을 몰라도 되는 독립 leaf helper만 `loc_*`를 사용합니다.","파일 위치만으로 main screen 또는 route support surface를 `loc_*`로 바꾸지 않습니다.","","scope 기준:","","- `rt_*`: route-owned screen, route support surface, route/document owner","- `loc_*`: route 맥락과 독립된 leaf helper","- `wg_*`: 여러 route에서 재사용되는 block","- `ui_*`: primitive component","","서로 다른 owner 범위는 한 파일에 섞지 않습니다.","어떤 markup이 route-owned인지 판단하는 책임은 활성화된 framework convention이 가집니다."],"examples":[{"kind":"incorrect","label":"route surface, local helper, shared component owner를 한 파일/네임스페이스에 섞음","blocks":[{"lang":"txt","code":"entries/_index.css\n  rt_entriesIndex__root\n  loc_filterDialog__root\n  rt_document__content\n  ui_button__root"}]},{"kind":"correct","label":"route owner, document owner, local helper owner를 분리","blocks":[{"lang":"txt","code":"entries/_index.css\n  rt_entriesIndex__root\n  rt_entriesIndex__list\n  rt_entriesIndex__empty\n\npages/_document.css\n  rt_document__body\n  rt_document__content\n\nentries/_local/filter-dialog.css\n  loc_filterDialog__root"}]}]},{"skill":"css","id":"naming-use-scope-slug-element-modifier-syntax","number":"1.6","title":"Use Scope, Slug, Element, and Modifier Syntax","titleKo":"scope·slug·element·modifier 문법 지키기","impact":"CRITICAL","impactDescription":"classname만 보고도 class 소유와 UI 역할을 추적할 수 있게 함","appliesWhen":"plain CSS의 project-owned class를 새로 만들거나 이름, scope, slug, element, modifier 구분자 또는 casing을 변경한다.","tags":["naming","class-grammar","ownership"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"naming","prose":["클래스명은 `\u003cscope>_\u003cslug>__\u003celement>[--\u003cmodifier>]` 문법을 사용합니다.","구분자는 `_`, `__`, `--`를 고정하고, 각 부분의 책임을 섞지 않습니다.","","구성 요소:","","- `scope`: `rt`, `wg`, `ui`, `loc` 같은 lowercase owner namespace","- `slug`: owner 식별자. casing은 해당 scope의 house style을 따름","- `element`: owner 안의 UI 역할. `listButton`, `emptyState`처럼 camelCase","- `modifier`: 상태나 반복 variant. `routeActive`, `selected`처럼 camelCase","","중요한 것은 모든 scope에 같은 slug casing을 강제하는 것이 아니라,","같은 owner 안에서 표기가 흔들리지 않게 유지하는 것입니다."],"examples":[{"kind":"incorrect","label":"scope별 slug 규칙을 섞거나 element/modifier casing이 흔들림","blocks":[{"lang":"txt","code":"ui_tag_list__root\nrt_catalog_page__root\nrt_catalogDetail__main-content\nwg_site_header__brandLink\nrt_document__main-content\nrt_document__main--route_active"}]},{"kind":"correct","label":"scope는 lowercase, slug는 scope별 house style, element/modifier는 camelCase","blocks":[{"lang":"txt","code":"ui_tagList__root\nrt_catalogIndex__root\nrt_catalogDetail__mainContent\nwg_siteHeader__brandLink\nrt_document__main\nrt_document__main--routeActive"}]}]},{"skill":"css","id":"composition-compose-classes-with-clsx","number":"2.1","title":"Compose Classes With `clsx()`","titleKo":"class 조합은 clsx()로","impact":"HIGH","impactDescription":"base class와 상태 modifier를 조합할 때 TSX class 조립을 읽을 수 있게 유지함","appliesWhen":"TSX의 `className`을 추가·수정하거나 base class, modifier, optional class를 조합한다.","tags":["clsx","tsx","className"],"requiresSelected":[],"reviewWith":[],"sectionPrefix":"composition","prose":["TSX에서 `className`은 `clsx()` 사용을 기본으로 합니다.","기본 element 클래스 하나만 넣는 경우도 같은 기준을 유지하고,","상태 modifier나 optional class가 붙어도 읽기 쉽게 확장합니다.","문자열 연결이나 중복 ternary로 `className`을 조립하지 않습니다."],"examples":[{"kind":"incorrect","label":"문자열 연결로 클래스 조합을 숨김","blocks":[{"lang":"tsx","code":"\u003cbutton className={\"rt_catalogIndex__listButton \" + (isActive ? \"rt_catalogIndex__listButton--active\" : \"\")}>\n\t저장\n\u003c/button>"},{"lang":"tsx","code":"\u003cbutton\n\tclassName={clsx(\n\t\t\"rt_catalogIndex__listButton\",\n\t\tisActive && \"rt_catalogIndex__listButton--active\",\n\t)}\n>\n\t저장\n\u003c/button>"}]}]},{"skill":"css","id":"composition-do-not-build-structural-variants-with-modifiers","number":"2.2","title":"Do Not Use Modifiers for One-off Structural Patches","titleKo":"one-off 구조 수정에 modifier 쓰지 않기","impact":"HIGH","impactDescription":"modifier를 두 번째 레이아웃 이름 체계로 만들지 않고 상태 표현에만 남겨둠","appliesWhen":"modifier를 추가·변경하거나 반복 가능한 state·API variant와 one-off structural patch 사이를 판정한다. 허용된 state로 결론 나도 변경된 modifier 분류는 Selected다.","tags":["modifiers","structure","naming"],"requiresSelected":[],"reviewWith":["naming-name-elements-and-modifiers-by-role"],"sectionPrefix":"composition","prose":["modifier는 상태나 반복 variant를 표현할 때만 사용합니다.","","금지:","","- spacing patch","- 방향 보정","- 특정 화면 하나에서만 필요한 구조 차이","","허용:","","- `active`, `hidden`, `disabled`, `selected`, `error` 같은 상태","- `dense`, `horizontal`, `compact`처럼 component API로 반복 노출되는 variant","","금지 대상은 \"상태 의미가 아닌 모든 modifier\"가 아니라, 재사용 contract 없이 생긴 one-off structural modifier입니다.","","이 규칙의 Selected는 modifier가 금지됐다는 뜻이 아니라 변경된 modifier의 계약을 분류했다는 뜻입니다.","`active`·`selected` 같은 허용된 domain state로 결론 나면 `Selected + pass`이며,","위반이 없다는 이유로 N/A로 돌리지 않습니다."],"examples":[{"kind":"incorrect","label":"특정 화면용 구조 patch를 modifier로 덧붙임","blocks":[{"lang":"tsx","code":"\u003cdiv className={clsx(\"rt_catalogDetail__section\", \"rt_catalogDetail__section--compactTop\")} />"}]},{"kind":"correct","label":"one-off patch는 별도 element로 풀고, 반복되는 variant만 제한적으로 허용","blocks":[{"lang":"tsx","code":"\u003cdiv className={clsx(\"rt_catalogDetail__detailSection\")} />"},{"lang":"tsx","code":"\u003cdiv className={clsx(\"ui_table__root\", isDense && \"ui_table__root--dense\")} />"}]}]},{"skill":"css","id":"composition-keep-classes-s
